<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07100d">
  <title>B1F 3D迷宮プロトタイプ | コタマのぼうけん</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07100d;color:#e9e7d8}
    #view{position:fixed;inset:0}
    canvas{display:block;width:100%;height:100%}
    .hud{position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.46),transparent 22%,transparent 72%,rgba(0,0,0,.48))}
    .top{position:absolute;top:max(14px,env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;text-shadow:0 2px 8px #000}
    .title{font-size:12px;letter-spacing:.18em;color:#c5d6b7}.floor{font-size:22px;font-weight:700;letter-spacing:.08em}
    .hint{font-size:11px;color:#d5d9c7;text-align:right;line-height:1.7}
    .center-mark{position:absolute;left:50%;top:50%;width:12px;height:12px;transform:translate(-50%,-50%);opacity:.55}
    .center-mark:before,.center-mark:after{content:"";position:absolute;background:#e8e4c8;box-shadow:0 0 6px #fff}
    .center-mark:before{width:12px;height:1px;top:5px}.center-mark:after{height:12px;width:1px;left:5px}
    .bottom{position:absolute;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:10px;pointer-events:auto}
    button{border:1px solid rgba(207,220,185,.42);background:rgba(7,18,14,.76);color:#f2f0df;border-radius:50%;width:58px;height:58px;font-size:20px;backdrop-filter:blur(8px);touch-action:manipulation}
    button:active{background:rgba(112,142,92,.8);transform:scale(.96)}
    .action{position:absolute;right:18px;bottom:max(28px,env(safe-area-inset-bottom));width:64px;height:64px;font-size:12px;border-radius:18px;pointer-events:auto}
    .legend{position:absolute;left:16px;bottom:max(22px,env(safe-area-inset-bottom));font-size:10px;color:#c8d1b9;line-height:1.6;text-shadow:0 1px 5px #000}
    #status{position:absolute;left:50%;top:calc(50% + 24px);transform:translateX(-50%);font-size:11px;color:#e6dfbd;text-shadow:0 2px 5px #000;white-space:nowrap}
    @media(min-width:760px){.bottom{left:50%;bottom:24px}.legend{bottom:28px}.action{right:28px;bottom:28px}}
  </style>
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}
  </script>
</head>
<body>
  <div id="view"></div>
  <div class="hud">
    <div class="top"><div><div class="title">KOTAMA NO BOUKEN / B1F</div><div class="floor">はじまりの樹海</div></div><div class="hint">3D VISUAL TEST<br>WASD / 矢印キーで移動　Q / Eで旋回</div></div>
    <div class="center-mark"></div><div id="status">古代遺跡の奥から、かすかな光が漏れている……</div>
    <div class="legend">高品質方向性の確認用・仮素材<br>床 / 壁 / 根 / 苔 / 霧 / 光芒</div>
    <div class="bottom"><button data-move="turnL" aria-label="左旋回">↶</button><button data-move="forward" aria-label="前進">▲</button><button data-move="turnR" aria-label="右旋回">↷</button><button data-move="back" aria-label="後退">▼</button></div>
    <button class="action" id="inspect">調べる</button>
  </div>
<script type="module">
import * as THREE from "three";

const host = document.querySelector("#view");
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07110e);
scene.fog = new THREE.FogExp2(0x10201a, 0.035);
const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.08, 90);
camera.position.set(0, 1.68, 5.4);
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
host.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x9ab8a2, 0x15100d, 1.05));
const moon = new THREE.DirectionalLight(0xc4dfc8, 2.0);
moon.position.set(-5, 9, 4); moon.castShadow = true;
moon.shadow.mapSize.set(1024,1024); moon.shadow.camera.left=-12; moon.shadow.camera.right=12; moon.shadow.camera.top=12; moon.shadow.camera.bottom=-12;
scene.add(moon);
const warm = new THREE.PointLight(0x9acb8b, 26, 13, 2);
warm.position.set(0.8,2.5,-7); scene.add(warm);

const mats = {
  stone:new THREE.MeshStandardMaterial({color:0x53635a,roughness:.94}),
  darkStone:new THREE.MeshStandardMaterial({color:0x293b34,roughness:.98}),
  moss:new THREE.MeshStandardMaterial({color:0x385b3d,roughness:1}),
  soil:new THREE.MeshStandardMaterial({color:0x30291f,roughness:1}),
  root:new THREE.MeshStandardMaterial({color:0x3c3023,roughness:.9}),
  crystal:new THREE.MeshStandardMaterial({color:0x80d6c5,emissive:0x1a776a,emissiveIntensity:1.8,roughness:.25,metalness:.08}),
  leaf:new THREE.MeshStandardMaterial({color:0x1d4932,roughness:.82,side:THREE.DoubleSide})
};
const box=(w,h,d,mat,x,y,z,cast=true)=>{
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z);m.castShadow=cast;m.receiveShadow=true;scene.add(m);return m;
};
const floor=box(14,.35,34,mats.soil,0,-.22,-11,false);
for(let z=5;z>-29;z-=4){
  box(14,.12,3.9,mats.darkStone,0,-.035,z,false);
  for(let x=-6;x<=6;x+=2.4) if(Math.random()>.35) {
    const slab=box(2.25,.07,Math.random()*1.5+.5,mats.stone,x,-.005,z+(Math.random()-.5)*1.2,false);
    slab.rotation.y=(Math.random()-.5)*.08;
  }
}
// Ancient side walls and broken masonry.
for(const side of [-1,1]){
  box(.8,5.2,34,mats.darkStone,side*6.9,2.45,-11);
  for(let z=4;z>-28;z-=3.2){
    const pillar=box(.72,4.6,.8,mats.stone,side*6.25,2.2,z);
    pillar.rotation.z=(Math.random()-.5)*.06;
    box(1.15,.45,1.15,mats.moss,side*6.25,4.55,z);
    if(Math.random()>.25) box(.25,.08,1.3,mats.moss,side*5.8,.3,z-.7,false);
  }
}
// Archway at the far end.
for(const x of [-2.1,2.1]) box(.55,4.5,.7,mats.stone,x,2.15,-22);
box(4.7,.65,.9,mats.stone,0,4.35,-22);
box(3.3,.12,.95,mats.moss,0,4.72,-22,false);
// Roots: tapered curved branches, repeated as organic silhouettes.
function makeRoot(points,radius,material){
  const curve=new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(...p)));
  const mesh=new THREE.Mesh(new THREE.TubeGeometry(curve,32,radius,8,false),material);
  mesh.castShadow=true;mesh.receiveShadow=true;scene.add(mesh);return mesh;
}
makeRoot([[-6,4,4],[-4.7,3.5,1],[-3.6,2.8,-3],[-2.5,2.4,-8]],.48,mats.root);
makeRoot([[6,4,-1],[4.8,3.2,-4],[3.4,2.6,-8],[2.7,2.2,-13]],.62,mats.root);
makeRoot([[-5.5,4,-12],[-4,3.4,-14],[-2.8,3,-17],[0,2.5,-19]],.38,mats.root);
makeRoot([[4.5,4,-20],[3.4,3.4,-21],[1.8,3,-23],[0,2.7,-25]],.42,mats.root);
// Hanging roots and large trunks framing the view.
for(const x of [-5.3,5.2]){
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.7,1.15,9,9),mats.root);
  trunk.position.set(x,3.2,-10);trunk.rotation.z=(x<0?-.18:.2);trunk.castShadow=true;scene.add(trunk);
  for(let i=0;i<7;i++){
    const leaf=new THREE.Mesh(new THREE.IcosahedronGeometry(.8+Math.random()*.8,1),mats.leaf);
    leaf.position.set(x+(Math.random()-.5)*2,5+Math.random()*2,-10+(Math.random()-.5)*5);
    leaf.scale.set(1.5,.55,1);leaf.castShadow=true;scene.add(leaf);
  }
}
// Mossy debris and small ferns.
for(let i=0;i<65;i++){
  const x=(Math.random()-.5)*11.5,z=4-Math.random()*31;
  const g=new THREE.IcosahedronGeometry(.15+Math.random()*.38,1);
  const m=new THREE.Mesh(g,Math.random()>.5?mats.moss:mats.stone);
  m.position.set(x,.08+Math.random()*.12,z);m.scale.y=.35;m.rotation.set(Math.random(),Math.random(),Math.random());m.castShadow=true;scene.add(m);
}
// Glowing ancient growths.
for(const [x,y,z] of [[-2.8,.45,-5],[3.1,.55,-12],[-4.4,.5,-18],[1.4,.5,-24]]){
  const crystal=new THREE.Mesh(new THREE.OctahedronGeometry(.28,1),mats.crystal);
  crystal.position.set(x,y,z);crystal.rotation.z=.35;scene.add(crystal);
  const glow=new THREE.PointLight(0x65c9ad,9,5,2);glow.position.set(x,y+.4,z);scene.add(glow);
}
// Low-cost atmospheric motes.
const moteGeo=new THREE.BufferGeometry(), moteCount=180, motePos=new Float32Array(moteCount*3);
for(let i=0;i<moteCount;i++){motePos[i*3]=(Math.random()-.5)*12;motePos[i*3+1]=Math.random()*4.5;motePos[i*3+2]=2-Math.random()*30;}
moteGeo.setAttribute("position",new THREE.BufferAttribute(motePos,3));
const motes=new THREE.Points(moteGeo,new THREE.PointsMaterial({color:0xc2d8ad,size:.035,transparent:true,opacity:.48,depthWrite:false}));
scene.add(motes);
// Light shafts as transparent planes.
const shaftMat=new THREE.MeshBasicMaterial({color:0xb7d9a8,transparent:true,opacity:.055,depthWrite:false,side:THREE.DoubleSide});
for(let i=0;i<5;i++){
  const shaft=new THREE.Mesh(new THREE.PlaneGeometry(.8,8),shaftMat);
  shaft.position.set(-4+i*2,3,-7-i*2);shaft.rotation.z=-.25;scene.add(shaft);
}

let heading=0, moving=false;
const blockers=[{x:0,z:-22,w:4.8,d:.8}];
function tryMove(dir){
  if(moving)return; moving=true;
  const forward=new THREE.Vector3(-Math.sin(heading),0,-Math.cos(heading));
  const right=new THREE.Vector3(Math.cos(heading),0,-Math.sin(heading));
  const v=dir==="forward"?forward:dir==="back"?forward.clone().negate():dir==="left"?right.clone().negate():right;
  const target=camera.position.clone().addScaledVector(v,2);
  target.x=THREE.MathUtils.clamp(target.x,-5.1,5.1);target.z=THREE.MathUtils.clamp(target.z,-26,4.5);
  const start=camera.position.clone(),t0=performance.now(),duration=170;
  function step(t){
    const p=Math.min(1,(t-t0)/duration),ease=p*p*(3-2*p);
    camera.position.lerpVectors(start,target,ease);
    if(p<1)requestAnimationFrame(step);else moving=false;
  }
  requestAnimationFrame(step);
}
function turn(sign){if(!moving)heading+=sign*Math.PI/2;}
document.querySelectorAll("[data-move]").forEach(b=>b.addEventListener("pointerdown",e=>{e.preventDefault();const d=b.dataset.move;if(d==="turnL")turn(1);else if(d==="turnR")turn(-1);else tryMove(d);}));
document.querySelector("#inspect").addEventListener("click",()=>{const s=document.querySelector("#status");s.textContent="苔むした石壁に、古い樹紋が刻まれている。";setTimeout(()=>s.textContent="古代遺跡の奥から、かすかな光が漏れている……",2200);});
addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  if(["arrowup","w"].includes(k))tryMove("forward");
  else if(["arrowdown","s"].includes(k))tryMove("back");
  else if(["arrowleft","a"].includes(k))tryMove("left");
  else if(["arrowright","d"].includes(k))tryMove("right");
  else if(k==="q")turn(1);else if(k==="e")turn(-1);
});
function animate(){
  requestAnimationFrame(animate);
  camera.rotation.set(0,heading,0);
  const t=performance.now()*.001;
  warm.intensity=25+Math.sin(t*1.4)*2;
  motes.rotation.y=Math.sin(t*.08)*.025;
  renderer.render(scene,camera);
}
animate();
addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.setSize(innerWidth,innerHeight);
});
addEventListener("pagehide",()=>{renderer.dispose();});
</script>
</body>
</html>
