<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>B1F 実マップ3D変換テスト</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07110d;color:#edf0df;font-family:system-ui,sans-serif}
#view{position:fixed;inset:0}canvas{display:block}
header{position:fixed;z-index:2;top:max(12px,env(safe-area-inset-top));left:16px;text-shadow:0 2px 8px #000;pointer-events:none}
header small{letter-spacing:.15em;color:#c4d6ad}header h1{font-size:22px;margin:3px 0}
#info{position:fixed;z-index:2;left:16px;bottom:max(16px,env(safe-area-inset-bottom));font-size:11px;text-shadow:0 2px 6px #000;line-height:1.7;pointer-events:none}
#controls{position:fixed;z-index:3;bottom:max(16px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:8px}
button{width:54px;height:54px;border-radius:50%;border:1px solid #a5b99488;background:#102018dd;color:#fff;font-size:20px;touch-action:manipulation}
button:active{background:#526b46}
#mini{position:fixed;z-index:2;right:14px;top:max(14px,env(safe-area-inset-top));width:135px;height:135px;border:1px solid #c7d6a866;background:#07100dcc}
#msg{position:fixed;z-index:2;left:50%;top:58%;transform:translateX(-50%);font-size:12px;text-shadow:0 2px 6px #000;white-space:nowrap}
</style>
</head>
<body>
<div id="view"></div>
<header><small>KOTAMA NO BOUKEN / REAL MAP ADAPTER TEST</small><h1>はじまりの樹海・B1F</h1></header>
<canvas id="mini" width="270" height="270"></canvas>
<div id="msg">実際のFIELD_AREAS[1].floors[0].mapを3D変換しています</div>
<div id="info">実マップの壁・通路を使用<br>← → 旋回 / ↑ 前進 / ↓ 後退</div>
<div id="controls"><button data-action="left">↶</button><button data-action="forward">▲</button><button data-action="right">↷</button><button data-action="back">▼</button></div>
<script src="../data/field-maps.js"></script>
<script>window.__KOTAMA_FIELD_AREAS__ = FIELD_AREAS;</script>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";
import {buildField3DSnapshot} from "../field/3d/field-3d-grid-adapter.js";
import {buildField3DWorld} from "../field/3d/field-3d-world.js";

const source=window.__KOTAMA_FIELD_AREAS__?.[1]?.floors?.[0];
if(!source) throw new Error("B1F floor data was not loaded.");
const grid=source.map.map(row=>row.split(""));
const area={n:1,f:0,key:"1-0",def:window.__KOTAMA_FIELD_AREAS__[1],floor:source,grid,w:grid[0].length,h:grid.length,objects:[]};
const start={tx:1,ty:2}; // 1,1 is a G (solid gather tile) in the current map data.
const fieldState={x:start.tx*32+16,y:start.ty*32+20,dir:"up",moving:false,foes:[],explored:{"1-0":new Uint8Array(grid.length*width).fill(1)},visible:new Set()};
const snapshot=buildField3DSnapshot({area,fieldState,tilePixels:32,isSolidChar:(_a,c)=>"#~ST?G".includes(c)||/[a-z]/.test(c)});
const host=document.querySelector("#view");
const scene=new THREE.Scene();scene.background=new THREE.Color(0x08120e);scene.fog=new THREE.FogExp2(0x15271c,.038);
const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.08,110);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;host.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xa5c6a5,0x17120e,1.15));
const sun=new THREE.DirectionalLight(0xc8e5c2,2.3);sun.position.set(-12,18,10);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const world=buildField3DWorld(THREE,snapshot,{palette:{floor:0x59644c,path:0x71654b,grass:0x38583b,safe:0x777c5a,wall:0x34463a,hazard:0x315d64}});
scene.add(world.group);
const rootMat=new THREE.MeshStandardMaterial({color:0x382b20,roughness:.9});
for(let i=0;i<18;i++){
 const x=(Math.sin(i*12.37)*.5+.5)*snapshot.area.worldWidth;
 const z=(Math.cos(i*7.13)*.5+.5)*snapshot.area.worldDepth;
 const root=new THREE.Mesh(new THREE.CylinderGeometry(.12,.3,4+Math.random()*2,7),rootMat);
 root.position.set(x,2.1,z);root.rotation.z=(Math.random()-.5)*.65;root.castShadow=true;scene.add(root);
}
const glowMat=new THREE.MeshStandardMaterial({color:0x8ce2c5,emissive:0x267b68,emissiveIntensity:1.8});
for(const cell of snapshot.cells.filter(c=>c.terrain==="grass").slice(0,14)){
 const crystal=new THREE.Mesh(new THREE.OctahedronGeometry(.22),glowMat);
 crystal.position.set(cell.world.x,.38,cell.world.z);scene.add(crystal);
}
const tileMap=new Map(snapshot.cells.map(c=>[c.tx+","+c.ty,c]));\ndocument.querySelector("#msg").textContent=`実マップ ${width}×${grid.length} / 開始位置 ${start.tx},${start.ty} / 壁 ${snapshot.cells.filter(c=>c.solid).length}マス`;
let tx=start.tx,ty=start.ty,dir="up",turning=false;
const yaw={up:0,right:-Math.PI/2,down:Math.PI,left:Math.PI/2};
function syncCamera(){const p=snapshot.cells.find(c=>c.tx===tx&&c.ty===ty).world;camera.position.set(p.x,1.68,p.z);camera.rotation.set(0,yaw[dir],0);}
syncCamera();
function act(action){
 if(turning)return;
 if(action==="left"||action==="right"){
   const order=["up","right","down","left"],i=order.indexOf(dir);
   dir=order[(i+(action==="right"?1:3))%4];syncCamera();return;
 }
 const d={up:[0,-1],right:[1,0],down:[0,1],left:[-1,0]}[dir],sign=action==="back"?-1:1;
 const nx=tx+d[0]*sign,ny=ty+d[1]*sign,cell=tileMap.get(nx+","+ny);
 if(!cell||cell.solid){document.querySelector("#msg").textContent="壁が行く手を阻んでいる。";setTimeout(()=>document.querySelector("#msg").textContent="実マップのグリッドデータを3D変換中",1200);return;}
 tx=nx;ty=ny;syncCamera();drawMini();
}
document.querySelectorAll("[data-action]").forEach(b=>b.addEventListener("pointerdown",e=>{e.preventDefault();act(b.dataset.action)}));
addEventListener("keydown",e=>{const map={ArrowUp:"forward",w:"forward",ArrowDown:"back",s:"back",ArrowLeft:"left",a:"left",ArrowRight:"right",d:"right"};if(map[e.key]){e.preventDefault();act(map[e.key]);}});
function drawMini(){
 const c=document.querySelector("#mini"),g=c.getContext("2d"),cell=10;
 g.clearRect(0,0,c.width,c.height);g.fillStyle="#07110d";g.fillRect(0,0,c.width,c.height);
 for(const item of snapshot.cells){g.fillStyle=item.solid?"#34443a":item.terrain==="grass"?"#638653":"#b2ae87";g.fillRect(item.tx*cell+5,item.ty*cell+5,cell-1,cell-1);}
 g.fillStyle="#f6e9a4";g.beginPath();g.arc(tx*cell+10,ty*cell+10,4,0,Math.PI*2);g.fill();
}
drawMini();
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.setSize(innerWidth,innerHeight)});
function animate(){requestAnimationFrame(animate);renderer.render(scene,camera)}animate();
addEventListener("pagehide",()=>{world.dispose();renderer.dispose()});
</script>
</body>
</html>
