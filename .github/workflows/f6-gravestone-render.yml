name: F6 Broken Gravestone Blender Render
on:
  push:
    branches:
      - feature/f6-broken-gravestone-20261112
  pull_request:
    branches: [development]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate Blender script syntax
        run: python3 -m py_compile tools/floor6/broken_gravestone.py
      - name: Diagnose runner and Blender availability
        run: |
          set -euxo pipefail
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Ref: $GITHUB_REF"
          echo "SHA: $GITHUB_SHA"
          echo "Run URL: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          echo "Run URL: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          blender --version
          blender -b --python-expr 'import numpy; print("Blender numpy:", numpy.__version__)'
          test -f tools/floor6/broken_gravestone.py
      - name: Generate GLB and three rendered views
        run: |
          set -euxo pipefail
          mkdir -p render-output/floor6
          blender -b -t 2 --python tools/floor6/broken_gravestone.py 2>&1 | tee render-output/floor6/blender.log
      - name: Validate outputs and publish summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          base=Path("render-output/floor6")
          names=["broken_gravestone_v1.glb"]+[f"broken_gravestone_v1_{view}.png" for view in ("front","side","angle")]
          lines=["## Floor 6 broken gravestone render verification", ""]
          failed=False
          for name in names:
              p=base/name
              ok=p.is_file() and p.stat().st_size>100
              if ok:
                  header=p.open("rb").read(12)
                  ok=header[:4]==(b"glTF" if p.suffix==".glb" else b"\x89PNG")
              failed |= not ok
              lines.append(f"- {'PASS' if ok else 'FAIL'}: {name} ({p.stat().st_size if p.exists() else 0} bytes)")
          report="\n".join(lines)+"\n"
          base.mkdir(parents=True,exist_ok=True)
          (base/"verification.md").write_text(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:f.write(report)
          if failed: raise SystemExit("GLB/PNG validation failed; inspect blender.log")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: floor6-broken-gravestone-v1
          path: render-output/floor6/
          if-no-files-found: warn
          retention-days: 14

      - name: Post run result and artifact link to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'feature/f6-broken-gravestone-20261112';
            const prs = await github.rest.pulls.list({owner, repo, state:'open', head: owner + ':' + branch});
            const pr = prs.data.find(p => p.base.ref === 'development');
            if (!pr) { core.warning('No open development PR found for ' + branch); return; }
            const path = 'render-output/floor6/verification.md';
            const report = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : 'No verification report was produced.';
            const url = 'https://github.com/' + owner + '/' + repo + '/actions/runs/' + context.runId;
            const body = [
              '<!-- f6-gravestone-render-report -->',
              '### F6 Gravestone Blender run',
              'Commit: ' + context.sha,
              'Run: ' + url,
              'Artifact name: floor6-broken-gravestone-v1 (open run page to download)',
              '',
              report
            ].join('\\n');
            await github.rest.issues.createComment({owner, repo, issue_number: pr.number, body});

      - name: Promote user-approved V19 from verified prior run
        if: github.event_name == 'push' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/${GITHUB_REPOSITORY}/actions/runs/43223467100 --jq '.conclusion' | grep -qx success
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/13947301249/zip > /tmp/approved-v19.zip
          mkdir -p /tmp/approved-v19
          unzip -q /tmp/approved-v19.zip -d /tmp/approved-v19
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          src=Path('/tmp/approved-v19')
          dest=Path('assets/models/floor6')
          review=dest/'reviews/broken-gravestone-v19'
          review.mkdir(parents=True,exist_ok=True)
          for source,target in [('broken_gravestone_v1.glb',dest/'broken_gravestone_v19.glb'),
            ('broken_gravestone_v1_front.png',review/'front.png'),
            ('broken_gravestone_v1_side.png',review/'side.png'),
            ('broken_gravestone_v1_angle.png',review/'angle.png')]:
            matches=list(src.rglob(source))
            assert len(matches)==1,(source,matches)
            f=matches[0]
            assert 1000<f.stat().st_size<100_000_000,(source,f.stat().st_size)
            assert f.open('rb').read(4)==(b'glTF' if source.endswith('.glb') else bytes([137,80,78,71]))
            shutil.copyfile(f,target)
          (review/'README.md').write_text(
            '# Approved Floor 6 gravestone V19\\n\\n'
            'Approved by user on 2026-11-12.\\n'
            'Source run: https://github.com/koda24-cell/kotama-no-bouken/actions/runs/43223467100\\n'
            'Source commit: 91829d08067540ec2c8cdfcde522d685f3b185b6\\n'
            'Model: assets/models/floor6/broken_gravestone_v19.glb\\n'
            'Review images: front.png, side.png, angle.png\\n'
            'Game integration and optimization are separate tasks.\\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/models/floor6
          if ! git diff --cached --quiet; then
            git commit -m 'Promote approved floor 6 gravestone V19 assets'
            git push origin HEAD:feature/f6-broken-gravestone-20261112
          fi
