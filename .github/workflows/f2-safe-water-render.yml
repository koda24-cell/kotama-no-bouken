name: F2 Water - Scan Then Blender Render
on:
  push:
    branches:
      - feature/f2-safe-water-render-20261119
    paths:
      - 'tools/f2-water/**'
      - '.github/workflows/f2-safe-water-render.yml'
  workflow_dispatch:
concurrency:
  group: f2-water-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  scan-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout isolated candidate
        uses: actions/checkout@v4
      - name: Install malware scanner, Blender and Python image parser
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y clamav clamav-freshclam blender python3-pil python3-cairosvg
          command -v clamscan
          command -v blender
      - name: Update ClamAV signatures (fail closed)
        run: |
          set -euo pipefail
          sudo systemctl stop clamav-freshclam || true
          ok=0
          for attempt in 1 2 3; do
            if sudo freshclam; then ok=1; break; fi
            sleep $((attempt*15))
          done
          test "$ok" = 1
          clamscan --version | tee scan-version.txt
      - name: Download to quarantine and scan before decoding
        id: scan
        run: |
          set -euo pipefail
          python3 tools/f2-water/safe_acquire.py
      - name: Rasterize tracked V7 color-alpha and shoreline textures
        if: steps.scan.outcome == 'success'
        run: |
          set -euo pipefail
          /usr/bin/python3 tools/f2-water/rasterize_v7_textures.py
      - name: Blender Cycles front side angle
        if: steps.scan.outcome == 'success'
        env:
          BLENDER_USER_SCRIPTS: /tmp/f2-empty-blender-scripts
        run: |
          set -euo pipefail
          mkdir -p "$BLENDER_USER_SCRIPTS"
          blender --background --factory-startup --disable-autoexec --python tools/f2-water/render_water.py
      - name: Validate output files and hashes
        if: steps.scan.outcome == 'success'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          folder=pathlib.Path("out/f2-water")
          m=json.loads((folder/"render_manifest.json").read_text())
          assert m["status"]=="NOT_APPROVED"
          for name in ("front","side","angle"):
              path=folder/(name+".png")
              assert path.read_bytes()[:8]==bytes.fromhex("89504e470d0a1a0a")
              assert path.stat().st_size>10000
          PY
      - name: Always write factual execution report
        if: always()
        run: python3 tools/f2-water/report_run.py
      - name: Upload safe result reports and candidate render (never upload quarantine)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f2-water-scan-render-candidate
          path: |
            out/f2-water/scan_manifest.json
            out/f2-water/execution_report.json
            out/f2-water/render_manifest.json
            out/f2-water/front.png
            out/f2-water/side.png
            out/f2-water/angle.png
            out/f2-water/f2-water-surface-v7-height.png
            out/f2-water/v7_water_surface_color_alpha.png
            out/f2-water/v7_ai_water_surface_color_alpha_1024.png
            out/f2-water/v7_shore_foam_alpha.png
            out/f2-water/v7_texture_manifest.json
            out/f2-water/f2-water-v13.blend
            scan-version.txt
          retention-days: 14
          if-no-files-found: warn

  publish-run-link:
    needs: scan-render
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: write
      actions: read
    steps:
      - name: Fetch only safe reports from this run
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: f2-water-scan-render-candidate
          path: f2-report
      - name: Publish or update run link on matching PR
        uses: actions/github-script@v7
        env:
          SOURCE_BRANCH: feature/f2-safe-water-render-20261119
          SCAN_JOB_RESULT: ${{ needs.scan-render.result }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const path = 'f2-report/out/f2-water/execution_report.json';
            let report = null;
            try {
              report = JSON.parse(fs.readFileSync(path, 'utf8'));
            } catch (err) {
              core.warning('Execution report absent or invalid: ' + err.message);
            }
            const { owner, repo } = context.repo;
            const runsUrl = 'https://github.com/' + owner + '/' + repo + '/actions/runs/' + context.runId;
            const {data: prs} = await github.rest.pulls.list({
              owner, repo, state: 'open', head: owner + ':' + process.env.SOURCE_BRANCH, per_page: 100
            });
            if (prs.length !== 1) {
              core.warning('No unique open target PR, run URL: ' + runsUrl);
              return;
            }
            const prNumber = prs[0].number;
            const marker = '<!-- f2-water-run-status -->';
            const body = [
              marker,
              '### 第2層・水 / 最新の実行結果',
              '- **Run**: ' + runsUrl,
              '- **GitHub Actions job**: ' + process.env.SCAN_JOB_RESULT,
              '- **安全検査**: ' + (report?.safety_check ?? 'UNVERIFIED — report unavailable'),
              '- **取得・スキャン状態**: ' + (report?.scan_status ?? 'UNKNOWN'),
              '- **レンダリング状態**: ' + (report?.render_status ?? 'UNKNOWN'),
              '- **成果物**: Run ページの Artifacts を確認（存在・品質は別検証）',
              '- **品質承認**: NOT_APPROVED',
              '- **実行時刻**: ' + new Date().toISOString(),
              '',
              '※ウイルス検査の合格だけで最終素材を承認しません。実行ログと実PNGの確認が必要です。'
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments,
              {owner, repo, issue_number: prNumber, per_page: 100});
            const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            try {
              if (existing) {
                await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body});
              } else {
                await github.rest.issues.createComment({owner, repo, issue_number: prNumber, body});
              }
              core.info('Run URL published to PR #' + prNumber + ': ' + runsUrl);
            } catch (error) {
              if (error.status === 403) {
                core.warning('PR comment denied by repository token permissions. Execution status and artifacts remain accessible at ' + runsUrl);
                await core.summary.addHeading('F2 Water run (PR comment permissions denied)', 3)
                  .addRaw('Run: ' + runsUrl + '\\n\\n')
                  .addRaw('Scan/render job: ' + process.env.SCAN_JOB_RESULT + '\\n\\n')
                  .addRaw('Safety: ' + (report?.safety_check ?? 'UNVERIFIED') + '\\n\\n')
                  .write();
              } else {
                throw error;
              }
            }
