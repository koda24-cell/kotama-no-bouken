name: Ore Crystal Blender Preview (experimental)
on:
  push:
    branches:
      - feature/gpt-procedural-ore-generator-20261118
    paths:
      - 'tools/ore/**'
      - '.github/workflows/ore-crystal-preview.yml'
  workflow_dispatch:
    inputs:
      variant:
        description: 'normal, rare, luminous, ice, volcanic'
        required: false
        default: normal
permissions:
  contents: read
  pull-requests: write
jobs:
  ore-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          blender -b --python-expr 'import numpy; print("Blender numpy:", numpy.__version__)'
          blender --version
      - name: Generate actual Blender GLB and four-view PNG
        env:
          VARIANT: ${{ github.event.inputs.variant || 'normal' }}
        run: |
          mkdir -p ore-output
          blender -b -t 2 --python tools/ore/generate_ore.py -- --out "$PWD/ore-output" --variant "$VARIANT" --seed 17
      - name: Verify generated files
        run: |
          python3 - <<'PY'
          import json, pathlib, hashlib
          p=pathlib.Path("ore-output/manifest.json")
          d=json.loads(p.read_text())
          assert d["status"]=="NOT_APPROVED"
          assert len(d["files"])==5
          for name, expected in d["files"].items():
              f=p.parent/name
              assert f.is_file() and f.stat().st_size>1000, name
              assert hashlib.sha256(f.read_bytes()).hexdigest()==expected, name
          print("verified", sorted(d["files"]))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ore-prototype-not-approved
          path: ore-output/
          retention-days: 14
      - name: Record run result in job summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "### Ore crystal Blender result"
            echo "- Result: $JOB_STATUS"
            echo "- Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Branch: ${{ github.ref_name }}"
            echo "- Artifact: ore-prototype-not-approved (if uploaded)"
            echo "- Review only: not approved for game integration"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Report result to matching PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const head = context.ref.replace('refs/heads/', '');
            const prs = await github.rest.pulls.list({owner, repo, state:'open', head: owner + ':' + head});
            if (!prs.data.length) { core.info('No open PR for ' + head); return; }
            const status = '${{ job.status }}';
            const body = [
              '### Ore crystal Blender run',
              '- Status: **' + status + '**',
              '- [Execution logs and artifacts](https://github.com/' + owner + '/' + repo + '/actions/runs/' + context.runId + ')',
              '- Artifact: `ore-prototype-not-approved` (when upload succeeded)',
              '- Not approved for promotion. Review four-view PNG and GLB before integration.'
            ].join('\n');
            await github.rest.issues.createComment({owner, repo, issue_number: prs.data[0].number, body});
