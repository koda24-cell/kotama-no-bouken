name: B2 Single Rim V03 Fine Grained Wood Blender Review
on:
  push:
    branches: [feature/gpt-b2-waterwheel-rim-segment-v01-20261118]
    paths:
      - "tools/b2-waterwheel-rim/build_rim_v03_resume.py"
      - ".github/workflows/b2-waterwheel-rim-v03.yml"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Record actual run
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p docs/3d/b2-waterwheel-rim
          echo "{\"run_id\":${RUN_ID},\"status\":\"RUNNING_NOT_APPROVED\"}" > /tmp/b2-rim-v03.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feature/gpt-b2-waterwheel-rim-segment-v01-20261118
          git reset --hard origin/feature/gpt-b2-waterwheel-rim-segment-v01-20261118
          cp /tmp/b2-rim-v03.json docs/3d/b2-waterwheel-rim/latest-v03.json
          git add docs/3d/b2-waterwheel-rim/latest-v03.json
          git commit -m "chore(b2): V03 rim single wood run" || true
          git push origin HEAD:feature/gpt-b2-waterwheel-rim-segment-v01-20261118
      - name: Restore V02 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: b2-waterwheel-single-rim-v02
          run-id: 44228783602
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: checkpoint
      - name: Hash source and prep output
        run: |
          echo "513693170a01179d4a468a25848fac15efc7f864facbbdb8ff1f4512527eddb0  checkpoint/b2_waterwheel_single_rim_segment_v02.blend" | sha256sum -c
          mkdir -p render-output/b2-waterwheel-rim-v03
      - name: Fetch CC0 fine-grained single-timber PBR photo maps
        run: |
          for name in col nor_gl rough; do
            src="https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/fine_grained_wood/fine_grained_wood_${name}_1k.jpg"
            dest="render-output/b2-waterwheel-rim-v03/fine_grained_wood_${name}_1k.jpg"
            if curl -fLsS --retry 2 --max-time 65 "$src" -o "$dest"; then
              echo "PHOTO_LOADED_FOR_BLENDER $name $(wc -c < "$dest")"
            else
              rm -f "$dest";echo "PHOTO_DOWNLOAD_FAILED $name"
            fi
          done
      - name: Blender V03 revise single timber PBR and 4 views
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace lscr.io/linuxserver/blender:latest /blender/blender -b -t 2 --python tools/b2-waterwheel-rim/build_rim_v03_resume.py -- checkpoint/b2_waterwheel_single_rim_segment_v02.blend render-output/b2-waterwheel-rim-v03
      - name: Verify Blend GLB 4 PNGs and photo images
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,struct
          p=Path('render-output/b2-waterwheel-rim-v03')
          m=json.loads((p/'b2_waterwheel_single_rim_segment_v03_manifest.json').read_text())
          assert m['status']=='NOT_APPROVED' and m['original_rim_geometry_preserved']
          assert len(m['files'])==6
          for name,meta in m['files'].items():
            b=(p/name).read_bytes()
            assert len(b)==meta['bytes'] and hashlib.sha256(b).hexdigest()==meta['sha256']
            if name.endswith('.png'):assert b[:8]==bytes.fromhex('89504e470d0a1a0a')
            if name.endswith('.glb'):
              assert b[:4]==b'glTF'
              n=struct.unpack_from('<I',b,12)[0]
              j=json.loads(b[20:20+n]);assert len(j.get('images',[]))>=4
          print('RIM_V03_BLENDER_VERIFIED',m['three_photo_maps_actually_applied'])
          PY
      - name: Temporary unapproved review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b2-waterwheel-single-rim-v03
          path: render-output/b2-waterwheel-rim-v03/
          retention-days: 14
          if-no-files-found: warn
