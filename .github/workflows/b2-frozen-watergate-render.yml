name: B2 Frozen Watergate Blender Docker
on:
  push:
    branches:
      - feature/b2-frozen-watergate-docker-20261112
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Pull Blender Docker
        run: docker pull lscr.io/linuxserver/blender:latest
      - name: Build B2 watergate and render 3 views
        run: |
          mkdir -p render-output/b2-watergate
          docker run --rm --user "$(id -u):$(id -g)" --entrypoint /usr/bin/blender \
            -v "$PWD:/work" -w /work lscr.io/linuxserver/blender:latest \
            -b -t 2 --python tools/b2-render/build-watergate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b2-frozen-watergate-blender
          path: render-output/b2-watergate/
          retention-days: 14
