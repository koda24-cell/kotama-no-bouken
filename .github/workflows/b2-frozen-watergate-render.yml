name: B2 Frozen Watergate Blender Docker
on:
  push:
    branches:
      - feature/b2-frozen-watergate-docker-20261112
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  render:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    container:
      image: ghcr.io/koda24-cell/kotama-blender53-clamav@sha256:5ce601f79b1ab09405b3ebc36b1a596be76cb8b105b1524fcbafcb186ebf7e99
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 55
    steps:
      - name: Assert Blender 5.3.0
        run: blender --version | head -n 1 | grep -Fx 'Blender 5.3.0'
      - uses: actions/checkout@v4
      - name: Refresh ClamAV signatures
        run: bash tools/security/clamav_scan_gate.sh update qa/security
      - name: Scan Blender source before execution
        run: bash tools/security/clamav_scan_gate.sh scan tools/b2-render/build-watergate.py qa/security/source.log
      - name: Build B2 watergate and render 3 views
        run: |
          mkdir -p render-output/b2-watergate
          HOME=/tmp/blender-home blender -b -t 2 --python tools/b2-render/build-watergate.py
      - name: Scan generated GLB and PNG candidates
        run: bash tools/security/clamav_scan_gate.sh scan render-output/b2-watergate qa/security/output.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b2-frozen-watergate-blender
          path: |
            render-output/b2-watergate/
            qa/security/
          retention-days: 14
