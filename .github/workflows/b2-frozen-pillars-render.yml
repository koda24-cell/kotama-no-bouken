name: B2 Frozen Ancient Pillars Blender
on:
  push:
    branches:
      - feature/b2-frozen-ruin-pillars-20261112
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Render 3 pillar variants as GLB and 9 PNG
        run: |
          mkdir -p render-output
          docker pull lscr.io/linuxserver/blender:latest
          docker run --rm --user "$(id -u):$(id -g)" --entrypoint /usr/bin/blender \
            -v "$PWD:/work" -w /work lscr.io/linuxserver/blender:latest \
            -b -t 2 --python tools/b2-3d/create-frozen-pillars.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b2-frozen-ancient-pillars-review
          path: render-output/
          retention-days: 14
