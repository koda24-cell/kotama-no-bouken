name: Goblin image lossless conversion
on:
  push:
    branches:
      - feature/gpt-field-status-large-20261126
    paths:
      - tools/optimize-goblin-image.py
      - .github/workflows/goblin-image-lossless.yml
      - assets/monsters/goburinn.png
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: goblin-lossless-${{ github.ref }}
  cancel-in-progress: true
jobs:
  optimize:
    if: github.ref == 'refs/heads/feature/gpt-field-status-large-20261126'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python tools/optimize-goblin-image.py
      - name: Verify original and save results
        run: |
          git diff --exit-code -- assets/monsters/goburinn.png
          git add -u
          git add assets/monsters/goburinn-lossless-report.json
          if test -f assets/monsters/goburinn.webp; then git add assets/monsters/goburinn.webp; fi
          if git diff --cached --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Add verified pixel-identical goblin sprite"
          git push origin HEAD:refs/heads/feature/gpt-field-status-large-20261126
      - uses: actions/upload-artifact@v4
        with:
          name: goblin-lossless-report
          path: assets/monsters/goburinn-lossless-report.json
          retention-days: 14
