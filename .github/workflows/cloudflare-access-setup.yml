name: Cloudflare Access setup (e-mail allow list)
# Creates/updates the approved-email Access policy and the two self-hosted
# applications (project pages.dev + wildcard deployments), then runs the
# read-only audit and the unauthenticated HTTP gate.
# Trigger: push to the feature branch that changes access-config.json
# (bump "revision" to re-run). Needs CLOUDFLARE_ACCESS_TOKEN and
# ACCESS_ALLOWED_EMAILS secrets; see docs/CLOUDFLARE_ACCESS_SETUP.md.
on:
  push:
    branches: [feature/gpt-cloudflare-private-preview-preflight-20261127]
    paths:
      - '.github/workflows/cloudflare-access-setup.yml'
      - 'tools/cloudflare-preview/access-config.json'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: cloudflare-access-admin
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'koda24-cell/kotama-no-bouken' && github.ref == 'refs/heads/feature/gpt-cloudflare-private-preview-preflight-20261127'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: tools/cloudflare-preview
      - name: Apply e-mail-only Access policy to both hostnames
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCESS_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_TOKEN }}
          ACCESS_ALLOWED_EMAILS: ${{ secrets.ACCESS_ALLOWED_EMAILS }}
        run: python3 tools/cloudflare-preview/access_admin.py apply
      - name: Allow Access settings to propagate
        run: sleep 45
  gate:
    needs: apply
    uses: ./.github/workflows/cloudflare-access-gate.yml
    secrets: inherit
