name: Design engine blueprint V1
on:
  push:
    branches: [feature/design-engine-blueprint-v1-20261124]
    paths: ['tools/design-engine/**', '.github/workflows/design-engine-blueprint-v1.yml']
  pull_request:
    paths: ['tools/design-engine/**', '.github/workflows/design-engine-blueprint-v1.yml']
permissions:
  contents: read
jobs:
  blueprint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install CairoSVG==2.7.1 Pillow==11.3.0 numpy==2.2.6 trimesh==4.7.4
      - run: python -m unittest discover -s tools/design-engine -v
      - run: |
          python tools/design-engine/blueprint.py tools/design-engine/example.json review-output
          python tools/design-engine/export_png.py review-output/V01
      - name: Analyze a committed reference GLB
        run: |
          REF_GLB=assets/3d/dungeons/b1_ancient_forest/props/blue_wisp_torch.glb
          python tools/design-engine/reference_materials.py "$REF_GLB" review-output/reference-materials.json
          python tools/design-engine/reference_pixels.py "$REF_GLB" review-output/reference-pixels.json
          python tools/design-engine/reference_uv.py "$REF_GLB" review-output/uv-preview 512
      - uses: actions/upload-artifact@v4
        with:
          name: design-blueprint-v1
          path: review-output/
          if-no-files-found: error
          retention-days: 14
