name: Blender sprite render

# 3Dモデル/プリミティブからゲーム用の透過PNGスプライトを書き出す
on:
  workflow_dispatch:
    inputs:
      job:
        description: "ジョブJSON（空欄なら tools/blender/jobs/*.json を全部）"
        required: false
        default: ""
      commit_output:
        description: "生成PNGをこのブランチにコミットする"
        type: boolean
        default: false
  pull_request:
    paths:
      - "tools/blender/**"
      - ".github/workflows/blender-sprites.yml"

concurrency:
  group: blender-sprites-${{ github.ref }}
  cancel-in-progress: true

env:
  BLENDER_MAJOR: "4.2"
  BLENDER_VERSION: "4.2.3"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Download Blender
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/blender
          curl -fL --retry 3 -o blender.tar.xz \
            "https://download.blender.org/release/Blender${BLENDER_MAJOR}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          tar -xf blender.tar.xz -C ~/blender --strip-components=1
          rm blender.tar.xz

      - name: Install runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6

      - name: Render sprites
        run: |
          set -e
          ~/blender/blender --version | head -1
          if [ -n "${{ github.event.inputs.job }}" ]; then
            JOBS="${{ github.event.inputs.job }}"
          else
            JOBS=$(ls tools/blender/jobs/*.json)
          fi
          for j in $JOBS; do
            echo "::group::$j"
            ~/blender/blender -b --factory-startup --python-exit-code 1 \
              -P tools/blender/render_sprites.py -- "$j"
            echo "::endgroup::"
          done

      - name: Upload sprites
        uses: actions/upload-artifact@v4
        with:
          name: sprites
          path: assets/generated/
          if-no-files-found: error

      - name: Commit sprites
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.commit_output == 'true' && github.ref != 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/generated/
          git diff --cached --quiet || git commit -m "Render sprites via Blender"
          git push
