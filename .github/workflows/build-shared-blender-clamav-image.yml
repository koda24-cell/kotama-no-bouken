name: Build shared Blender + ClamAV image
on:
  push:
    branches:
      - development
      - feature/shared-blender-clamav-container-20261119
    paths:
      - '.github/docker/blender-clamav/**'
      - '.github/workflows/build-shared-blender-clamav-image.yml'
      - 'tools/security/clamav_scan_gate.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-blender-clamav-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish reusable image (only when Dockerfile changes)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/blender-clamav/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/koda24-cell/kotama-blender-clamav:ubuntu24.04-v1
            ghcr.io/koda24-cell/kotama-blender-clamav:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
      - name: Record published digest
        run: |
          set -euo pipefail
          echo "Image: ghcr.io/koda24-cell/kotama-blender-clamav@${{ steps.build.outputs.digest }}"
          test -n "${{ steps.build.outputs.digest }}"
  scan-gate-smoke:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/koda24-cell/kotama-blender-clamav@${{ needs.publish.outputs.digest }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Confirm preinstalled tools (no apt)
        shell: bash
        run: |
          set -euo pipefail
          blender --version | head -n 2
          clamscan --version
          freshclam --version
          python3 --version
          command -v git
      - name: Update signatures with actual freshclam
        shell: bash
        run: bash tools/security/clamav_scan_gate.sh update qa/security
      - name: Real source scan
        shell: bash
        run: bash tools/security/clamav_scan_gate.sh scan tools/security/clamav_scan_gate.sh qa/security/source.log
      - name: Verify ClamAV detects EICAR test signature
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          # Benign EICAR antivirus self-test, constructed locally; not a downloaded asset.
          s = 'X5O!P%@AP[4\\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*'
          Path('/tmp/kotama-eicar.com').write_bytes(s.encode('ascii'))
          PY
          set +e
          clamscan --no-summary /tmp/kotama-eicar.com > qa/security/eicar.log 2>&1
          rc=$?
          set -e
          cat qa/security/eicar.log
          rm -f /tmp/kotama-eicar.com
          test "$rc" -eq 1
          grep -q 'FOUND' qa/security/eicar.log
          echo 'EICAR_DETECTION_PASS' > qa/security/eicar-status.txt
      - name: Real Blender PNG render, GLB export and output malware scan
        shell: bash
        run: |
          set -euo pipefail
          HOME=/tmp/blender-home blender -b -t 2 --python .github/docker/blender-clamav/smoke.py
          python3 - <<'PY'
          from pathlib import Path
          png = Path("qa/container-smoke/smoke.png").read_bytes()
          glb = Path("qa/container-smoke/smoke.glb").read_bytes()
          assert png[:8] == b"\x89PNG\r\n\x1a\n", "PNG signature mismatch"
          assert glb[:4] == b"glTF", "GLB signature mismatch"
          assert len(png) > 100 and len(glb) > 100
          print("SMOKE_FILE_HEADERS_PASS")
          PY
          bash tools/security/clamav_scan_gate.sh scan qa/container-smoke qa/security/generated.log
      - name: Upload QA logs even if scan fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-blender-clamav-container-qa
          path: |
            qa/security/
            qa/container-smoke/
          retention-days: 14
