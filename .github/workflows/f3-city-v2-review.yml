name: F3 V2 final source audit and individual statue LOD review
on:
  push:
    branches: [feature/f3-industrial-ruins-20261124]
    paths: [.github/workflows/f3-city-v2-review.yml]
concurrency:
  group: f3-industrial-production
  cancel-in-progress: false
permissions:
  contents: write
  packages: read
jobs:
  signature-seed:
    runs-on: ubuntu-24.04
    steps:
      - name: Retrieve signed definitions from pinned official preloaded image
        run: |
          set -euo pipefail
          image='clamav/clamav@sha256:9b2f34be1f8be02f58edb1c8868dca99d6e04f8f8daf191f8448c762f563dde3'
          docker pull "$image"
          container=$(docker create "$image")
          trap 'docker rm -f "$container" >/dev/null' EXIT
          mkdir -p definitions
          docker cp "$container:/var/lib/clamav/." definitions/
          find definitions -maxdepth 1 -type f -printf "%f\n"
          test -s definitions/daily.cvd
          test -s definitions/daily-28191.cvd.sign
          cd definitions
          sha256sum *.cvd *.cvd.sign > SHA256SUMS
          printf '%s\n' "$image" > official-image.txt
      - uses: actions/upload-artifact@v4
        with:
          name: f3-official-clamav-seed-${{ github.run_id }}
          path: definitions/
          retention-days: 3
  shared-audit:
    uses: ./.github/workflows/shared-3d-performance-audit.yml
    with:
      asset_glob: assets/3d/dungeons/b3_industrial_candidates/v2_*/props/*.glb
  opaque-review:
    needs: signature-seed
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        asset: [v2_memory_statue]
    uses: ./.github/workflows/f3-industrial-review-one.yml
    with:
      asset: ${{ matrix.asset }}
