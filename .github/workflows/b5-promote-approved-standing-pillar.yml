name: Promote approved B5 standing Gothic pillar
on:
  push:
    branches: [feature/b5-gate-surrounding-pillars-rubble-20261113]
    paths: ['.github/workflows/b5-promote-approved-standing-pillar.yml']
permissions:
  contents: write
  actions: read
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Retrieve user-approved Blender render (run 43444201112)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/b5-approved
          gh run download 43444201112 -R "${{ github.repository }}" -n b5-standing-gothic-pillar-glb-png -D /tmp/b5-approved
          find /tmp/b5-approved -maxdepth 2 -type f -print
      - name: Validate and store approved GLB and 3 view PNGs
        run: |
          set -euo pipefail
          mkdir -p assets/models/floor5/reviews/b5-standing-gothic-pillar
          glb=/tmp/b5-approved/b5-standing-gothic-pillar.glb
          test -s "$glb"
          test "$(head -c 4 "$glb")" = "glTF"
          cp "$glb" assets/models/floor5/b5-standing-gothic-pillar.glb
          for view in front back high-angle; do
            png="/tmp/b5-approved/b5-standing-gothic-pillar-${view}.png"
            test -s "$png"
            test "$(od -An -tx1 -N8 "$png" | tr -d ' \n')" = "89504e470d0a1a0a"
            cp "$png" "assets/models/floor5/reviews/b5-standing-gothic-pillar/"
          done
          cat > assets/models/floor5/reviews/b5-standing-gothic-pillar/README.md <<'EOF'
          # Approved standing Gothic pillar — floor 5
          User-approved on 2026-11-14.
          Source: field/assets/b5-gate-companion-assets.js
          Export: tools/b5-render/export-standing-pillar.mjs
          Render: https://github.com/koda24-cell/kotama-no-bouken/actions/runs/43444201112
          Original approved commit: 6c2720316eb5aba7d6f2d76ec3736ae9bef62a31
          Claude: use GLB directly or createB5GateCompanion(THREE,'standing-pillar',seed).
          The approved geometry must not be changed without a new user request.
          EOF
      - name: Commit approved assets to this feature branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/models/floor5/b5-standing-gothic-pillar.glb assets/models/floor5/reviews/b5-standing-gothic-pillar/
          git diff --cached --quiet && exit 0
          git commit -m "Promote user-approved B5 standing pillar GLB and Blender review PNGs"
          git push
