name: B5 Ruined Knight Sentinel V14 Blender Render
on:
  push:
    branches: [feature/gpt-b5-knight-statues-v1-20261116]
    paths:
      - 'tools/b5-knights/**'
      - '.github/workflows/b5-knight-sentinel-render.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-pil python3-numpy
          blender --version
      - name: Fetch optional official CC0 stone photography
        run: |
          python3 tools/b5-knights/fetch_photo.py
          python3 tools/b5-knights/tone_photo.py
      - name: Build portable sentinel GLB and 3 view PNG
        run: |
          mkdir -p render-output/b5-knights/sentinel_v14
          blender -b -t 2 --python-exit-code 1 --python tools/b5-knights/build_sentinel_v14.py
      - name: Verify artifact and images
        run: |
          /usr/bin/python3 - <<'PY'
          import json,struct
          from pathlib import Path
          from PIL import Image,ImageStat
          p=Path('render-output/b5-knights/sentinel_v14')
          m=json.loads((p/'manifest.json').read_text())
          assert m['approval']=='NOT_APPROVED'
          assert 6.35 < m['head_units'] < 8.0,m.get('head_units')
          data=(p/'sentinel_v14.glb').read_bytes()
          assert data[:4]==b'glTF' and struct.unpack_from('<I',data,8)[0]==len(data)
          for v in ('front','side','angle'):
              with Image.open(p/f'{v}.png') as im:
                  im.load()
                  assert im.size==(800,800),im.size
                  assert min(ImageStat.Stat(im.convert('RGB')).stddev)>1,'flat render'
          print('VERIFIED GLB header, manifest and three 800x800 Blender images')
          PY
      - name: Upload unfinished review candidate and checkpoint
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b5-knight-sentinel-v14-review-NOT-APPROVED
          path: |
            render-output/b5-knights/sentinel_v14/
            render-output/b5-knights/photo_source/
          retention-days: 14
