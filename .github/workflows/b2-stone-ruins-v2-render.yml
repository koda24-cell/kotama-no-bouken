name: B2 Stone Ruins Props V2 Render
on:
  push:
    branches: [feature/b2-bridge-v04-vfx-20261115, feature/shared-container-b2-legacy-render-20261119]
    paths:
      - tools/b2-render/build-stone-ruins-v2.py
      - .github/workflows/b2-stone-ruins-v2-render.yml
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  render:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    container:
      image: ghcr.io/koda24-cell/kotama-blender53-clamav@sha256:5ce601f79b1ab09405b3ebc36b1a596be76cb8b105b1524fcbafcb186ebf7e99
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 35
    steps:
      - name: Assert Blender 5.3.0
        run: blender --version | head -n 1 | grep -Fx 'Blender 5.3.0'
      - uses: actions/checkout@v4
      - name: Refresh ClamAV definitions
        run: bash tools/security/clamav_scan_gate.sh update qa/security
      - name: Scan Blender script before execution
        run: bash tools/security/clamav_scan_gate.sh scan tools/b2-render/build-stone-ruins-v2.py qa/security/source.log
      - name: Render sandstone ruin props
        run: blender -b -t 2 --python tools/b2-render/build-stone-ruins-v2.py
      - name: Validate outputs
        run: |
          set -euo pipefail
          cd render-output/b2-stone-ruins-v2
          for variant in broken_parapet fallen_pillar embedded_spire rubble_ice_scatter; do
            test -s "${variant}.glb"
            for view in front side angle; do test -s "${variant}_${view}.png"; done
          done
          sha256sum *.glb *.png > SHA256SUMS.txt
      - name: Scan generated GLBs and PNGs
        run: bash tools/security/clamav_scan_gate.sh scan render-output/b2-stone-ruins-v2 qa/security/output.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b2-stone-ruins-v2
          path: |
            render-output/b2-stone-ruins-v2/
            qa/security/
          retention-days: 14
