name: 3D progress registry tests
on:
  push:
    branches:
      - feature/3d-progress-gallery-20261124
  pull_request:
    paths:
      - 'tools/3d-progress/**'
      - 'preview/3d-progress.html'
      - '.github/workflows/3d-progress*.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tools/3d-progress -v
