name: Blender 5.3 checkpoint foundation tests
on:
  push:
    branches:
      - feature/blender53-checkpoint-resume-foundation-20261120
    paths:
      - 'tools/3d_checkpoint/**'
      - '.github/workflows/blender53-checkpoint-tests.yml'
  pull_request:
    paths:
      - 'tools/3d_checkpoint/**'
      - '.github/workflows/blender53-checkpoint-tests.yml'
permissions:
  contents: read
jobs:
  checkpoint-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run isolated checkpoint unit tests
        run: python3 -m unittest discover -s tools/3d_checkpoint -p 'test_*.py' -v
