name: B2 Single Waterwheel Spoke V01 Blender Review
on:
  push:
    branches:
      - feature/gpt-b2-waterwheel-single-spoke-v01-20261119
    paths:
      - 'tools/b2-waterwheel-spoke/**'
      - '.github/workflows/b2-waterwheel-single-spoke-v01.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Real Blender Cycles 4-view GLB and Blend
        shell: bash
        run: |
          set -o pipefail
          mkdir -p render-output/b2-single-spoke-v01
          docker run --rm -v "$PWD:/workspace" -w /workspace lscr.io/linuxserver/blender:latest /blender/blender -b -t 2 --python-exit-code 1 --python tools/b2-waterwheel-spoke/build_single_spoke_v01.py -- render-output/b2-single-spoke-v01 | tee /tmp/b2-spoke.log
          ! grep -E 'Traceback \(most recent call last\)|Python script failed|Error: Python' /tmp/b2-spoke.log
          grep -q 'B2_SINGLE_SPOKE_V01_RENDER_SUCCESS' /tmp/b2-spoke.log
      - name: Verify 4 actual PNG GLB BLEND and hashes
        run: |
          python3 - <<'PY'
          import pathlib,json,hashlib,struct
          p=pathlib.Path('render-output/b2-single-spoke-v01')
          m=json.loads((p/'b2_waterwheel_single_spoke_v01_manifest.json').read_text())
          assert m['approval']=='NOT_APPROVED' and m['single_spoke_only'] and len(m['files'])==6
          assert len([k for k in m['files'] if k.endswith('.png')])==4
          for fn,record in m['files'].items():
              data=(p/fn).read_bytes()
              assert len(data)==record['bytes'] and hashlib.sha256(data).hexdigest()==record['sha256']
              if fn.endswith('.png'):assert data[:8]==bytes.fromhex('89504e470d0a1a0a')
              if fn.endswith('.blend'):assert data[:7]==b'BLENDER'
              if fn.endswith('.glb'):
                  assert data[:4]==b'glTF'
                  n=struct.unpack_from('<I',data,12)[0]
                  obj=json.loads(data[20:20+n])
                  assert len(obj.get('meshes',[]))>=1
          print('SPOKE_V01_ARTIFACT_HASHES_OK')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b2-waterwheel-single-spoke-v01
          path: render-output/b2-single-spoke-v01
          retention-days: 14
          if-no-files-found: warn
