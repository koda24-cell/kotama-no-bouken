name: Floor3 Elevated Bridge Modular Render
on:
  push:
    branches: [feature/floor3-elevated-ruin-tiles-20261114]
    paths:
      - 'tools/floor3/elevated_bridge/**'
      - '.github/workflows/floor3-elevated-bridge-render.yml'
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Acquire CC0 textures (fallback procedural if unavailable)
        run: |
          mkdir -p tools/floor3/elevated_bridge/textures
          python3 tools/floor3/elevated_bridge/fetch_textures.py
      - name: Blender render
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          docker pull lscr.io/linuxserver/blender:latest
          set -o pipefail
          docker run --rm -v "$GITHUB_WORKSPACE:/work" lscr.io/linuxserver/blender:latest blender -b -t 2 --python /work/tools/floor3/elevated_bridge/build_v2.py 2>&1 | tee "$GITHUB_WORKSPACE/blender-render.log"
          grep -q 'V2_RENDER_COMPLETE' "$GITHUB_WORKSPACE/blender-render.log"
          docker run --rm -v "$GITHUB_WORKSPACE:/work" lscr.io/linuxserver/blender:latest blender -b -t 2 --python /work/tools/floor3/elevated_bridge/build_v3.py 2>&1 | tee "$GITHUB_WORKSPACE/blender-v3-render.log"
          grep -q 'V3_RENDER_COMPLETE' "$GITHUB_WORKSPACE/blender-v3-render.log"
      - name: Verify V1 V2 and V3 GLBs and renders
        run: |
          for tile in straight end collapse support; do
            test -s "out/floor3_elevated_bridge_${tile}.glb"
            test -s "out/floor3_elevated_bridge_${tile}_v2.glb"
            test -s "out/floor3_elevated_bridge_${tile}_v3.glb"
            for view in front side angle; do
              test -s "out/floor3_elevated_bridge_${tile}-${view}.png"
              test -s "out/floor3_elevated_bridge_${tile}_v2-${view}.png"
              test -s "out/floor3_elevated_bridge_${tile}_v3-${view}.png"
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: floor3-elevated-bridge-tiles-v1-v2-v3
          path: out/
          retention-days: 14
