name: Floor3 Window Crossbar01 V4 End Detail Review
on:
  push:
    branches: [feature/gpt-f3-window-crossbar01-20261119]
    paths: ['tools/floor3/window_crossbar01/build_v4.py', '.github/workflows/f3-window-crossbar01-v4-render.yml']
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Validate source
        run: python3 -m py_compile tools/floor3/window_crossbar01/build_v4.py
      - name: Render end detail from 5 angles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/f3_window_crossbar01
          printf '{"asset":"F3_WINDOW_CROSSBAR01","version":4,"approval":"NOT_APPROVED","source_sha":"%s","run_id":"%s"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > out/f3_window_crossbar01/progress_v4.json
          docker pull lscr.io/linuxserver/blender:latest
          docker run --rm --user "$(id -u):$(id -g)" --entrypoint /usr/bin/blender -v "$PWD:/work" -w /work lscr.io/linuxserver/blender:latest -b -t 2 --python /work/tools/floor3/window_crossbar01/build_v4.py 2>&1 | tee out/f3_window_crossbar01/blender_v4.log
          grep -q F3_CROSSBAR_V4_ALL_COMPLETE out/f3_window_crossbar01/blender_v4.log
      - name: Verify GLB PNG Blend and manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,hashlib,struct,json,os
          p=pathlib.Path('out/f3_window_crossbar01')
          stem='f3_window_crossbar01_v4'
          names=[stem+'.glb',stem+'.blend']+[stem+'-'+x+'.png' for x in ('front','side','angle','end_left','end_right')]
          rec={}
          for name in names:
              b=(p/name).read_bytes()
              assert len(b)>500,name
              if name.endswith('.png'):assert b[:8]==bytes.fromhex('89504e470d0a1a0a'),name
              if name.endswith('.glb'):assert b[:4]==b'glTF' and struct.unpack_from('<I',b,8)[0]==len(b),name
              if name.endswith('.blend'):assert b.startswith(b'BLENDER') or b.startswith(bytes.fromhex('28b52ffd')),name
              rec[name]={'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()}
          (p/'manifest_v4.json').write_text(json.dumps({'asset':'F3_WINDOW_CROSSBAR01','version':4,'approval':'NOT_APPROVED','source_sha':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'files':rec},indent=2))
          print('F3_CROSSBAR_V4_QA_OK',len(rec))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f3-window-crossbar01-v4-end-detail
          path: out/f3_window_crossbar01/
          retention-days: 14
