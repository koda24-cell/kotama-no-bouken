name: Long production real Blender recovery test
on:
  push:
    branches:
      - feature/long-production-integration-20261124
    paths:
      - '.github/workflows/long-production-real-blender-test.yml'
      - '.github/workflows/long-production-recovery-worker.yml'
permissions:
  contents: read
  actions: read
  packages: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      epoch: ${{ steps.clock.outputs.epoch }}
    steps:
      - id: clock
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tools/3d_checkpoint -p 'test_production*.py' -v
  recover:
    needs: preflight
    uses: ./.github/workflows/long-production-recovery-worker.yml
    with:
      session_start_epoch: ${{ needs.preflight.outputs.epoch }}
      estimated_render_minutes: 30
      asset_id: b2-watergate
      script: tools/3d_checkpoint/resume_watergate.py
      source_script: tools/b2-render/build-watergate.py
      source_commit: 3640b077548c0967b511bdc417166e810f0c8dc4
      source_run_id: '44667118125'
      source_artifact: b2-watergate-checkpoint-NOT-APPROVED-44667118125
      source_directory: render-output/b2-watergate
      blend_filename: frozen_watergate_v09.blend
      output_directory: render-output/long-production-test
