name: B2 Reused Ferrule V02 Exact Photo PBR Render
on:
  push:
    branches: [feature/gpt-b2-iron-axle-ferrule-v02-20261119]
    paths:
      - 'tools/b2-waterwheel-ferrule/**'
      - '.github/workflows/b2-waterwheel-iron-ferrule-v01.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Publish run ID for later review
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -e
          mkdir -p docs/3d/b2-waterwheel-ferrule
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feature/gpt-b2-iron-axle-ferrule-v02-20261119
          git reset --hard origin/feature/gpt-b2-iron-axle-ferrule-v02-20261119
          echo "{\"run_id\":${RUN_ID},\"status\":\"RUNNING_NOT_APPROVED\"}" > docs/3d/b2-waterwheel-ferrule/latest-v02.json
          git add docs/3d/b2-waterwheel-ferrule/latest-v02.json
          git commit -m "chore(b2): record real ferrule Blender run"
          git push origin HEAD:feature/gpt-b2-iron-axle-ferrule-v02-20261119
      - name: Blender Cycles 4 real views plus GLB / Blend
        run: |
          set -o pipefail
          mkdir -p render-output/b2-ferrule-v02
          docker run --rm -v "$PWD:/workspace" -w /workspace lscr.io/linuxserver/blender:latest /blender/blender -b -t 2 --python-exit-code 1 --python tools/b2-waterwheel-ferrule/build_ferrule_v02.py -- render-output/b2-ferrule-v02 | tee /tmp/ferrule.log
          if grep -E 'Traceback \(most recent call last\)|Python script failed|Error: Python' /tmp/ferrule.log; then exit 1; fi
          grep -q 'B2_FERRULE_V02_REAL_RENDER_OK' /tmp/ferrule.log
      - name: Check all actual image and model files
        run: |
          python3 - <<'PY'
          import json,hashlib,struct
          from pathlib import Path
          p=Path("render-output/b2-ferrule-v02")
          m=json.loads((p/"b2_single_iron_axle_ferrule_v02_manifest.json").read_text())
          assert m["approval"]=="NOT_APPROVED" and m["independent_asset_count"]==1
          assert len(m["files"])==8 and m["mesh_faces"]>=900
          assert sum(k.endswith("_front.png") or k.endswith("_side.png") or k.endswith("_angle.png") or k.endswith("_back.png") for k in m["files"])==4
          assert m["texture_resolution"]==[384,384] and m['uv_seam_per_face_corrected'] and m['tiled_u_rust_maps']
          for k,v in m["files"].items():
              data=(p/k).read_bytes()
              assert len(data)==v["bytes"] and hashlib.sha256(data).hexdigest()==v["sha256"],k
              if k.endswith(".png"):assert data[:8]==bytes.fromhex("89504e470d0a1a0a")
              if k.endswith(".glb"):
                  assert data[:4]==b"glTF"
                  length=struct.unpack_from("<I",data,12)[0]
                  j=json.loads(data[20:20+length])
                  assert len(j.get("meshes",[]))==1
                  assert len(j.get("images",[]))>=2
              if k.endswith(".blend"):assert len(data)>100000
          print("B2_FERRULE_V02_SHA_GLB_PNG_BLEND_VERIFIED")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b2-iron-axle-ferrule-v02
          path: render-output/b2-ferrule-v02
          retention-days: 14
          if-no-files-found: warn
