name: F6 Meadow V9 Blender Geometry Review
on:
  push:
    branches:
      - feature/gpt-f6-meadow-v9-blade-variation-20261119
    paths:
      - 'tools/floor6/meadow_v9_additive.py'
      - '.github/workflows/f6-meadow-v9-blender-review.yml'
  workflow_dispatch:
jobs:
  blender-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax check
        run: python3 -m py_compile tools/floor6/meadow_v9_additive.py
      - name: Install Blender
        run: sudo apt-get update -qq && sudo apt-get install -y blender python3-numpy
      - name: Download preserved V7 original GLB
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p render-input
          gh run download 43602069517 --repo ${{ github.repository }} -n f6-meadow-floor-v1 -D render-input
          test -s render-input/f6_meadow_floor_v1.glb
      - name: Render additive V9 from real V7 GLB
        run: |
          set -euo pipefail
          blender -b -t 2 --python tools/floor6/meadow_v9_additive.py 2>&1 | tee /tmp/f6-v9.log
          grep -q F6_MEADOW_V9_DONE /tmp/f6-v9.log
      - name: Verify GLB, four PNG, Blend and manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('render-output/floor6/meadow-v9')
          names=['f6_meadow_v9_candidate.glb','f6_meadow_v9_candidate.blend']+[f'f6_meadow_v9_{v}.png' for v in ('front','side','angle','top')]
          for name in names:
              data=(p/name).read_bytes()
              assert len(data)>1000,name
              if name.endswith('.glb'): assert data[:4]==b'glTF',name
              if name.endswith('.png'): assert data[:4]==bytes([137,80,78,71]),name
          m=json.loads((p/'manifest.json').read_text())
          assert m['status']=='NOT_APPROVED'
          assert m['added_curved_leaves']==660
          assert len(m['original_meshes_preserved'])==9
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f6-meadow-v9-additive-unapproved
          path: render-output/floor6/meadow-v9/
          retention-days: 14
          if-no-files-found: warn
