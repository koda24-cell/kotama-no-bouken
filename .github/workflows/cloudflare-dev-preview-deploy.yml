name: Cloudflare private dev preview (development + selected PRs -> fixed URL)
# 「確認サイトを更新して」: force-push the development tip to branch
# `preview/refresh` (or push to development). The fixed URL then shows
# development + open PRs chosen in tools/cloudflare-preview/preview-sources.json
# (label `preview` by default). Conflicting PRs are skipped and listed.
# Auto-deploys the game's runtime files from `development` to the private,
# password-protected Pages project. Fail-closed:
#   1. does nothing unless repository variable KOTAMA_GAME_PREVIEW_ENABLED == 'true'
#      (set only after the checks in docs/CLOUDFLARE_ACCESS_SETUP.md pass)
#   2. the password gate must pass on all hostnames BEFORE upload
#   3. only files selected by tools/cloudflare-preview/build_runtime_bundle.py ship,
#      always together with the password worker (_worker.js)
#   4. the new deployment is verified; on failure the fixed URL is rolled back
#      and the new deployment deleted
on:
  push:
    branches: [development, preview/refresh]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'references/**'
      - 'review-shots/**'
      - 'render-output/**'
      - 'prototypes/**'
      - '_trash/**'

permissions:
  contents: read
  pull-requests: read
concurrency:
  group: cloudflare-probe-deploy
  cancel-in-progress: false
jobs:
  enabled:
    if: github.repository == 'koda24-cell/kotama-no-bouken' && vars.KOTAMA_GAME_PREVIEW_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Game preview deployment enabled by repository variable."

  gate-before:
    needs: enabled
    uses: ./.github/workflows/cloudflare-access-gate.yml
    secrets: inherit
    with:
      paths: '/ /index.html /script.js /style.css /data/characters.js /assets/characters/kotama.webp'

  deploy:
    needs: gate-before
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      before: ${{ steps.up.outputs.before }}
      after: ${{ steps.up.outputs.after }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
          lfs: false
          fetch-depth: 0
          filter: blob:none
      - name: Merge selected open PRs onto development (preview only, not pushed)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "kotama-preview-bot"; git config user.email "preview@invalid"
          git fetch --no-tags --filter=blob:none origin development
          git checkout -q --detach origin/development
          cp tools/cloudflare-preview/integrate_prs.py tools/cloudflare-preview/preview-sources.json "$RUNNER_TEMP/"
          python3 "$RUNNER_TEMP/integrate_prs.py" "$RUNNER_TEMP/preview-sources-report.json"
      - name: Select runtime files (allowlist, size, LFS, internal-file exclusion)
        run: |
          set -euo pipefail
          python3 tools/cloudflare-preview/build_runtime_bundle.py --repo . --out "$RUNNER_TEMP/site" --report "$RUNNER_TEMP/bundle-report.json"
          python3 - "$RUNNER_TEMP/bundle-report.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          print(f"Bundle: {r['file_count']} files, {r['total_bytes']/1e6:.1f} MB, "
                f"missing refs {len(r['missing_references'])}, external {len(r['external_urls'])}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-report
          path: ${{ runner.temp }}/bundle-report.json
          retention-days: 14
      - name: Add password worker and preview-info page
        run: |
          set -euo pipefail
          cp tools/cloudflare-preview/worker/_worker.js "$RUNNER_TEMP/site/_worker.js"
          python3 - "$RUNNER_TEMP/preview-sources-report.json" "$RUNNER_TEMP/bundle-report.json" "$RUNNER_TEMP/site/preview-info.html" <<'PY'
          import json, sys, html, datetime
          src, bun = json.load(open(sys.argv[1])), json.load(open(sys.argv[2]))
          e = html.escape
          rows = "".join(f"<li>#{x['number']} {e(x['title'])}</li>" for x in src["included"]) or "<li>なし</li>"
          skip = "".join(f"<li>#{x['number']} {e(x['title'])} — {e(x['reason'])}</li>" for x in src["skipped"]) or "<li>なし</li>"
          now = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9))).strftime("%Y-%m-%d %H:%M JST")
          open(sys.argv[3], "w").write(f'''<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>確認サイトの中身</title>
          <body style="font-family:system-ui;max-width:40rem;margin:2rem auto;padding:0 1rem"><h1>確認サイトの中身</h1>
          <p>更新: {now}<br>development: <code>{src['development'][:12]}</code>（選択方式: {e(src['mode'])}）</p>
          <h2>含めたPR</h2><ul>{rows}</ul><h2>含められなかったPR</h2><ul>{skip}</ul>
          <p>{bun['file_count']} ファイル / {bun['total_bytes']/1e6:.0f} MB</p><p><a href="/">ゲームへ</a></p></body>''')
          PY
      - name: Upload to private Pages project
        id: up
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_SEND_METRICS: 'false'
        run: |
          set -euo pipefail
          gate="python3 $GITHUB_WORKSPACE/tools/cloudflare-preview/pages_gate.py"
          before="$($gate canonical)"
          cd "$RUNNER_TEMP" && npm install --no-audit --no-fund --save-exact wrangler@4.168.0 >/dev/null
          ./node_modules/.bin/wrangler pages deploy site --project-name=kotama-private-probe-20261127 \
            --branch=probe-20261127 --commit-hash="$GITHUB_SHA" \
            --commit-message="[protected] preview $(jq -r '.development[0:12] + " +PRs " + ([.included[].number|tostring]|join(","))' "$RUNNER_TEMP/preview-sources-report.json")"
          sleep 15
          after="$($gate canonical)"
          [[ "$after" != "$before" ]]
          echo "before=$before" >> "$GITHUB_OUTPUT"; echo "after=$after" >> "$GITHUB_OUTPUT"
          echo "Deployed development ${GITHUB_SHA:0:12} -> deployment ${after:0:8}" >> "$GITHUB_STEP_SUMMARY"

  gate-after:
    needs: deploy
    uses: ./.github/workflows/cloudflare-access-gate.yml
    secrets: inherit
    with:
      paths: '/ /index.html /script.js /style.css /data/characters.js /assets/characters/kotama.webp'

  rollback-on-failure:
    needs: [deploy, gate-after]
    if: always() && needs.deploy.result == 'success' && needs.gate-after.result != 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Roll fixed URL back to the previous deployment
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BEFORE: ${{ needs.deploy.outputs.before }}
          AFTER: ${{ needs.deploy.outputs.after }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/kotama-private-probe-20261127"
          curl --fail --silent --show-error --proto '=https' --max-time 30 --request POST --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/deployments/$BEFORE/rollback" >/dev/null
          sleep 15
          curl --fail --silent --show-error --proto '=https' --max-time 30 --request DELETE --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/deployments/$AFTER?force=true" >/dev/null
          echo "::error::Post-deploy gate failed; fixed URL rolled back and the new deployment deleted. Set KOTAMA_GAME_PREVIEW_ENABLED=false until investigated."
          exit 1

  prune:
    needs: gate-after
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: tools/cloudflare-preview
      - name: Keep only the newest protected deployments
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 tools/cloudflare-preview/pages_gate.py prune --keep 5
