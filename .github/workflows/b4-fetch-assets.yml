name: B4 fetch CC0 assets (Claude)

# 第4層の作り直しで使うCC0素材を公式配布元から取得してリポジトリへ保存する（ユーザー許可 2026-11-21）。
# - Kenney Particle Pack（CC0, https://kenney.nl/assets/particle-pack）: 炎・煙・火花・魔法陣のスプライト
# - Poly Haven（CC0）: tools/b4-assets/polyhaven.txt のテクスチャ 2K
# 取得物の URL・sha256 を manifest に記録し、ブランチへコミットする。
on:
  push:
    branches: ["feature/ai-claude-b4-props**", "feature/ai-claude-b4-temple**"]
    paths: ["tools/b4-assets/**", ".github/workflows/b4-fetch-assets.yml"]
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Kenney Particle Pack (CC0)
        run: |
          set -e
          D=assets/vfx/kenney-particle-pack
          if [ ! -f "$D/manifest.json" ]; then
            mkdir -p /tmp/kp "$D"
            ok=""
            for u in "https://opengameart.org/sites/default/files/kenney_particlePack.zip" \
                     "https://github.com/Calinou/kenney-particle-pack/archive/refs/heads/master.zip"; do
              if curl -fsSL --retry 3 -o /tmp/kp/p.zip "$u"; then ok="$u"; break; fi
            done
            test -n "$ok"
            (cd /tmp/kp && unzip -q -o p.zip)
            find /tmp/kp -iname "*.png" | grep -v -i -E "unity|preview|sample|__MACOSX" > /tmp/kp/list.txt
            wc -l /tmp/kp/list.txt
            python3 - "$D" "$ok" <<'PY'
          import hashlib, json, os, shutil, sys
          D, url = sys.argv[1], sys.argv[2]
          files = {}
          for p in open('/tmp/kp/list.txt').read().split():
              name = os.path.basename(p)
              if name in files: continue
              shutil.copy(p, os.path.join(D, name))
              files[name] = hashlib.sha256(open(p, 'rb').read()).hexdigest()
          json.dump({"source": url, "page": "https://kenney.nl/assets/particle-pack", "license": "CC0 1.0 (Kenney, credit optional)", "files": files}, open(os.path.join(D, 'manifest.json'), 'w'), indent=1)
          print(len(files), 'files')
          PY
          fi
          ls assets/vfx/kenney-particle-pack | head -100
      - name: Poly Haven texture catalogue (names for choosing)
        run: |
          mkdir -p docs/3d/b4-assets
          curl -fsSL "https://api.polyhaven.com/assets?t=textures" -o /tmp/ph_all.json
          python3 - <<'PY'
          import json
          j = json.load(open('/tmp/ph_all.json'))
          keys = ('brick', 'stone', 'tile', 'rock', 'lava', 'basalt', 'cobble', 'paving', 'wall', 'floor', 'castle', 'ruin', 'metal', 'rust', 'volcan', 'obsidian', 'marble', 'granite', 'slate')
          rows = []
          for k, v in sorted(j.items()):
              cats = v.get('categories', [])
              tags = v.get('tags', [])
              txt = ' '.join([k] + cats + tags).lower()
              if any(x in txt for x in keys):
                  rows.append(f"{k}\t{','.join(cats)}\t{','.join(tags[:8])}")
          open('docs/3d/b4-assets/polyhaven_candidates.tsv', 'w').write('\n'.join(rows) + '\n')
          print(len(rows), 'candidates')
          PY
      - name: Poly Haven textures (2K)
        run: |
          while read -r id res; do
            [ -z "$id" ] && continue; case "$id" in \#*) continue;; esac
            res=${res:-1k}
            D="assets/textures/floor4/cc0/$id"
            [ -f "$D/manifest.json" ] && continue
            mkdir -p "$D"
            curl -fsSL "https://api.polyhaven.com/files/$id" -o /tmp/f.json || { echo "::warning::$id"; continue; }
            python3 - "$id" "$D" "$res" <<'PY'
          import hashlib, json, sys, urllib.request
          i, D, R = sys.argv[1], sys.argv[2], sys.argv[3]
          j = json.load(open('/tmp/f.json'))
          out = {"source": f"https://polyhaven.com/a/{i}", "license": "CC0 (https://polyhaven.com/license)", "files": {}}
          for k, key in (('diff', 'Diffuse'), ('rough', 'Rough'), ('nor_gl', 'nor_gl'), ('ao', 'AO')):
              try:
                  url = j[key][R]['jpg']['url'] if key != 'Displacement' else j[key][R]['png']['url']
              except Exception:
                  try: url = j[key][R]['jpg']['url']
                  except Exception: continue
              ext = url.rsplit('.', 1)[-1]
              dst = f"{D}/{i}_{k}_{R}.{ext}"
              urllib.request.urlretrieve(url, dst)
              out["files"][dst.split('/')[-1]] = {"url": url, "sha256": hashlib.sha256(open(dst, 'rb').read()).hexdigest()}
          json.dump(out, open(f"{D}/manifest.json", 'w'), indent=1)
          print(i, len(out["files"]))
          PY
          done < tools/b4-assets/polyhaven.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A assets/vfx assets/textures/floor4/cc0 docs/3d/b4-assets
          git diff --cached --quiet && exit 0
          git commit -m "assets: B4 CC0 fetch (run ${{ github.run_id }})"
          for i in 1 2 3; do git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0; sleep 5; done
          exit 1
