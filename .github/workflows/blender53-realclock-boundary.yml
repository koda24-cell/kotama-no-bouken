name: Blender 5.3 real-clock 70-minute stage handoff validation
on:
  push:
    branches:
      - feature/blender53-realclock-boundary-20261122
    paths:
      - '.github/workflows/blender53-realclock-boundary.yml'
      - 'tools/3d_checkpoint/stage_route.py'
      - 'tools/3d_checkpoint/test_stage_route.py'
  workflow_dispatch:
    inputs:
      simulated_elapsed_minutes:
        description: '0 = real clock; 71 = safe handoff drill (branch only)'
        type: choice
        required: true
        default: '0'
        options: ['0', '71']
permissions:
  contents: read
  actions: read
  packages: read
jobs:
  route-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          python3 tools/3d_checkpoint/test_stage_budget.py
          python3 tools/3d_checkpoint/test_stage_plan.py
          python3 tools/3d_checkpoint/test_stage_route.py
  stage-one:
    outputs:
      route: ${{ steps.route.outputs.action }}
      handoff_required: ${{ steps.route.outputs.handoff_required }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: ghcr.io/koda24-cell/kotama-blender53-clamav@sha256:5ce601f79b1ab09405b3ebc36b1a596be76cb8b105b1524fcbafcb186ebf7e99
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record job start
        id: start
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Verify Blender, update ClamAV and scan source
        run: |
          blender --version | head -1 | grep -Fx 'Blender 5.3.0'
          bash tools/security/clamav_scan_gate.sh update qa/security
          bash tools/security/clamav_scan_gate.sh scan tools/b2-render/build-watergate.py qa/security/initial-source.log
          bash tools/security/clamav_scan_gate.sh scan tools/3d_checkpoint/resume_watergate.py qa/security/resume-script.log
      - name: Build initial Blender checkpoint
        run: blender -b --disable-autoexec -t 2 --python tools/b2-render/build-watergate.py
      - name: QA, pack, verify and scan checkpoint 1
        env:
          COMMIT: ${{ github.sha }}
        run: |
          python3 tools/3d_checkpoint/render_qa.py --directory render-output/b2-watergate
          python3 tools/3d_checkpoint/checkpoint.py pack --directory render-output/b2-watergate --asset-id b2-watergate --iteration 1 --source-script tools/b2-render/build-watergate.py --source-commit "$COMMIT"
          python3 tools/3d_checkpoint/checkpoint.py verify --directory render-output/b2-watergate --asset-id b2-watergate --source-script tools/b2-render/build-watergate.py --source-commit "$COMMIT"
          bash tools/security/clamav_scan_gate.sh scan render-output/b2-watergate qa/security/initial-output.log
      - name: Upload verified stage-one checkpoint before deciding
        uses: actions/upload-artifact@v4
        with:
          name: budget-stage1-NOT-APPROVED-${{ github.run_id }}
          path: render-output/b2-watergate/
          if-no-files-found: error
          retention-days: 14
      - name: Real elapsed-clock endurance to 71 minutes (checkpoint already uploaded)
        timeout-minutes: 75
        env:
          START_EPOCH: ${{ steps.start.outputs.epoch }}
        run: |
          # This is a WALL CLOCK boundary test, not 71 minutes of continuous Blender computation.
          # Checkpoint is already durably uploaded; run remains independently recoverable.
          TARGET=$((START_EPOCH + 71 * 60))
          while :; do
            NOW=$(date +%s)
            REMAIN=$((TARGET - NOW))
            if [ "$REMAIN" -le 0 ]; then
              echo "REAL_CLOCK_BOUNDARY_REACHED=true"
              break
            fi
            echo "REAL_CLOCK_ELAPSED_SECONDS=$((NOW - START_EPOCH)) REMAINING_UNTIL_BOUNDARY=$REMAIN"
            if [ "$REMAIN" -gt 60 ]; then SLEEP=60; else SLEEP="$REMAIN"; fi
            sleep "$SLEEP"
          done
      - name: Decide using actual elapsed time, no simulation
        id: route
        env:
          START_EPOCH: ${{ steps.start.outputs.epoch }}
        run: |
          python3 tools/3d_checkpoint/stage_route.py --completed-stage 1 --max-stages 2 --start-epoch "$START_EPOCH" --simulate-minutes 0
          grep -q '^handoff_required=true$' "$GITHUB_OUTPUT"
          echo "REAL_CLOCK_HANDOFF_CONFIRMED=true"
      - name: Continue stage 2 in same job when time remains
        if: ${{ steps.route.outputs.action == 'continue' }}
        env:
          RESUME_BLEND: render-output/b2-watergate/frozen_watergate_v09.blend
          RESUME_OUTPUT: render-output/b2-watergate-inline
        run: blender -b --disable-autoexec -t 2 --python tools/3d_checkpoint/resume_watergate.py
      - name: Verify, scan and pack inline stage 2
        if: ${{ steps.route.outputs.action == 'continue' }}
        env:
          COMMIT: ${{ github.sha }}
        run: |
          python3 tools/3d_checkpoint/render_qa.py --directory render-output/b2-watergate-inline
          python3 tools/3d_checkpoint/checkpoint.py pack --directory render-output/b2-watergate-inline --asset-id b2-watergate-inline --iteration 2 --parent-checkpoint "budget-stage1-${{ github.run_id }}" --source-script tools/3d_checkpoint/resume_watergate.py --source-commit "$COMMIT"
          python3 tools/3d_checkpoint/checkpoint.py verify --directory render-output/b2-watergate-inline --asset-id b2-watergate-inline --source-script tools/3d_checkpoint/resume_watergate.py --source-commit "$COMMIT"
          bash tools/security/clamav_scan_gate.sh scan render-output/b2-watergate-inline qa/security/inline-output.log
      - name: Upload inline stage 2
        if: ${{ steps.route.outputs.action == 'continue' }}
        uses: actions/upload-artifact@v4
        with:
          name: budget-stage2-inline-NOT-APPROVED-${{ github.run_id }}
          path: render-output/b2-watergate-inline/
          if-no-files-found: error
          retention-days: 14
  stage-two-handoff:
    needs: [route-tests, stage-one]
    if: ${{ needs.stage-one.result == 'success' && needs.stage-one.outputs.handoff_required == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: ghcr.io/koda24-cell/kotama-blender53-clamav@sha256:5ce601f79b1ab09405b3ebc36b1a596be76cb8b105b1524fcbafcb186ebf7e99
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: budget-stage1-NOT-APPROVED-${{ github.run_id }}
          path: recovered
      - name: Verify source and checkpoint; scan before Blender import
        env:
          COMMIT: ${{ github.sha }}
        run: |
          python3 tools/3d_checkpoint/checkpoint.py verify --directory recovered --asset-id b2-watergate --source-script tools/b2-render/build-watergate.py --source-commit "$COMMIT"
          bash tools/security/clamav_scan_gate.sh update qa/security
          bash tools/security/clamav_scan_gate.sh scan recovered qa/security/recovered.log
          bash tools/security/clamav_scan_gate.sh scan tools/3d_checkpoint/resume_watergate.py qa/security/script.log
      - name: Actual Blender resume in fresh job
        env:
          RESUME_BLEND: recovered/frozen_watergate_v09.blend
          RESUME_OUTPUT: render-output/b2-watergate-handoff
        run: blender -b --disable-autoexec -t 2 --python tools/3d_checkpoint/resume_watergate.py
      - name: QA, pack, verify and scan handoff result
        env:
          COMMIT: ${{ github.sha }}
        run: |
          python3 tools/3d_checkpoint/render_qa.py --directory render-output/b2-watergate-handoff
          python3 tools/3d_checkpoint/checkpoint.py pack --directory render-output/b2-watergate-handoff --asset-id b2-watergate-handoff --iteration 2 --parent-checkpoint "budget-stage1-${{ github.run_id }}" --source-script tools/3d_checkpoint/resume_watergate.py --source-commit "$COMMIT"
          python3 tools/3d_checkpoint/checkpoint.py verify --directory render-output/b2-watergate-handoff --asset-id b2-watergate-handoff --source-script tools/3d_checkpoint/resume_watergate.py --source-commit "$COMMIT"
          bash tools/security/clamav_scan_gate.sh scan render-output/b2-watergate-handoff qa/security/handoff-output.log
      - uses: actions/upload-artifact@v4
        with:
          name: budget-stage2-handoff-NOT-APPROVED-${{ github.run_id }}
          path: render-output/b2-watergate-handoff/
          if-no-files-found: error
          retention-days: 14
