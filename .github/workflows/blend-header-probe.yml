name: Blender binary header probe
on:
  push:
    branches: [feature/asset-security-audit-20261118]
    paths:
      - ".github/workflows/blend-header-probe.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install safe decompressor
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zstd
      - name: Check headers without executing assets
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,collections,json,subprocess
          files=sorted(pathlib.Path('assets').rglob('*.blend'))
          signatures=collections.Counter()
          for p in files:
              with p.open('rb') as f: h=f.read(24)
              signatures[h[:8].hex()]+=1
              z=subprocess.run(['zstd','-dc',str(p)],capture_output=True,timeout=25)
              decoded=z.stdout
              print(json.dumps({'file':str(p),'size':p.stat().st_size,'header':h.hex(),'decoded_size':len(decoded),'decoded_head_hex':decoded[:24].hex(),'decoded_head_ascii':repr(decoded[:24]),'decompress_rc':z.returncode}))
          print('TOTAL',len(files))
          print('SIGNATURES',dict(signatures))
          PY
