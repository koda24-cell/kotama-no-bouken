name: Blender 5.3 volume high-sample tiled QA
on:
  push:
    branches: [feature/blender53-volume-highsample-tile-qa-20261123]
    paths:
      - '.github/workflows/blender53-volume-highsample-tile-qa.yml'
      - 'tools/3d_checkpoint/prepare_volume_qa.py'
      - 'tools/3d_checkpoint/render_one_view.py'
      - 'tools/3d_checkpoint/render_half_frame.py'
permissions:
  contents: read
  actions: read
  packages: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    container:
      image: ghcr.io/koda24-cell/kotama-blender53-clamav@sha256:5ce601f79b1ab09405b3ebc36b1a596be76cb8b105b1524fcbafcb186ebf7e99
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify Blender and scan source
        run: |
          blender --version | head -1 | grep -Fx 'Blender 5.3.0'
          bash tools/security/clamav_scan_gate.sh update qa/security
          bash tools/security/clamav_scan_gate.sh scan tools/3d_checkpoint/prepare_volume_qa.py qa/security/prepare.log
          bash tools/security/clamav_scan_gate.sh scan tools/3d_checkpoint/render_one_view.py qa/security/render.log
      - name: Prepare isolated volumetric scene
        run: blender -b --disable-autoexec --python-exit-code 1 -t 2 --python tools/3d_checkpoint/prepare_volume_qa.py
      - name: Render 128-sample reference
        env:
          RESUME_BLEND: render-output/qa-volume-tiles/volume_probe.blend
          RENDER_OUTPUT: render-output/qa-volume-tiles
          RENDER_VIEW: front
          RENDER_SAMPLES: '128'
        run: blender -b --disable-autoexec --python-exit-code 1 -t 2 --python tools/3d_checkpoint/render_one_view.py
      - name: Pack and scan checkpoint
        env:
          COMMIT: ${{ github.sha }}
        run: |
          python3 tools/3d_checkpoint/verify_one_view.py --file render-output/qa-volume-tiles/front.png --view front
          python3 tools/3d_checkpoint/checkpoint.py pack --directory render-output/qa-volume-tiles --asset-id volume-baseline --iteration 1 --source-script tools/3d_checkpoint/prepare_volume_qa.py --source-commit "$COMMIT"
          python3 tools/3d_checkpoint/checkpoint.py verify --directory render-output/qa-volume-tiles --asset-id volume-baseline --source-script tools/3d_checkpoint/prepare_volume_qa.py --source-commit "$COMMIT"
          bash tools/security/clamav_scan_gate.sh scan render-output/qa-volume-tiles qa/security/out.log
      - uses: actions/upload-artifact@v4
        with:
          name: volume-reference-NOT-APPROVED-${{ github.run_id }}
          path: render-output/qa-volume-tiles/
          retention-days: 14
          if-no-files-found: error
  left:
    needs: baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    container:
      image: ghcr.io/koda24-cell/kotama-blender53-clamav@sha256:5ce601f79b1ab09405b3ebc36b1a596be76cb8b105b1524fcbafcb186ebf7e99
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: volume-reference-NOT-APPROVED-${{ github.run_id }}
          path: reference
      - name: Verify and scan baseline before reuse
        env:
          COMMIT: ${{ github.sha }}
        run: |
          python3 tools/3d_checkpoint/checkpoint.py verify --directory reference --asset-id volume-baseline --source-script tools/3d_checkpoint/prepare_volume_qa.py --source-commit "$COMMIT"
          bash tools/security/clamav_scan_gate.sh update qa/security
          bash tools/security/clamav_scan_gate.sh scan reference qa/security/reference.log
          bash tools/security/clamav_scan_gate.sh scan tools/3d_checkpoint/render_half_frame.py qa/security/render.log
      - name: Render left 128-sample tile
        env:
          RESUME_BLEND: reference/volume_probe.blend
          RENDER_OUTPUT: render-output/volume-left
          RENDER_VIEW: front
          RENDER_TILE: left
          RENDER_SAMPLES: '128'
        run: blender -b --disable-autoexec --python-exit-code 1 -t 2 --python tools/3d_checkpoint/render_half_frame.py
      - name: Pack and scan left checkpoint
        env:
          COMMIT: ${{ github.sha }}
        run: |
          cp reference/volume_probe.blend render-output/volume-left/
          python3 tools/3d_checkpoint/checkpoint.py pack --directory render-output/volume-left --asset-id volume-left --iteration 2 --parent-checkpoint "volume-reference-${{ github.run_id }}" --source-script tools/3d_checkpoint/render_half_frame.py --source-commit "$COMMIT"
          python3 tools/3d_checkpoint/checkpoint.py verify --directory render-output/volume-left --asset-id volume-left --source-script tools/3d_checkpoint/render_half_frame.py --source-commit "$COMMIT"
          bash tools/security/clamav_scan_gate.sh scan render-output/volume-left qa/security/out.log
      - uses: actions/upload-artifact@v4
        with:
          name: volume-left-NOT-APPROVED-${{ github.run_id }}
          path: render-output/volume-left/
          retention-days: 14
          if-no-files-found: error
  right-and-qa:
    needs: left
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    container:
      image: ghcr.io/koda24-cell/kotama-blender53-clamav@sha256:5ce601f79b1ab09405b3ebc36b1a596be76cb8b105b1524fcbafcb186ebf7e99
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: volume-reference-NOT-APPROVED-${{ github.run_id }}
          path: reference
      - uses: actions/download-artifact@v4
        with:
          name: volume-left-NOT-APPROVED-${{ github.run_id }}
          path: saved-left
      - name: Verify saved source and left tile
        env:
          COMMIT: ${{ github.sha }}
        run: |
          python3 tools/3d_checkpoint/checkpoint.py verify --directory reference --asset-id volume-baseline --source-script tools/3d_checkpoint/prepare_volume_qa.py --source-commit "$COMMIT"
          python3 tools/3d_checkpoint/checkpoint.py verify --directory saved-left --asset-id volume-left --source-script tools/3d_checkpoint/render_half_frame.py --source-commit "$COMMIT"
          bash tools/security/clamav_scan_gate.sh update qa/security
          bash tools/security/clamav_scan_gate.sh scan reference qa/security/reference.log
          bash tools/security/clamav_scan_gate.sh scan saved-left qa/security/left.log
          bash tools/security/clamav_scan_gate.sh scan tools/3d_checkpoint/seam_qa.py qa/security/seam.log
      - name: Reuse exact left tile
        run: |
          mkdir -p render-output/volume-combined
          cp saved-left/left.png saved-left/volume_probe.blend render-output/volume-combined/
          test "$(sha256sum saved-left/left.png | cut -d' ' -f1)" = "$(sha256sum render-output/volume-combined/left.png | cut -d' ' -f1)"
      - name: Render right 128-sample tile
        env:
          RESUME_BLEND: saved-left/volume_probe.blend
          RENDER_OUTPUT: render-output/volume-combined
          RENDER_VIEW: front
          RENDER_TILE: right
          RENDER_SAMPLES: '128'
        run: blender -b --disable-autoexec --python-exit-code 1 -t 2 --python tools/3d_checkpoint/render_half_frame.py
      - name: Stitch and test seams
        run: |
          python3 tools/3d_checkpoint/stitch_half_frame.py --left render-output/volume-combined/left.png --right render-output/volume-combined/right.png --output render-output/volume-combined/front.png
          python3 tools/3d_checkpoint/seam_qa.py --stitched render-output/volume-combined/front.png --reference reference/front.png --report render-output/volume-combined/seam_qa.json
      - name: Pack and scan final checkpoint
        env:
          COMMIT: ${{ github.sha }}
        run: |
          python3 tools/3d_checkpoint/verify_one_view.py --file render-output/volume-combined/front.png --view front
          python3 tools/3d_checkpoint/checkpoint.py pack --directory render-output/volume-combined --asset-id volume-stitched --iteration 3 --parent-checkpoint "volume-left-${{ github.run_id }}" --source-script tools/3d_checkpoint/render_half_frame.py --source-commit "$COMMIT"
          python3 tools/3d_checkpoint/checkpoint.py verify --directory render-output/volume-combined --asset-id volume-stitched --source-script tools/3d_checkpoint/render_half_frame.py --source-commit "$COMMIT"
          bash tools/security/clamav_scan_gate.sh scan render-output/volume-combined qa/security/out.log
      - uses: actions/upload-artifact@v4
        with:
          name: volume-tiled-NOT-APPROVED-${{ github.run_id }}
          path: render-output/volume-combined/
          retention-days: 14
          if-no-files-found: error
