name: Floor3 Window Putty01 V3 Blender 5.3 Review
on:
  push:
    branches: [feature/gpt-f3-window-putty01-20261120]
    paths: ['tools/floor3/window_putty01/**','.github/workflows/f3-window-putty01-v3-render.yml']
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Python source check
        run: python3 -m py_compile tools/floor3/window_putty01/build_v3.py
      - name: Render independent aging putty with Blender 5.3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/f3_window_putty01_v3
          docker pull ghcr.io/koda24-cell/kotama-blender53-clamav@sha256:5ce601f79b1ab09405b3ebc36b1a596be76cb8b105b1524fcbafcb186ebf7e99
          docker run --rm --user "$(id -u):$(id -g)" --entrypoint /usr/local/bin/blender \
            -v "$PWD:/work" -w /work \
            ghcr.io/koda24-cell/kotama-blender53-clamav@sha256:5ce601f79b1ab09405b3ebc36b1a596be76cb8b105b1524fcbafcb186ebf7e99 \
            -b -t 2 --python /work/tools/floor3/window_putty01/build_v3.py 2>&1 | tee out/f3_window_putty01_v3/blender.log
          grep -q F3_PUTTY01_ALL_COMPLETE out/f3_window_putty01_v3/blender.log
      - name: Check files and produce hash manifest
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,os,struct
          p=Path('out/f3_window_putty01_v3')
          stem='f3_window_putty01_v3'
          names=[stem+'.glb',stem+'.blend','F3_PUTTY01_AGED_ALBEDO.png','F3_PUTTY01_ROUGHNESS.png']+[stem+'-'+v+'.png' for v in ('front','side','angle','surface_detail')]
          evidence={}
          for name in names:
              b=(p/name).read_bytes()
              assert len(b)>300,name
              if name.endswith('.png'):assert b[:8]==bytes.fromhex('89504e470d0a1a0a')
              if name.endswith('.blend'):assert b[:7]==b'BLENDER' or b[:4]==bytes.fromhex('28b52ffd')
              if name.endswith('.glb'):
                  assert b[:4]==b'glTF' and struct.unpack_from('<I',b,8)[0]==len(b)
                  glen=struct.unpack_from('<I',b,12)[0]
                  g=json.loads(b[20:20+glen])
                  assert len(g.get('meshes',[]))==1,'only chipped putty mesh expected; no floating cracks'
                  assert not any('Cube' in x.get('name','') or 'BACKDROP' in x.get('name','') for x in g.get('nodes',[]))
              evidence[name]={'size':len(b),'sha256':hashlib.sha256(b).hexdigest()}
          (p/'manifest.json').write_text(json.dumps({'asset':'F3_WINDOW_PUTTY01_V3','approval':'NOT_APPROVED','run_id':os.environ['GITHUB_RUN_ID'],'commit':os.environ['GITHUB_SHA'],'files':evidence},indent=2))
          print('F3_PUTTY01_QA_OK',len(evidence))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f3-window-putty01-v3
          path: out/f3_window_putty01_v3/
          retention-days: 14
