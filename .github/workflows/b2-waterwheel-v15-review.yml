name: B2 Waterwheel V15 Forged Iron PBR Blender QA
on:
  push:
    branches: [feature/gpt-b2-waterwheel-v07-resume-20261118]
    paths:
      - "tools/b2-waterwheel-paddle/build_paddle_v15_resume.py"
      - ".github/workflows/b2-waterwheel-v15-review.yml"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Checkpoint run identifier
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p docs/3d/b2-waterwheel-paddle-run
          echo "{\"run_id\":${RUN_ID},\"status\":\"STARTED_NOT_APPROVED\"}" > /tmp/b2-v15.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feature/gpt-b2-waterwheel-v07-resume-20261118
          git reset --hard origin/feature/gpt-b2-waterwheel-v07-resume-20261118
          cp /tmp/b2-v15.json docs/3d/b2-waterwheel-paddle-run/latest-v15.json
          git add docs/3d/b2-waterwheel-paddle-run/latest-v15.json
          git commit -m "chore(b2): V15 Blender run id" || true
          git push origin HEAD:feature/gpt-b2-waterwheel-v07-resume-20261118
      - name: Download verified V14 editable Blender checkpoint
        uses: actions/download-artifact@v4
        with:
          name: b2-waterwheel-v14-shallow-wood
          run-id: 44216971718
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: checkpoint
      - name: Verify untouched V14 checkpoint
        run: |
          echo "0c24b2c1b389bd361d90b84db0af086120fa652e6518952b6b84a2cf9d84081a  checkpoint/b2_bucket_paddle_blender_v14.blend" | sha256sum -c
          mkdir -p render-output/b2-waterwheel-v15
      - name: Real Blender V15 iron material bake and four views
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace lscr.io/linuxserver/blender:latest /blender/blender -b -t 2 --python tools/b2-waterwheel-paddle/build_paddle_v15_resume.py -- checkpoint/b2_bucket_paddle_blender_v14.blend render-output/b2-waterwheel-v15
      - name: Verify GLB embedded wood/iron maps and 4 PNGs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,struct
          p=Path("render-output/b2-waterwheel-v15")
          m=json.loads((p/"b2_bucket_paddle_blender_v15_manifest.json").read_text())
          assert m["status"]=="NOT_APPROVED" and m["timber_geometry_preserved"]
          assert m["forged_iron_texture_maps"]==2 and m["retextured_hardware_objects"]>=8
          assert len(m["files"])==6
          for name,meta in m["files"].items():
            b=(p/name).read_bytes()
            assert len(b)==meta["bytes"] and hashlib.sha256(b).hexdigest()==meta["sha256"]
            if name.endswith(".png"):assert b[:8]==bytes.fromhex("89504e470d0a1a0a")
            if name.endswith(".glb"):
              assert b[:4]==b"glTF"
              n=struct.unpack_from("<I",b,12)[0]
              j=json.loads(b[20:20+n]);assert len(j.get("images",[]))>=5
          print("V15_FORGED_IRON_PHOTO_WOOD_PBR_QA_SUCCESS")
          PY
      - name: Save V15 GLB, Blend and review renders temporarily
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b2-waterwheel-v15-wrought-iron
          path: render-output/b2-waterwheel-v15/
          if-no-files-found: warn
          retention-days: 14
