name: Blender 5.3 durable half-frame render recovery test
on:
  push:
    branches:
      - feature/blender53-half-frame-recovery-20261122
    paths:
      - '.github/workflows/blender53-half-frame-recovery.yml'
      - 'tools/3d_checkpoint/render_half_frame.py'
      - 'tools/3d_checkpoint/stitch_half_frame.py'
permissions:
  contents: read
  actions: read
  packages: read
jobs:
  original:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: ghcr.io/koda24-cell/kotama-blender53-clamav@sha256:5ce601f79b1ab09405b3ebc36b1a596be76cb8b105b1524fcbafcb186ebf7e99
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Confirm Blender 5.3 and scan sources
        run: |
          blender --version | head -1 | grep -Fx 'Blender 5.3.0'
          bash tools/security/clamav_scan_gate.sh update qa/security
          bash tools/security/clamav_scan_gate.sh scan tools/b2-render/build-watergate.py qa/security/source.log
      - name: Generate original 3D Blender checkpoint
        run: blender -b --disable-autoexec -t 2 --python tools/b2-render/build-watergate.py
      - name: QA, pack, verify and scan original
        env:
          COMMIT: ${{ github.sha }}
        run: |
          python3 tools/3d_checkpoint/render_qa.py --directory render-output/b2-watergate
          python3 tools/3d_checkpoint/checkpoint.py pack --directory render-output/b2-watergate --asset-id b2-watergate --iteration 1 --source-script tools/b2-render/build-watergate.py --source-commit "$COMMIT"
          python3 tools/3d_checkpoint/checkpoint.py verify --directory render-output/b2-watergate --asset-id b2-watergate --source-script tools/b2-render/build-watergate.py --source-commit "$COMMIT"
          bash tools/security/clamav_scan_gate.sh scan render-output/b2-watergate qa/security/base-output.log
      - uses: actions/upload-artifact@v4
        with:
          name: half-frame-base-NOT-APPROVED-${{ github.run_id }}
          path: render-output/b2-watergate/
          retention-days: 14
          if-no-files-found: error
  left-half:
    needs: original
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: ghcr.io/koda24-cell/kotama-blender53-clamav@sha256:5ce601f79b1ab09405b3ebc36b1a596be76cb8b105b1524fcbafcb186ebf7e99
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: half-frame-base-NOT-APPROVED-${{ github.run_id }}
          path: base
      - name: Verify source and scan before importing Blender
        env:
          COMMIT: ${{ github.sha }}
        run: |
          blender --version | head -1 | grep -Fx 'Blender 5.3.0'
          python3 tools/3d_checkpoint/checkpoint.py verify --directory base --asset-id b2-watergate --source-script tools/b2-render/build-watergate.py --source-commit "$COMMIT"
          bash tools/security/clamav_scan_gate.sh update qa/security
          bash tools/security/clamav_scan_gate.sh scan base qa/security/base.log
          bash tools/security/clamav_scan_gate.sh scan tools/3d_checkpoint/render_half_frame.py qa/security/render-script.log
          bash tools/security/clamav_scan_gate.sh scan tools/3d_checkpoint/stitch_half_frame.py qa/security/stitch-script.log
      - name: Render the left half of FRONT only
        env:
          RESUME_BLEND: base/frozen_watergate_v09.blend
          RENDER_OUTPUT: render-output/left-half
          RENDER_VIEW: front
          RENDER_TILE: left
        run: blender -b --disable-autoexec -t 2 --python tools/3d_checkpoint/render_half_frame.py
      - name: Validate, pack and scan left half independently
        env:
          COMMIT: ${{ github.sha }}
        run: |
          cp base/frozen_watergate_v09.blend base/frozen_watergate_v09.glb base/side.png base/angle.png render-output/left-half/
          python3 -c 'from tools import nowhere' 2>/dev/null && exit 1 || true
          python3 -c "import importlib.util; p='tools/3d_checkpoint/stitch_half_frame.py'; s=importlib.util.spec_from_file_location('tiles',p); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); w,h,_=m.read_rgba('render-output/left-half/left.png'); assert (w,h)==(500,760),(w,h); print('LEFT_HALF_COMPLETE=500x760')"
          python3 tools/3d_checkpoint/checkpoint.py pack --directory render-output/left-half --asset-id b2-front-left-half --iteration 2 --parent-checkpoint "half-frame-base-${{ github.run_id }}" --source-script tools/3d_checkpoint/render_half_frame.py --source-commit "$COMMIT"
          python3 tools/3d_checkpoint/checkpoint.py verify --directory render-output/left-half --asset-id b2-front-left-half --source-script tools/3d_checkpoint/render_half_frame.py --source-commit "$COMMIT"
          bash tools/security/clamav_scan_gate.sh scan render-output/left-half qa/security/left-output.log
      - name: Upload left half BEFORE the right-hand render
        uses: actions/upload-artifact@v4
        with:
          name: half-frame-left-NOT-APPROVED-${{ github.run_id }}
          path: render-output/left-half/
          retention-days: 14
          if-no-files-found: error
  kill-right:
    needs: left-half
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: ghcr.io/koda24-cell/kotama-blender53-clamav@sha256:5ce601f79b1ab09405b3ebc36b1a596be76cb8b105b1524fcbafcb186ebf7e99
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: half-frame-left-NOT-APPROVED-${{ github.run_id }}
          path: left-saved
      - name: Verify left-half checkpoint and scan before kill
        env:
          COMMIT: ${{ github.sha }}
        run: |
          python3 tools/3d_checkpoint/checkpoint.py verify --directory left-saved --asset-id b2-front-left-half --source-script tools/3d_checkpoint/render_half_frame.py --source-commit "$COMMIT"
          bash tools/security/clamav_scan_gate.sh update qa/security
          bash tools/security/clamav_scan_gate.sh scan left-saved qa/security/input.log
          bash tools/security/clamav_scan_gate.sh scan tools/3d_checkpoint/render_half_frame.py qa/security/source.log
      - name: Intentionally SIGKILL the RIGHT Blender child
        env:
          RESUME_BLEND: left-saved/frozen_watergate_v09.blend
          RENDER_OUTPUT: lost-right
          RENDER_VIEW: front
          RENDER_TILE: right
          KILL_AT_RENDER_PRE: '1'
          KILL_PROBE_SENTINEL: qa/right-kill.txt
        run: |
          mkdir -p qa
          set +e
          blender -b --disable-autoexec -t 2 --python tools/3d_checkpoint/render_half_frame.py
          rc=$?
          set -e
          echo "RIGHT_HALF_KILL_EXIT=$rc"
          grep -Fx 'KILL_DURING_RIGHT_RENDER_PRE' qa/right-kill.txt
          test "$rc" -eq 137
          echo "EXPECTED_RIGHT_HALF_KILL=true"
          exit 1
  resume-right:
    needs: [left-half, kill-right]
    if: ${{ always() && needs.left-half.result == 'success' && needs.kill-right.result == 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: ghcr.io/koda24-cell/kotama-blender53-clamav@sha256:5ce601f79b1ab09405b3ebc36b1a596be76cb8b105b1524fcbafcb186ebf7e99
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: half-frame-left-NOT-APPROVED-${{ github.run_id }}
          path: left-saved
      - name: Validate, scan left-half and script before recovery
        env:
          COMMIT: ${{ github.sha }}
        run: |
          blender --version | head -1 | grep -Fx 'Blender 5.3.0'
          python3 tools/3d_checkpoint/checkpoint.py verify --directory left-saved --asset-id b2-front-left-half --source-script tools/3d_checkpoint/render_half_frame.py --source-commit "$COMMIT"
          bash tools/security/clamav_scan_gate.sh update qa/security
          bash tools/security/clamav_scan_gate.sh scan left-saved qa/security/saved-left.log
          bash tools/security/clamav_scan_gate.sh scan tools/3d_checkpoint/render_half_frame.py qa/security/render-source.log
          bash tools/security/clamav_scan_gate.sh scan tools/3d_checkpoint/stitch_half_frame.py qa/security/stitch-source.log
      - name: Reuse left tile byte-for-byte, without rerendering
        run: |
          mkdir -p render-output/recovered-frame
          cp left-saved/left.png render-output/recovered-frame/left.png
          cp left-saved/frozen_watergate_v09.blend left-saved/frozen_watergate_v09.glb left-saved/side.png left-saved/angle.png render-output/recovered-frame/
          test "$(sha256sum left-saved/left.png | cut -d' ' -f1)" = "$(sha256sum render-output/recovered-frame/left.png | cut -d' ' -f1)"
          echo 'LEFT_HALF_REUSED_WITHOUT_RENDER=true'
      - name: Restart only right-hand HALF of front image
        env:
          RESUME_BLEND: left-saved/frozen_watergate_v09.blend
          RENDER_OUTPUT: render-output/recovered-frame
          RENDER_VIEW: front
          RENDER_TILE: right
        run: blender -b --disable-autoexec -t 2 --python tools/3d_checkpoint/render_half_frame.py
      - name: Stitch front from two verified half-images
        run: python3 tools/3d_checkpoint/stitch_half_frame.py --left render-output/recovered-frame/left.png --right render-output/recovered-frame/right.png --output render-output/recovered-frame/front.png
      - name: QA all 3 directions and pack final checkpoint
        env:
          COMMIT: ${{ github.sha }}
        run: |
          python3 tools/3d_checkpoint/render_qa.py --directory render-output/recovered-frame
          python3 tools/3d_checkpoint/checkpoint.py pack --directory render-output/recovered-frame --asset-id b2-half-frame-recovered --iteration 3 --parent-checkpoint "half-frame-left-${{ github.run_id }}" --source-script tools/3d_checkpoint/render_half_frame.py --source-commit "$COMMIT"
          python3 tools/3d_checkpoint/checkpoint.py verify --directory render-output/recovered-frame --asset-id b2-half-frame-recovered --source-script tools/3d_checkpoint/render_half_frame.py --source-commit "$COMMIT"
          bash tools/security/clamav_scan_gate.sh scan render-output/recovered-frame qa/security/recovered-output.log
      - uses: actions/upload-artifact@v4
        with:
          name: half-frame-RECOVERED-NOT-APPROVED-${{ github.run_id }}
          path: render-output/recovered-frame/
          retention-days: 14
          if-no-files-found: error
