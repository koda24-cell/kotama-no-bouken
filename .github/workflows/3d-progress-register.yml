name: Register cleared 3D render previews
on:
  workflow_call:
    inputs:
      artifact:
        required: true
        type: string
      publication_cleared:
        required: true
        type: boolean
permissions:
  contents: write
jobs:
  register:
    if: inputs.publication_cleared == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: source
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: output
      - uses: actions/checkout@v4
        with:
          ref: 3d-progress-data
          path: registry
      - name: Scan downloaded preview files
        run: |
          docker run --rm -v "$PWD/output:/scan:ro" ghcr.io/koda24-cell/kotama-blender53-clamav@sha256:5ce601f79b1ab09405b3ebc36b1a596be76cb8b105b1524fcbafcb186ebf7e99 bash -ec 'freshclam; clamscan --infected -r /scan'
      - name: Validate provenance and register
        env:
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("output/manifest.json")
          m=json.loads(p.read_text())
          assert m["run_id"]==int(os.environ["RUN_ID"])
          assert m["source_sha"]==os.environ["SOURCE_SHA"]
          assert m["publication_cleared"] is True
          PY
          python3 source/tools/3d-progress/register.py --registry registry --manifest output/manifest.json --source output
      - name: Commit registry without force push
        working-directory: registry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.json renders/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Register cleared render previews"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:3d-progress-data; then exit 0; fi
            git fetch origin 3d-progress-data
            git reset --hard origin/3d-progress-data
            python3 ../source/tools/3d-progress/register.py --registry . --manifest ../output/manifest.json --source ../output
            git add -- index.json renders/
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Register cleared render previews (retry)"
            sleep "$attempt"
          done
          exit 1
