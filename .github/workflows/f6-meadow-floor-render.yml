name: F6 Meadow Floor Render
on:
  push:
    branches: [feature/f6-wind-meadow-floor-20261114]
  pull_request:
    branches: [development]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Validate script
        run: python3 -m py_compile tools/floor6/meadow_floor_v1.py
      - name: Install Blender dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y blender python3-numpy
      - name: Render meadow floor
        run: |
          set -euo pipefail
          blender -b -t 2 --python tools/floor6/meadow_floor_v1.py 2>&1 | tee /tmp/f6-meadow.log
          grep -q F6_MEADOW_DONE /tmp/f6-meadow.log
      - name: Verify files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('render-output/floor6/meadow-floor')
          for name in ['f6_meadow_floor_v1.glb']+[f'f6_meadow_{v}.png' for v in ('angle','front','side','top')]:
              f=p/name
              assert f.exists() and f.stat().st_size>1000,name
              assert f.read_bytes()[:4]==(b'glTF' if name.endswith('.glb') else bytes([137,80,78,71])),name
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f6-meadow-floor-v1
          path: render-output/floor6/meadow-floor/
          retention-days: 14
