name: 3dnchu R01 Blender 5.3 A-B-C render
# Research-only A/B evidence; never promotes production assets.
on:
  push:
    branches:
      - research/3dnchu-20-techniques-20261120
    paths:
      - 'tools/tech-research/**'
      - '.github/workflows/3dnchu-r01-abc-render.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    container:
      image: ghcr.io/koda24-cell/kotama-blender53-clamav@sha256:5ce601f79b1ab09405b3ebc36b1a596be76cb8b105b1524fcbafcb186ebf7e99
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assert exact Blender 5.3.0
        run: blender --version | head -n 1 | grep -Fx 'Blender 5.3.0'
      - name: Refresh ClamAV signatures
        run: bash tools/security/clamav_scan_gate.sh update qa/security
      - name: Scan source before Blender execution
        run: bash tools/security/clamav_scan_gate.sh scan tools/tech-research/tech01_stylized_abc.py qa/security/source.log
      - name: Render R01 before and after in Blender 5.3
        env:
          OUTPUT_DIR: ${{ github.workspace }}/outputs/tech01_abc
        run: blender -b --disable-autoexec -t 2 --python tools/tech-research/tech01_stylized_abc.py
      - name: Validate PNG and blend outputs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          d=Path('outputs/tech01_abc')
          expected={f'{phase}_{view}.png' for phase in ('A_noise','B_voronoi','C_fresnel') for view in ('front','side','angle','top')}
          actual={p.name for p in d.glob('*.png')}
          assert actual==expected,(actual,expected)
          files=sorted(d.glob('*.png'))+[d/'tech01_abc.blend']
          for p in files:
              data=p.read_bytes()
              assert len(data)>100,p
              if p.suffix=='.png':assert data.startswith(bytes.fromhex('89504e470d0a1a0a')),p
          manifest=json.loads((d/'manifest.json').read_text())
          assert manifest['blender'].startswith('5.3.'),manifest['blender']
          manifest['files']={p.name:{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in files}
          (d/'manifest.json').write_text(json.dumps(manifest,indent=2))
          print('R01_12_PNG_BLEND_VERIFIED_NOT_APPROVED')
          PY
      - name: Scan generated artifacts
        run: bash tools/security/clamav_scan_gate.sh scan outputs/tech01_abc qa/security/output.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 3dnchu-r01-abc-evidence-NOT-APPROVED
          path: |
            outputs/tech01_abc/
            qa/security/
          retention-days: 14
          if-no-files-found: warn
