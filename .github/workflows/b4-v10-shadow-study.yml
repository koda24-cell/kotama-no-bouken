name: B4 V10 Directional Shadow Study
on:
  push:
    branches:
      - feature/b4-rockwall-v10-shadow-study-20261113
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts --no-package-lock three@0.160.1
      - run: node tools/b4-render/export-rockwall-v9.mjs
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy
      - name: Render 5 views with side key and restrained fill
        run: |
          blender -b -t 2 --python-exit-code 1 --python tools/b4-render/render-rockwall-v10-shadows.py -- render-output/b4-lava-rockwall-v9-front-relief.glb render-output
          test "$(find render-output -name '*.png' | wc -l)" -eq 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b4-v10-shadow-study
          path: render-output/
          retention-days: 14
