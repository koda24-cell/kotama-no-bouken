name: B2 Single Oak Axle V01 Blender 5.3 Four View QA
on:
  push:
    branches: [feature/gpt-b2-single-aged-timber-axle-v01-20261119]
    paths:
      - 'tools/b2-waterwheel-axle/build_aged_oak_axle_v01.py'
      - '.github/workflows/b2-single-oak-axle-v01.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Record run for handoff and temporary review
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feature/gpt-b2-single-aged-timber-axle-v01-20261119
          git reset --hard origin/feature/gpt-b2-single-aged-timber-axle-v01-20261119
          mkdir -p docs/3d/b2-waterwheel-axle
          echo "{\"run_id\":${RUN_ID},\"status\":\"RUNNING_NOT_APPROVED\"}" > docs/3d/b2-waterwheel-axle/latest-v01.json
          git add docs/3d/b2-waterwheel-axle/latest-v01.json
          git commit -m "chore(b2): record axle Cycles render run"
          git push origin HEAD:feature/gpt-b2-single-aged-timber-axle-v01-20261119
      - name: Actual Blender 5.3 create oak axle and Cycles renders
        run: |
          set -o pipefail
          mkdir -p render-output/b2-oak-axle-v01
          docker run --rm -v "$PWD:/workspace" -w /workspace ghcr.io/koda24-cell/kotama-blender53-clamav@sha256:5ce601f79b1ab09405b3ebc36b1a596be76cb8b105b1524fcbafcb186ebf7e99 blender -b -t 2 --python-exit-code 1 --python tools/b2-waterwheel-axle/build_aged_oak_axle_v01.py -- render-output/b2-oak-axle-v01 | tee /tmp/b2-axle.log
          grep -q 'B2_OAK_AXLE_V01_REAL_CYCLES_COMPLETE' /tmp/b2-axle.log
      - name: SHA and glTF structural verification
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,struct
          p=Path('render-output/b2-oak-axle-v01')
          m=json.loads((p/'b2_single_oak_waterwheel_axle_v01_manifest.json').read_text())
          assert m['mesh_parts']==1 and m['approval']=='NOT_APPROVED'
          assert m['shaft_axis']=='X' and len(m['files'])==8 and m['textures_generated']==2
          assert m['mesh_faces']>500
          for name,q in m['files'].items():
              bb=(p/name).read_bytes()
              assert len(bb)==q['bytes'] and hashlib.sha256(bb).hexdigest()==q['sha256'],name
              if name.endswith('.png'):assert bb.startswith(bytes.fromhex('89504e470d0a1a0a'))
              if name.endswith('.glb'):
                assert bb[:4]==b'glTF'
                n=struct.unpack_from('<I',bb,12)[0]
                j=json.loads(bb[20:20+n])
                assert len(j.get('meshes',[]))==1 and len(j.get('images',[]))==2
              if name.endswith('.blend'):assert len(bb)>100000
          print('B2_OAK_AXLE_V01_GLTF_IMAGE_HASHES_PASS')
          PY
      - name: Scan actual generated files with fresh signatures
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace --entrypoint sh ghcr.io/koda24-cell/kotama-blender53-clamav@sha256:5ce601f79b1ab09405b3ebc36b1a596be76cb8b105b1524fcbafcb186ebf7e99 -c 'set -e; mkdir -p /tmp/clamdb; chmod 777 /tmp/clamdb; freshclam --stdout --datadir=/tmp/clamdb; clamscan --database=/tmp/clamdb -r --infected render-output/b2-oak-axle-v01'
      - name: Temporary review only, not approved
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b2-single-oak-waterwheel-axle-v01
          path: render-output/b2-oak-axle-v01
          retention-days: 14
          if-no-files-found: warn
