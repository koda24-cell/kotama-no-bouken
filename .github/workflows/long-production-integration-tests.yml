name: Long production integration foundation
on:
  push:
    branches:
      - feature/long-production-integration-20261124
    paths:
      - 'tools/3d_checkpoint/*production*.py'
      - '.github/workflows/long-production*.yml'
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tools/3d_checkpoint -p 'test_production*.py' -v
      - run: python3 -m unittest discover -s tools/3d_checkpoint -p 'test_*.py' -v
