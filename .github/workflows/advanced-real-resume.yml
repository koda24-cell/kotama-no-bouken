name: Advanced real Blender fault and cross-job resume
on:
  pull_request:
    branches: [development]
    paths:
      - 'tools/3d_checkpoint/advanced_*.py'
      - '.github/workflows/advanced-real-resume.yml'
permissions:
  contents: read
  packages: read
jobs:
  partial:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    container:
      image: ghcr.io/koda24-cell/kotama-blender53-clamav@sha256:5ce601f79b1ab09405b3ebc36b1a596be76cb8b105b1524fcbafcb186ebf7e99
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      SOURCE: assets/3d/dungeons/b1_ancient_forest/modules/mod_pillar_corner.glb
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash tools/security/clamav_scan_gate.sh update qa/security
      - run: |
          python3 tools/3d_checkpoint/advanced_real_session.py --source "$SOURCE" --output /tmp/advanced-resume --minutes 45 --fault-test --pause-after 1
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("/tmp/advanced-resume")
          assert list(json.loads((p/"round-0/session.json").read_text())["done"])==["baseline"]
          assert any("intentional recovery fixture" in f.read_text(errors="replace") for f in p.glob("baseline-*.log"))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: real-partial-NOT-APPROVED
          path: /tmp/advanced-resume
          retention-days: 14
  resume:
    needs: partial
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    container:
      image: ghcr.io/koda24-cell/kotama-blender53-clamav@sha256:5ce601f79b1ab09405b3ebc36b1a596be76cb8b105b1524fcbafcb186ebf7e99
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      SOURCE: assets/3d/dungeons/b1_ancient_forest/modules/mod_pillar_corner.glb
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash tools/security/clamav_scan_gate.sh update qa/security
      - uses: actions/download-artifact@v4
        with:
          name: real-partial-NOT-APPROVED
          path: /tmp/advanced-resume
      - run: |
          bash tools/security/clamav_scan_gate.sh scan /tmp/advanced-resume qa/security/resume.log
          cp /tmp/advanced-resume/round-0/session.json /tmp/prior.json
          python3 tools/3d_checkpoint/advanced_real_session.py --source "$SOURCE" --output /tmp/advanced-resume --minutes 65
          python3 - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("/tmp/prior.json").read_text())
          b=json.loads(Path("/tmp/advanced-resume/round-0/session.json").read_text())
          assert a["done"]["baseline"]==b["done"]["baseline"]
          assert len(b["done"])==5
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-resumed-NOT-APPROVED
          path: /tmp/advanced-resume
          retention-days: 14
