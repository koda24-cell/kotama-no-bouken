name: Import Poly Haven CC0 Rock Face
on:
  push:
    branches:
      - feature/b4-polyhaven-rock-face-reference-20261114
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch 1k glTF and verify dependencies
        run: python tools/b4-render/fetch-polyhaven-rock-face.py
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy
      - name: Convert glTF to GLB
        run: blender -b -t 2 --python-exit-code 1 --python tools/b4-render/convert-polyhaven-rock-face.py
      - name: Commit CC0 reference
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/reference/cc0/polyhaven-rock-face-02/
          if ! git diff --cached --quiet; then
            git commit -m "Import Poly Haven CC0 Rock Face 02 reference"
            git push origin HEAD:feature/b4-polyhaven-rock-face-reference-20261114
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polyhaven-rock-face-02-reference
          path: assets/reference/cc0/polyhaven-rock-face-02/
          retention-days: 14
