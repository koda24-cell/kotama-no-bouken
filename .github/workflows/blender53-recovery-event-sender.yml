name: Notify shared Blender recovery on checkpoint completion
on:
  workflow_run:
    workflows:
      - Blender 5.3 durable stage-boundary checkpoint test
    types: [completed]
    branches: [development]
permissions:
  contents: read
jobs:
  notify:
    if: ${{ github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check scoped cross-repository credentials
        id: credential
        env:
          APP_ID: ${{ vars.KOTAMA_RECOVERY_EVENT_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.KOTAMA_RECOVERY_EVENT_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$APP_PRIVATE_KEY" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'EVENT_SENDER_SKIPPED=missing_scoped_app_credentials'
          fi
      - uses: actions/create-github-app-token@v2
        if: ${{ steps.credential.outputs.configured == 'true' }}
        id: app
        with:
          app-id: ${{ vars.KOTAMA_RECOVERY_EVENT_APP_ID }}
          private-key: ${{ secrets.KOTAMA_RECOVERY_EVENT_APP_PRIVATE_KEY }}
          owner: koda24-cell
          repositories: 3d-asset-studio
          permission-contents: read
      - name: Notify validation-only receiver
        if: ${{ steps.credential.outputs.configured == 'true' }}
        env:
          TARGET_TOKEN: ${{ steps.app.outputs.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_REPOSITORY: ${{ github.event.workflow_run.repository.full_name }}
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.path }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          assert os.environ['SOURCE_REPOSITORY'] == 'koda24-cell/kotama-no-bouken'
          assert os.environ['SOURCE_WORKFLOW'].endswith('/blender53-stage-boundary-checkpoints.yml')
          assert os.environ['SOURCE_CONCLUSION'] in ('failure', 'timed_out')
          payload = {'event_type': 'kotama_blender_run_completed', 'client_payload': {
              'source_run_id': str(os.environ['SOURCE_RUN_ID']),
              'source_repository': os.environ['SOURCE_REPOSITORY'],
              'source_workflow': 'blender53-stage-boundary-checkpoints.yml',
              'conclusion': os.environ['SOURCE_CONCLUSION']}}
          request = urllib.request.Request(
              'https://api.github.com/repos/koda24-cell/3d-asset-studio/dispatches',
              data=json.dumps(payload).encode(),
              headers={'Authorization': 'Bearer ' + os.environ['TARGET_TOKEN'],
                       'Accept': 'application/vnd.github+json',
                       'X-GitHub-Api-Version': '2022-11-28',
                       'User-Agent': 'kotama-event-recovery-sender'},
              method='POST')
          with urllib.request.urlopen(request, timeout=30) as response:
              assert response.status == 204
              print('EVENT_SENDER_DISPATCH_HTTP=204')
          PY
