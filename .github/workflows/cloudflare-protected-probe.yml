name: Cloudflare protected probe (password) — deploy / update / rollback
# Dummy probe files only. Driven by tools/cloudflare-preview/update-check.json:
#   action=update   store PREVIEW_PASSWORD on the project, deploy the probe with
#                   the password worker, verify the new deployment, delete every
#                   older unprotected deployment, then verify all hostnames
#   action=rollback move the fixed URL to the previous protected deployment and verify
on:
  push:
    branches: [feature/gpt-cloudflare-private-preview-preflight-20261127]
    paths:
      - 'tools/cloudflare-preview/update-check.json'
      - 'tools/cloudflare-preview/worker/**'
      - '.github/workflows/cloudflare-protected-probe.yml'

permissions:
  contents: read
concurrency:
  group: cloudflare-probe-deploy
  cancel-in-progress: false
jobs:
  probe:
    if: github.repository == 'koda24-cell/kotama-no-bouken' && github.ref == 'refs/heads/feature/gpt-cloudflare-private-preview-preflight-20261127'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PREVIEW_PASSWORD: ${{ secrets.PREVIEW_PASSWORD }}
      GATE: python3 tools/cloudflare-preview/pages_gate.py
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: tools/cloudflare-preview
      - name: Read requested action
        id: req
        run: |
          set -euo pipefail
          action="$(jq -er '.action' tools/cloudflare-preview/update-check.json)"
          rev="$(jq -er '.revision|tostring' tools/cloudflare-preview/update-check.json)"
          [[ "$action" == update || "$action" == rollback ]]
          [[ "$rev" =~ ^[0-9]{1,6}$ ]]
          echo "action=$action" >> "$GITHUB_OUTPUT"; echo "rev=$rev" >> "$GITHUB_OUTPUT"
      - name: Store password as Pages secret
        if: steps.req.outputs.action == 'update'
        run: $GATE configure
      - name: Build stamped probe with password worker
        if: steps.req.outputs.action == 'update'
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/site"; mkdir -p "$site"
          cp tools/cloudflare-preview/probe/{index.html,probe.css,probe.js,probe.svg} "$site/"
          cp tools/cloudflare-preview/worker/_worker.js "$site/_worker.js"
          stamp="Update check revision ${{ steps.req.outputs.rev }} / run ${GITHUB_RUN_ID}"
          python3 - "$site/index.html" "$stamp" <<'PY'
          import sys, html
          p, stamp = sys.argv[1], sys.argv[2]
          s = open(p).read()
          assert "</main>" in s
          open(p, "w").write(s.replace("</main>", '<p id="update-stamp">' + html.escape(stamp) + "</p></main>", 1))
          PY
          echo "$stamp" >> "$GITHUB_STEP_SUMMARY"
          cd "$RUNNER_TEMP" && npm install --no-audit --no-fund --save-exact wrangler@4.168.0 >/dev/null
      - name: Deploy protected probe to the fixed URL
        if: steps.req.outputs.action == 'update'
        id: dep
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_SEND_METRICS: 'false'
        run: |
          set -euo pipefail
          before="$($GATE canonical)"
          (cd "$RUNNER_TEMP" && ./node_modules/.bin/wrangler pages deploy site \
            --project-name=kotama-private-probe-20261127 --branch=probe-20261127 \
            --commit-hash="$GITHUB_SHA" --commit-dirty=true \
            --commit-message="[protected] probe revision ${{ steps.req.outputs.rev }} run ${GITHUB_RUN_ID}")
          sleep 15
          after="$($GATE canonical)"
          [[ "$after" != "$before" ]] || { echo "::error::Fixed URL still points at the old deployment"; exit 1; }
          echo "id=$after" >> "$GITHUB_OUTPUT"
          echo "Fixed URL deployment ${before:0:8} -> ${after:0:8}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Verify the new deployment before removing old ones
        if: steps.req.outputs.action == 'update'
        run: $GATE gate --deployment "${{ steps.dep.outputs.id }}"
      - name: Delete older unprotected deployments
        if: steps.req.outputs.action == 'update'
        run: $GATE purge-unprotected
      - name: Roll back to previous protected deployment
        if: steps.req.outputs.action == 'rollback'
        run: $GATE rollback
      - name: Verify every hostname of the project
        run: |
          sleep 10
          $GATE gate
