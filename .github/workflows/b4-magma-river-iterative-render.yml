name: B4 Magma River Blender Iterative Render
on:
  push:
    branches:
      - feature/gpt-b4-basalt-geology-v10-20261117
    paths:
      - '.github/workflows/b4-magma-river-iterative-render.yml'
      - 'tools/floor4/magma_river/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  magma-render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and numpy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy
      - name: Render molten river, lava pool, cascade and basalt shore
        run: |
          mkdir -p render-output
          blender -b -t 2 --python tools/floor4/magma_river/build_magma_river.py -- --out render-output --variant v12
      - name: Verify GLB, Blender source, 4 real views and manifest
        run: |
          python3 - <<'PY'
          import os,json,struct
          p='render-output';v='v12'
          names=[f'b4-magma-river-{v}.{e}' for e in ('glb','blend')]+[f'b4-magma-river-{v}-{a}.png' for a in ('angle','front','side','top')]
          for n in names:
            f=os.path.join(p,n)
            assert os.path.isfile(f) and os.stat(f).st_size>5000,(n,'missing or too small')
          with open(os.path.join(p,names[0]),'rb') as f:
            assert f.read(4)==b'glTF'
            f.seek(12);length,kind=struct.unpack('<II',f.read(8))
            data=json.loads(f.read(length))
          assert len(data.get('meshes',[]))>50
          assert len(data.get('images',[]))>=4
          manifest=json.load(open(os.path.join(p,f'manifest-{v}.json')))
          manifest['source_sha']=os.environ.get('GITHUB_SHA')
          manifest['run_id']=os.environ.get('GITHUB_RUN_ID')
          open(os.path.join(p,f'manifest-{v}.json'),'w').write(json.dumps(manifest,indent=2))
          print('verified meshes',len(data['meshes']),'images',len(data['images']))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b4-magma-river-v12-review
          path: render-output/
          retention-days: 14
