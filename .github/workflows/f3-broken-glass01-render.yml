name: Floor3 Broken Window Glass01 Blender Review
on:
  push:
    branches: [feature/gpt-f3-broken-window-glass01-20261119]
    paths: ['tools/floor3/broken_glass01/**','.github/workflows/f3-broken-glass01-render.yml']
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Compile Blender model script
        run: python3 -m py_compile tools/floor3/broken_glass01/build.py
      - name: Blender produce GLB, Blend checkpoint, PNG views
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/f3_broken_glass01
          printf '{"asset":"F3_BROKEN_GLASS01","status":"STARTED","approval":"NOT_APPROVED","run_id":"%s","source_commit":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > out/f3_broken_glass01/progress.json
          docker pull lscr.io/linuxserver/blender:latest
          docker run --rm --user "$(id -u):$(id -g)" --entrypoint /usr/bin/blender \
            -v "$PWD:/work" -w /work lscr.io/linuxserver/blender:latest -b -t 2 --python /work/tools/floor3/broken_glass01/build.py 2>&1 | tee out/f3_broken_glass01/blender.log
          grep -q F3_BROKEN_GLASS_ALL_COMPLETE out/f3_broken_glass01/blender.log
      - name: Validate all delivered assets and checkpoint
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os,json,hashlib,struct
          root=Path('out/f3_broken_glass01')
          names=['F3_WINDOW_DIRT_MASK_01.png']
          for v in (1,2,3):
              stem=f'f3_broken_glass01_v{v}'
              names.extend([stem+'.glb',stem+'.blend']+[stem+'-'+d+'.png' for d in ('front','side','angle')])
          files={}
          for n in names:
              b=(root/n).read_bytes()
              assert len(b)>400,n
              if n.endswith('.glb'):
                  assert b[:4]==b'glTF' and struct.unpack_from('<I',b,8)[0]==len(b),n
              if n.endswith('.blend'):
                  assert b.startswith(b'BLENDER') or b.startswith(bytes.fromhex('28b52ffd')),n
              if n.endswith('.png'):
                  assert b[:8]==bytes.fromhex('89504e470d0a1a0a'),n
              files[n]={'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()}
          (root/'manifest.json').write_text(json.dumps({'asset':'F3_BROKEN_GLASS01','approval':'NOT_APPROVED','run_id':os.environ['GITHUB_RUN_ID'],'source_sha':os.environ['GITHUB_SHA'],'files':files},indent=2))
          print('F3_BROKEN_GLASS_QA_OK',len(files))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f3-broken-glass01-v1-v3
          path: out/f3_broken_glass01/
          retention-days: 14
