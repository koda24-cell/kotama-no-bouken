name: Long production integrated smoke
on:
  pull_request:
    branches: [development]
    paths:
      - 'tools/3d_checkpoint/production*.py'
      - '.github/workflows/long-production-integrated-smoke.yml'
permissions:
  contents: read
  packages: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ghcr.io/koda24-cell/kotama-blender53-clamav@sha256:5ce601f79b1ab09405b3ebc36b1a596be76cb8b105b1524fcbafcb186ebf7e99
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create isolated scene and reference
        run: |
          mkdir -p smoke-input/references
          blender --version | head -1 | grep -Fx 'Blender 5.3.0'
          blender -b --factory-startup --disable-autoexec --python-exit-code 1 --python-expr 'import bpy; s=bpy.context.scene; s.render.engine="CYCLES"; s.cycles.samples=4; s.render.resolution_x=128; s.render.resolution_y=96; s.render.resolution_percentage=100; s.render.image_settings.file_format="PNG"; s.render.image_settings.color_mode="RGBA"; s.render.filepath="//references/front-1.png"; bpy.ops.wm.save_as_mainfile(filepath="smoke-input/scene.blend"); bpy.ops.render.render(write_still=True)'
          test -s smoke-input/references/front-1.png
          echo '{"width":128,"height":96,"columns":2,"rows":2,"views":["front"],"frames":[1],"cameras":{"front":"Camera"}}' > smoke-input/plan.json
      - name: Scan input and production scripts
        run: |
          bash tools/security/clamav_scan_gate.sh update qa/security
          bash tools/security/clamav_scan_gate.sh scan smoke-input qa/security/input.log
          bash tools/security/clamav_scan_gate.sh scan tools/3d_checkpoint qa/security/source.log
      - name: Run integrated production
        run: python3 tools/3d_checkpoint/production_run.py --plan smoke-input/plan.json --source smoke-input/scene.blend --references smoke-input/references --output smoke-output --minutes 60
      - name: Scan output
        if: always()
        run: |
          if test -d smoke-output; then bash tools/security/clamav_scan_gate.sh scan smoke-output qa/security/output.log; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-smoke-NOT-APPROVED-${{ github.run_id }}
          path: smoke-output
          if-no-files-found: warn
