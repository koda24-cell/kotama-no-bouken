name: F6 Foliage Normal Transfer A-B-C Review (Unapproved)
on:
  push:
    branches:
      - feature/f6-foliage-normal-shading-prototype-20261119
    paths:
      - tools/floor6/foliage_normals_trial.py
      - .github/workflows/f6-foliage-normals-abc.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  render-and-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Static Python syntax check
        run: python3 -m py_compile tools/floor6/foliage_normals_trial.py
      - name: Restore verified V27 source Blender project
        env:
          GH_TOKEN: $\{{ github.token }}
        run: |
          set -euo pipefail
          gh run download 44447197961 --repo "$\{{ github.repository }}" \
            --name f6-v19-v27-bark-leaf-refinement-comparison-NOT-APPROVED \
            --dir /tmp/f6-normals-source
          test -s /tmp/f6-normals-source/nature/tree_mature_photo_v27/tree_mature_photo_v20.blend
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          d=Path("/tmp/f6-normals-source/nature/tree_mature_photo_v27")
          m=json.loads((d/"manifest.json").read_text())
          assert m["status"]=="NOT_APPROVED" and m["version"].startswith("V27")
          for f in m["files"]:
              p=d/f["name"]
              assert p.exists() and hashlib.sha256(p.read_bytes()).hexdigest()==f["sha256"]
          print("F6_ORIGINAL_V27_HASHES_VERIFIED")
          PY
      - name: Install Blender on Linux runner
        run: sudo apt-get update -qq && sudo apt-get install -y blender python3-numpy libegl1 libgl1 libopengl0 libgl1-mesa-dri
      - name: Real render original vs hemispherical normals and AO
        run: |
          set -euo pipefail
          export LIBGL_ALWAYS_SOFTWARE=1 EGL_PLATFORM=surfaceless
          blender -b -t 2 /tmp/f6-normals-source/nature/tree_mature_photo_v27/tree_mature_photo_v20.blend \
            --python tools/floor6/foliage_normals_trial.py 2>&1 | tee /tmp/f6-foliage-normals.log
          grep -q F6_NORMALS_TRIAL_DONE /tmp/f6-foliage-normals.log
      - name: Validate all outputs and source evidence
        run: |
          python3 - <<'PY'
          import hashlib,json,struct
          from pathlib import Path
          d=Path("render-output/floor6/foliage_normals_trial")
          m=json.loads((d/"manifest.json").read_text())
          assert m["state"]=="NOT_APPROVED"
          assert m["selected_source_leaves"]>=70 and m["changed_corner_normals"]>1000
          assert .70 <= m["ao_range"][0] < m["ao_range"][1] <= 1.01
          names={x["name"] for x in m["files"]}
          assert {"front.png","angle.png","underside.png","foliage_normal_test_NOT_APPROVED.glb","foliage_normal_test_NOT_APPROVED.blend"}==names
          for x in m["files"]:
              data=(d/x["name"]).read_bytes()
              assert len(data)==x["bytes"] and hashlib.sha256(data).hexdigest()==x["sha256"]
              if x["name"].endswith(".png"):
                  assert data[:8]==bytes([137,80,78,71,13,10,26,10])
                  w,h=struct.unpack(">II",data[16:24]);assert w>=1200 and h>=600
              if x["name"].endswith(".glb"):assert data[:4]==b"glTF"
          print("F6_NORMALS_TRIAL_QA_PASS", m["selected_source_leaves"], m["changed_corner_normals"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f6-foliage-normals-ABC-NOT-APPROVED
          path: render-output/floor6/foliage_normals_trial/
          retention-days: 14
          if-no-files-found: warn
