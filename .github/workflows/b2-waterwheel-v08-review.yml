name: B2 Waterwheel V08 Additive Blender Review
on:
  push:
    branches: [feature/gpt-b2-waterwheel-v07-resume-20261118]
    paths:
      - "tools/b2-waterwheel-paddle/build_paddle_v08_resume.py"
      - ".github/workflows/b2-waterwheel-v08-review.yml"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  render-v08:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Record this run for deterministic artifact lookup
        env:
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          mkdir -p docs/3d/b2-waterwheel-paddle-run
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          Path("docs/3d/b2-waterwheel-paddle-run/latest-v08.json").write_text(json.dumps({
            "run_id":int(os.environ["RUN_ID"]),
            "source_sha":os.environ["SHA"],
            "status":"STARTED_NOT_APPROVED"
          },indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/3d/b2-waterwheel-paddle-run/latest-v08.json
          git commit -m "chore(b2): checkpoint V08 run reference" || true
          git push origin HEAD:feature/gpt-b2-waterwheel-v07-resume-20261118
      - name: Restore verified V07 editable checkpoint
        uses: actions/download-artifact@v4
        with:
          name: b2-waterwheel-v07-blender-resume
          run-id: 44132575418
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: checkpoint
      - name: Check immutable source checkpoint
        run: |
          echo "04129277159a3f69090a80ab420b68c8255400bcf434528056e8451b77ceff91  checkpoint/b2_bucket_paddle_blender_v07.blend" | sha256sum -c
          mkdir -p render-output/b2-waterwheel-v08
      - name: Render V08 from V07 in Blender 5.3
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace lscr.io/linuxserver/blender:latest /blender/blender -b -t 2 --python tools/b2-waterwheel-paddle/build_paddle_v08_resume.py -- checkpoint/b2_bucket_paddle_blender_v07.blend render-output/b2-waterwheel-v08
      - name: Check model, 4 PNG views, editable blend, hashes, and GLB materials
        run: |
          python3 - <<'PY'
          import json,hashlib,struct
          from pathlib import Path
          out=Path('render-output/b2-waterwheel-v08')
          m=json.loads((out/'b2_bucket_paddle_blender_v08_manifest.json').read_text())
          assert m['approval']=='NOT_APPROVED' and m['added_meshes']>0
          assert len(m['files'])==6 and m['old_meshes_preserved']>=30
          for name,d in m['files'].items():
            p=out/name;raw=p.read_bytes()
            assert len(raw)==d['bytes'] and hashlib.sha256(raw).hexdigest()==d['sha256']
            if name.endswith('.glb'):
              assert raw[:4]==b'glTF'
              n=struct.unpack_from('<I',raw,12)[0]
              assert n>200
              j=json.loads(raw[20:20+n])
              assert len(j.get('images',[]))>=3
            if name.endswith('.png'):assert raw[:8]==bytes.fromhex('89504e470d0a1a0a')
            if name.endswith('.blend'):assert len(raw)>1024
          print('V08_GLTF_AND_FOUR_VIEW_VERIFIED',m['blender'],m['added_meshes'])
          PY
      - name: Archive V08 review output, even after partial failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b2-waterwheel-v08-additive-review
          path: render-output/b2-waterwheel-v08/
          retention-days: 14
          if-no-files-found: warn
