name: Recent enemy illustration lossless optimization
on:
  push:
    branches: [feature/recent-enemy-lossless-20261126]
    paths:
      - tools/optimize-recent-enemy-images.py
      - .github/workflows/recent-enemy-lossless.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: recent-enemy-lossless-${{ github.ref }}
  cancel-in-progress: false
jobs:
  optimize:
    if: github.ref == 'refs/heads/feature/recent-enemy-lossless-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Generate and verify lossless delivery variants
        run: python tools/optimize-recent-enemy-images.py
      - name: Verify originals and expected runtime paths
        run: |
          git diff --exit-code -- 'assets/monsters/*.png'
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('assets/monsters/recent-enemy-lossless-report.json').read_text())
          assert len(d['images'])==10
          assert d['total_display_bytes']<d['total_png_bytes']
          for row in d['images']:
              p=Path(row['path'])
              if row['selected']:
                  assert row['rgba_exact'] and row['icc_exact']
                  assert p.with_suffix('.webp').is_file()
                  assert row['webp_bytes']<row['png_bytes']
          print('Verified selected images:',sum(r['selected'] for r in d['images']))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - name: Actual game browser image and assignment test
        run: |
          python3 -m http.server 8000 >/tmp/kotama-http.log 2>&1 &
          node tools/test-image-lifetime-browser.mjs
      - name: Commit verified output only
        run: |
          git diff --exit-code -- 'assets/monsters/*.png'
          git add -u
          git add assets/monsters/recent-enemy-lossless-report.json
          find assets/monsters -maxdepth 1 -name '*.webp' -print0 | xargs -0 -r git add --
          if git diff --cached --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Save verified lossless enemy image variants and game mappings"
          git push origin HEAD:refs/heads/feature/recent-enemy-lossless-20261126
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recent-enemy-lossless-proof
          path: |
            assets/monsters/recent-enemy-lossless-report.json
            browser-image-lifetime-report.json
          retention-days: 14
