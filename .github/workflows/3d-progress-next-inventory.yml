name: Inventory next model families
on:
  push:
    branches: [feature/3d-progress-gallery-20261124]
    paths: ['.github/workflows/3d-progress-next-inventory.yml']
permissions:
  actions: read
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Inventory selected existing render archives
        run: |
          mkdir -p inventory
          python3 - <<'PY'
          import json, os, urllib.request, zipfile, io
          from pathlib import Path
          repo=os.environ["GITHUB_REPOSITORY"]
          token=os.environ["GH_TOKEN"]
          rows=[]
          for aid in [14842115312,14839853183,14839094690,14838898562,14838058216,14837393465,14835339026,14834982983,14834501722,14763285656,14732061110]:
              url=f"https://api.github.com/repos/{repo}/actions/artifacts/{aid}/zip"
              # gh handles authenticated API redirects without forwarding credentials to storage.
              import subprocess
              archive=subprocess.check_output(["gh","api",url])
              if len(archive)>100_000_000: raise ValueError("archive too large")
              with zipfile.ZipFile(io.BytesIO(archive)) as z:
                  rows.append({"artifact_id":aid,"pngs":[{"path":i.filename,"bytes":i.file_size} for i in z.infolist() if i.filename.lower().endswith(".png") and not i.is_dir()]})
          Path("inventory/images.json").write_text(json.dumps(rows,indent=2))
          print(json.dumps(rows,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: next-model-family-inventory
          path: inventory/
          retention-days: 14
