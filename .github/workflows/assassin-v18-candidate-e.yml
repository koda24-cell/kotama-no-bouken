name: Assassin V18 Candidate E - Shibu Face posterior review
on:
  push:
    branches: [feature/gpt-assassin-v18-posterior-d-20261119]
    paths:
      - 'tools/character-mesh-research/build_v18_candidate_e.py'
      - '.github/workflows/assassin-v18-candidate-e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build_render:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender headless rendering
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y blender xvfb python3-numpy
      - name: Fetch original VRoid sample into ephemeral workspace
        run: |
          mkdir -p /tmp/v18src output/assassin-v18-e
          curl -fL --retry 3 --max-time 240 -o /tmp/v18src/Sendagaya_Shibu.vrm https://raw.githubusercontent.com/madjin/vrm-samples/master/vroid/beta/Sendagaya_Shibu.vrm
          test "$(stat -c%s /tmp/v18src/Sendagaya_Shibu.vrm)" -gt 1000000
          sha256sum /tmp/v18src/Sendagaya_Shibu.vrm > output/assassin-v18-e/source.sha256
      - name: Recompute canonical 36 point boundary
        run: |
          xvfb-run -a blender -b -t 2 --python tools/character-mesh-research/analyze_boundary_loops.py -- /tmp/v18src/Sendagaya_Shibu.vrm output/assassin-v18-e/source.boundary-loops.json
          xvfb-run -a blender -b -t 2 --python tools/character-mesh-research/measure_head_rim.py -- /tmp/v18src/Sendagaya_Shibu.vrm output/assassin-v18-e/source.boundary-loops.json output/assassin-v18-e/source.rim-geometry.json
      - name: Build and render V18 Candidate E
        run: |
          python3 -m py_compile tools/character-mesh-research/build_v18_candidate_e.py
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a blender -b -t 2 --python-exit-code 1 --python tools/character-mesh-research/build_v18_candidate_e.py -- /tmp/v18src/Sendagaya_Shibu.vrm output/assassin-v18-e/source.boundary-loops.json output/assassin-v18-e/candidate
      - name: Verify actual geometry and six images
        run: |
          python3 - <<'PY'
          import json,os
          p='output/assassin-v18-e/candidate'
          q=json.load(open(f'{p}/qa.json'))
          assert q['rim_vertex_count']==36
          assert q['added_quads']==432 and q['added_vertices']==432
          assert q['neck_opening_boundary_edges']==36
          assert q['all_36_seam_edges_welded'] and q['nonmanifold_edges_gt2']==0
          for f in ('front','back','left','right','three_quarter','back_upper','side_closeup'):
            assert os.path.getsize(f'{p}/{f}.png')>2000
          for f in ('assassin_v18_candidate_e.blend','assassin_v18_candidate_e_review.glb','manifest.json'):
            assert os.path.getsize(f'{p}/{f}')>100
          print(q)
          PY
      - name: Upload review-only checkpoint even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assassin-v18-candidate-e-NOT-APPROVED
          path: output/assassin-v18-e/
          retention-days: 14
