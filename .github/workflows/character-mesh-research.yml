name: Character mesh research - VRoid beta samples
on:
  push:
    branches: [feature/gpt-character-mesh-reference-study-20261116]
    paths:
      - 'tools/character-mesh-research/**'
      - '.github/workflows/character-mesh-research.yml'
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender xvfb python3-numpy
      - name: Download source VRMs for ephemeral analysis
        run: |
          mkdir -p /tmp/character-sources output/character-mesh-research
          for model in HairSample_Female HairSample_Male Sendagaya_Shibu Sendagaya_Shino Sakurada_Fumiriya Vita; do
            curl --fail --location --retry 3 --max-time 240 -o "/tmp/character-sources/$model.vrm" "https://raw.githubusercontent.com/madjin/vrm-samples/master/vroid/beta/$model.vrm"
            test "$(stat -c%s "/tmp/character-sources/$model.vrm")" -gt 1000000
            sha256sum "/tmp/character-sources/$model.vrm" >> output/character-mesh-research/sources.sha256
          done
      - name: Analyze mesh structure in Blender
        run: |
          for model in HairSample_Female HairSample_Male Sendagaya_Shibu Sendagaya_Shino Sakurada_Fumiriya Vita; do
            xvfb-run -a blender -b -t 2 --python tools/character-mesh-research/analyze_character.py -- "/tmp/character-sources/$model.vrm" "output/character-mesh-research/$model.json"
          done
      - name: Extract five-domain character quality measurements
        run: |
          for model in HairSample_Female HairSample_Male Sendagaya_Shibu Sendagaya_Shino Sakurada_Fumiriya Vita; do
            xvfb-run -a blender -b -t 2 --python tools/character-mesh-research/extract_character_quality.py -- "/tmp/character-sources/$model.vrm" "output/character-mesh-research/$model.quality.json"
          done
      - name: Summarize head geometry across samples
        run: python3 tools/character-mesh-research/summarize_heads.py output/character-mesh-research
      - name: Assess quality reports and produce review flags
        run: python3 tools/character-mesh-research/assess_character_quality.py output/character-mesh-research
      - name: Render head comparison six views per sample
        run: |
          for model in HairSample_Female HairSample_Male Sendagaya_Shibu Sendagaya_Shino Sakurada_Fumiriya Vita; do
            xvfb-run -a blender -b -t 2 --python tools/character-mesh-research/render_head.py -- "/tmp/character-sources/$model.vrm" "output/character-mesh-research/renders/$model"
          done
      - name: Render complete head context (face, eyes and hair) six views
        run: |
          for model in HairSample_Female HairSample_Male Sendagaya_Shibu Sendagaya_Shino Sakurada_Fumiriya Vita; do
            xvfb-run -a blender -b -t 2 --python tools/character-mesh-research/render_full_head.py -- "/tmp/character-sources/$model.vrm" "output/character-mesh-research/full-head/$model"
          done
      - name: Render face boundary overlay diagnostics for two samples
        run: |
          for model in Sendagaya_Shibu Vita; do
            set +e
            xvfb-run -a blender -b -t 2 --python tools/character-mesh-research/render_boundary_review.py -- "/tmp/character-sources/$model.vrm" "output/character-mesh-research/boundaries/$model"
            code=$?
            set -e
            if [ "$code" -ne 0 ]; then
              echo "::warning::Blender exit $code for $model; verifying all four actual PNGs and manifest before accepting output"
              for view in front back side back_upper; do test -s "output/character-mesh-research/boundaries/$model/$view.png" || exit "$code"; done
              test -s "output/character-mesh-research/boundaries/$model/boundary_manifest.json" || exit "$code"
            fi
          done
      - name: Validate results
        run: |
          for model in HairSample_Female HairSample_Male Sendagaya_Shibu Sendagaya_Shino Sakurada_Fumiriya Vita; do
            test -s "output/character-mesh-research/$model.quality.json"
            test -s "output/character-mesh-research/$model.json"
          done
          for model in HairSample_Female HairSample_Male Sendagaya_Shibu Sendagaya_Shino Sakurada_Fumiriya Vita; do
            for view in front back left right three_quarter back_upper; do
              test -s "output/character-mesh-research/renders/$model/$view.png"
              test -s "output/character-mesh-research/full-head/$model/$view.png"
            done
          done
          for model in Sendagaya_Shibu Vita; do
            for view in front back side back_upper; do test -s "output/character-mesh-research/boundaries/$model/$view.png"; done
          done
          python3 - <<'PY'
          import json
          for name in ('HairSample_Female','HairSample_Male','Sendagaya_Shibu','Sendagaya_Shino','Sakurada_Fumiriya','Vita'):
              p=f'output/character-mesh-research/{name}.json'
              d=json.load(open(p))
              assert len(d['meshes'])>0, p
              print(name, len(d['meshes']), 'meshes')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vroid-mesh-analysis-and-six-view-renders
          path: output/character-mesh-research/
          retention-days: 14
