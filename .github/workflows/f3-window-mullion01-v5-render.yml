name: Floor3 Window Mullion01 V5 Textured Review
on:
  push:
    branches: [feature/gpt-f3-window-mullion01-20261119]
    paths: ['tools/floor3/window_mullion01/build_v5.py', '.github/workflows/f3-window-mullion01-v5-render.yml']
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Check V5 script
        run: python3 -m py_compile tools/floor3/window_mullion01/build_v5.py
      - name: Blender V5 actual images and Blend checkpoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/f3_window_mullion01
          printf '{"asset":"F3_WINDOW_MULLION01","version":5,"approval":"NOT_APPROVED","phase":"STARTED","run_id":"%s","source_sha":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > out/f3_window_mullion01/progress_v5.json
          docker pull lscr.io/linuxserver/blender:latest
          docker run --rm --user "$(id -u):$(id -g)" --entrypoint /usr/bin/blender \
            -v "$PWD:/work" -w /work lscr.io/linuxserver/blender:latest -b -t 2 --python /work/tools/floor3/window_mullion01/build_v5.py 2>&1 | tee out/f3_window_mullion01/blender_v5.log
          grep -q F3_MULLION_V5_ALL_COMPLETE out/f3_window_mullion01/blender_v5.log
      - name: Verify generated V5 files SHA, dimensions, GLB format and checkpoint
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,json,hashlib,struct,os
          p=pathlib.Path('out/f3_window_mullion01')
          base='f3_window_mullion01_v5'
          names=['F3_WINDOW_ENAMEL_RUST_V5.png','F3_WINDOW_ROUGHNESS_V5.png',base+'.glb',base+'.blend']+[base+'-'+v+'.png' for v in ('front','side','angle','detail')]
          files={}
          for name in names:
              b=(p/name).read_bytes()
              assert len(b)>300,name
              if name.endswith('.png'):
                  assert b[:8]==bytes.fromhex('89504e470d0a1a0a'),name
                  w,h=struct.unpack('>II',b[16:24])
                  assert w>128 and h>128,name
              if name.endswith('.glb'):
                  assert b[:4]==b'glTF' and struct.unpack_from('<I',b,8)[0]==len(b),name
                  # single mesh is only finalized if parsed GLB geometry confirms it
              if name.endswith('.blend'):
                  assert b.startswith(b'BLENDER') or b.startswith(bytes.fromhex('28b52ffd')),name
              files[name]={'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()}
          (p/'manifest_v5.json').write_text(json.dumps({'asset':'F3_WINDOW_MULLION01','version':5,'approval':'NOT_APPROVED','source_sha':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'files':files},indent=2))
          print('F3_MULLION_V5_QA_OK',len(files))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f3-window-mullion01-v5-textured
          path: out/f3_window_mullion01/
          retention-days: 14
