name: B5 Standing Gothic Pillar Blender Preview
on:
  workflow_dispatch:
  push:
    branches: [feature/b5-gate-surrounding-pillars-rubble-20261113]
    paths:
      - 'field/assets/b5-gate-companion-assets.js'
      - 'tools/b5-render/export-standing-pillar.mjs'
      - '.github/workflows/b5-standing-pillar-preview.yml'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts --no-package-lock three@0.160.1
      - name: Export standing Gothic pillar GLB
        run: node tools/b5-render/export-standing-pillar.mjs
      - name: Render front, back and high angle in Blender Docker
        run: |
          docker run --rm -v "$PWD:/work" -w /work --entrypoint /bin/bash lscr.io/linuxserver/blender:latest -lc '
            set -e
            blender -b -t 2 --python tools/b5-render/render-gothic-arch.py -- render-output/b5-standing-gothic-pillar.glb render-output
          '
      - uses: actions/upload-artifact@v4
        with:
          name: b5-standing-gothic-pillar-glb-png
          path: render-output/
          retention-days: 14
