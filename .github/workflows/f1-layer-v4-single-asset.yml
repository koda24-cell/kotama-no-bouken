name: F1 V4 Single Passage Arch
on:
  push:
    branches: [feature/f1-layer-progression-v4-20261123]
    paths:
      - tools/f1-layer-v4/build_passage_arch.py
      - tools/f1-layer-v4/render_asset.py
      - .github/workflows/f1-layer-v4-single-asset.yml
permissions:
  contents: read
  packages: read
concurrency:
  group: f1-v4-one-asset
  cancel-in-progress: false
jobs:
  one-asset:
    uses: ./.github/workflows/shared-blender53-render.yml
    with:
      script: tools/f1-layer-v4/build_passage_arch.py
      output_dir: render-output/f1-v4-passage-arch
  archive-candidate:
    needs: one-asset
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/f1-layer-progression-v4-20261123
      - uses: actions/download-artifact@v4
        with:
          name: shared-blender53-NOT-APPROVED-${{ github.run_id }}
          path: downloaded-verified-output
      - name: Archive previously scanned original outputs as NOT_APPROVED
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,shutil
          base=Path('downloaded-verified-output')
          matches=list(base.rglob('SHARED_BLENDER53_QA_NOT_APPROVED.json'));assert len(matches)==1
          folder=matches[0].parent;receipt=json.loads(matches[0].read_text())
          assert receipt['status']=='NOT_APPROVED'
          for name,r in receipt['files'].items():
            p=(folder/name).resolve();assert p.is_relative_to(folder.resolve())
            assert hashlib.sha256(p.read_bytes()).hexdigest()==r['sha256'],name
          dst=Path('assets/3d/dungeons/b1_layer_v4_candidates')
          for name in ['modules','sources','renders','metrics']:
            shutil.copytree(folder/name,dst/name,dirs_exist_ok=True)
          for name in ['manifest.json','structural-audit.json','SHARED_BLENDER53_QA_NOT_APPROVED.json']:
            shutil.copyfile(folder/name,dst/name)
          shutil.copytree(folder/'security',dst/'security',dirs_exist_ok=True)
          PY
          git config user.name 'F1 asset archive'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/3d/dungeons/b1_layer_v4_candidates
          git commit -m 'art(f1): archive individually rendered two-sided arch candidate'
          git push origin HEAD:feature/f1-layer-progression-v4-20261123
