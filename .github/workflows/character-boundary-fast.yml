name: Character boundary fast diagnostics
on:
  workflow_dispatch:
  push:
    branches: [feature/gpt-character-mesh-reference-study-20261116]
    paths:
      - 'tools/character-mesh-research/analyze_boundary_loops.py'
      - 'tools/character-mesh-research/summarize_boundary_loops.py'
      - 'tools/character-mesh-research/rank_posterior_seams.py'
      - '.github/workflows/character-boundary-fast.yml'
      - 'tools/character-mesh-research/render_boundary_components.py'
      - 'tools/character-mesh-research/audit_posterior_rim.py'
      - 'tools/character-mesh-research/build_posterior_v16.py'
      - 'tools/character-mesh-research/build_posterior_v17.py'
jobs:
  boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender xvfb python3-numpy
      - name: Download two reference VRMs
        run: |
          mkdir -p /tmp/character-sources output/character-mesh-research
          for model in Sendagaya_Shibu Vita; do
            curl -fL --retry 3 --max-time 240 -o "/tmp/character-sources/$model.vrm" "https://raw.githubusercontent.com/madjin/vrm-samples/master/vroid/beta/$model.vrm"
            test "$(stat -c%s "/tmp/character-sources/$model.vrm")" -gt 1000000
          done
      - name: Extract actual boundary topology
        run: |
          for model in Sendagaya_Shibu Vita; do
            xvfb-run -a blender -b -t 2 --python tools/character-mesh-research/analyze_boundary_loops.py -- "/tmp/character-sources/$model.vrm" "output/character-mesh-research/$model.boundary-loops.json"
          done
      - name: Summarize and shortlist
        run: |
          python3 tools/character-mesh-research/summarize_boundary_loops.py output/character-mesh-research
          python3 tools/character-mesh-research/rank_posterior_seams.py output/character-mesh-research
          test -s output/character-mesh-research/posterior_seam_review.md
          python3 tools/character-mesh-research/audit_posterior_rim.py output/character-mesh-research
          test -s output/character-mesh-research/posterior_rim_geometric_audit.csv
      - name: Render six-color boundary component overlays
        run: |
          for model in Sendagaya_Shibu Vita; do
            xvfb-run -a blender -b -t 2 --python tools/character-mesh-research/render_boundary_components.py -- "/tmp/character-sources/$model.vrm" "output/character-mesh-research/$model.boundary-loops.json" "output/character-mesh-research/component-overlays/$model"
            for view in front back side back_upper; do test -s "output/character-mesh-research/component-overlays/$model/$view.png"; done
            test -s "output/character-mesh-research/component-overlays/$model/component_overlay_manifest.json"
          done
      - name: Build and render V16 review candidate
        run: |
          xvfb-run -a blender -b -t 2 --python tools/character-mesh-research/build_posterior_v16.py -- /tmp/character-sources/Sendagaya_Shibu.vrm /tmp/character-sources/Vita.vrm output/character-mesh-research/Sendagaya_Shibu.boundary-loops.json output/character-mesh-research/v16-review
          test -s output/character-mesh-research/v16-review/assassin_head_posterior_v16_review.glb
          test -s output/character-mesh-research/v16-review/geometry_measurements.json
          for view in front back left right back_upper three_quarter; do test -s "output/character-mesh-research/v16-review/$view.png"; done
      - name: Build and render V17 candidate with mesh QA
        run: |
          xvfb-run -a blender -b -t 2 --python tools/character-mesh-research/build_posterior_v17.py -- /tmp/character-sources/Sendagaya_Shibu.vrm /tmp/character-sources/Vita.vrm output/character-mesh-research/Sendagaya_Shibu.boundary-loops.json output/character-mesh-research/v17-review
          test -s output/character-mesh-research/v17-review/assassin_head_posterior_v17_review.glb
          python3 - <<'PY'
          import json
          p='output/character-mesh-research/v17-review/geometry_measurements.json'
          d=json.load(open(p));assert d['rim_vertices']==36
          assert d['shell_boundary_edges']==36
          assert d['min_face_area_m2']>1e-10
          print('V17 geometry checks passed:',d)
          PY
          for view in front back left right back_upper three_quarter; do test -s "output/character-mesh-research/v17-review/$view.png"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: character-boundary-fast-diagnostics
          path: output/character-mesh-research/
          retention-days: 14
