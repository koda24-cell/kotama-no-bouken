name: F3 V3 serial asset production
on:
  push:
    branches: [feature/f3-city-v3-20261127]
    paths: [tools/f3-city-v3/queue.json]
concurrency:
  group: f3-industrial-production
  cancel-in-progress: false
permissions:
  contents: write
  packages: read
jobs:
  signature-seed:
    runs-on: ubuntu-24.04
    steps:
      - name: Retrieve signed definitions from pinned official preloaded image
        run: |
          set -euo pipefail
          image='clamav/clamav@sha256:9b2f34be1f8be02f58edb1c8868dca99d6e04f8f8daf191f8448c762f563dde3'
          docker pull "$image"
          container=$(docker create "$image")
          trap 'docker rm -f "$container" >/dev/null' EXIT
          mkdir -p definitions
          docker cp "$container:/var/lib/clamav/." definitions/
          find definitions -maxdepth 1 -type f -printf "%f\n"
          test -s definitions/daily.cvd
          test -s definitions/daily-28191.cvd.sign
          cd definitions
          sha256sum *.cvd *.cvd.sign > SHA256SUMS
          printf '%s\n' "$image" > official-image.txt
      - uses: actions/upload-artifact@v4
        with:
          name: f3-official-clamav-seed-${{ github.run_id }}
          path: definitions/
          retention-days: 3
  queue:
    runs-on: ubuntu-24.04
    outputs:
      assets: ${{ steps.list.outputs.assets }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: /tools/f3-city-v3/queue.json
          sparse-checkout-cone-mode: false
      - id: list
        run: |
          python3 - <<'PYQUEUE'
          import json,os
          with open(os.environ['GITHUB_OUTPUT'],'a')as out:
              out.write('assets='+json.dumps(json.load(open('tools/f3-city-v3/queue.json')))+'\n')
          PYQUEUE
  individual:
    needs: [queue, signature-seed]
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        asset: ${{ fromJSON(needs.queue.outputs.assets) }}
    uses: ./.github/workflows/f3-city-v3-one.yml
    with:
      asset: ${{ matrix.asset }}
