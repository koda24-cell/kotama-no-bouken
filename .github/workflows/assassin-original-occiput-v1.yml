name: Assassin original posterior cranium V1 review
on:
  push:
    branches: [feature/gpt-assassin-original-occiput-v1-20261119]
    paths:
      - 'tools/character-mesh-research/build_original_occiput_v1.py'
      - '.github/workflows/assassin-original-occiput-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build_render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y blender xvfb python3-numpy
      - name: Build original geometry and render seven angles
        run: |
          mkdir -p output/original-occiput-v1
          python3 -m py_compile tools/character-mesh-research/build_original_occiput_v1.py
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a blender -b -t 2 --python-exit-code 1 --python tools/character-mesh-research/build_original_occiput_v1.py -- output/original-occiput-v1
      - name: Verify original mesh review evidence
        run: |
          python3 - <<'PY'
          import json,os
          p='output/original-occiput-v1'
          q=json.load(open(p+'/qa.json'))
          assert not q['source_VRM_imported'] and q['source_mesh_vertices_copied']==0
          assert q['quads']==896 and q['vertices']==957
          assert q['open_boundary_edges']==120 and q['nonmanifold_edges_gt2']==0
          for n in ['right','left','back','back_three_quarter','back_upper','front','side_closeup']:
            assert os.path.getsize(f'{p}/{n}.png')>2000
          for f in ['assassin_original_occiput_v1_review.glb','assassin_original_occiput_v1.blend','manifest.json']:
            assert os.path.getsize(f'{p}/{f}')>100
          PY
      - name: Upload candidate (review only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assassin-original-occiput-v1-NOT-APPROVED
          path: output/original-occiput-v1
          retention-days: 14
