name: Advanced production policy and checkpoint tests
on:
  pull_request:
    branches: [development]
    paths:
      - 'tools/3d_checkpoint/advanced_*.py'
      - 'tools/3d_checkpoint/test_advanced_policy.py'
      - '.github/workflows/advanced-production-policy-tests.yml'
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m py_compile tools/3d_checkpoint/advanced_*.py
      - run: python3 tools/3d_checkpoint/test_advanced_policy.py
