name: Floor 3 Industrial Crane Docker Render
on:
  workflow_dispatch:
  push:
    branches:
      - feature/floor3-industrial-truss-crane-20261112
    paths:
      - 'tools/floor3/crane/**'
      - '.github/workflows/floor3-crane-docker-render.yml'
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install 'numpy>=1.26,<3' 'trimesh>=4,<5'
      - name: Build GLB
        run: |
          mkdir -p render-output
          python tools/floor3/crane/build.py
          mv industrial_truss_crane.glb render-output/
          python tools/floor3/crane/taper_build.py
          mv industrial_truss_crane_tapered.glb render-output/
      - name: Verify GLB
        run: |
          python - <<'PY'
          import trimesh
          scene=trimesh.load('render-output/industrial_truss_crane.glb',force='scene')
          assert len(scene.geometry)>150, len(scene.geometry)
          print('GEOMETRIES',len(scene.geometry))
          tapered=trimesh.load('render-output/industrial_truss_crane_tapered.glb',force='scene')
          assert len(tapered.geometry)>150, len(tapered.geometry)
          PY
      - name: Pull Blender Docker
        run: |
          for attempt in 1 2 3 4 5; do
            if docker pull lscr.io/linuxserver/blender:latest; then exit 0; fi
            echo "Blender registry throttled or unavailable; retry $attempt/5"
            sleep $((attempt * 20))
          done
          echo 'Docker image pull failed after five attempts' >&2
          exit 1
      - name: Render two views
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --entrypoint /usr/bin/blender \
            -v "$PWD:/work" -w /work lscr.io/linuxserver/blender:latest \
            -b -t 2 --python tools/floor3/crane/render.py -- render-output/industrial_truss_crane.glb render-output
          docker run --rm --user "$(id -u):$(id -g)" --entrypoint /usr/bin/blender \
            -v "$PWD:/work" -w /work lscr.io/linuxserver/blender:latest \
            -b -t 2 --python tools/floor3/crane/render.py -- render-output/industrial_truss_crane_tapered.glb render-output
          for stem in industrial_truss_crane industrial_truss_crane_tapered; do
            for view in front angle; do test -s "render-output/${stem}-${view}.png"; done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: floor3-industrial-crane-blender
          path: render-output/
          retention-days: 14
