name: B2 Single Timber Support Post V01 Blender 5.3
on:
  push:
    branches: [feature/gpt-b2-waterwheel-single-timber-support-post-v01-20261120]
    paths:
      - 'tools/b2-waterwheel-support-post/**'
      - '.github/workflows/b2-waterwheel-single-support-post-v01.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Scan source with ClamAV before running Blender
        run: |
          set -euo pipefail
          mkdir -p security/clamdb && chmod 777 security/clamdb
          docker run --rm -v "$PWD:/workspace" -w /workspace --entrypoint sh ghcr.io/koda24-cell/kotama-blender53-clamav@sha256:5ce601f79b1ab09405b3ebc36b1a596be76cb8b105b1524fcbafcb186ebf7e99 -c 'set -e; freshclam --stdout --datadir=/workspace/security/clamdb; clamscan --database=/workspace/security/clamdb -r --infected tools/b2-waterwheel-support-post'
      - name: Real Blender Cycles four-view PNG, GLB and Blend
        run: |
          set -euo pipefail
          mkdir -p render-output/b2-timber-post-v01
          docker run --rm -v "$PWD:/workspace" -w /workspace ghcr.io/koda24-cell/kotama-blender53-clamav@sha256:5ce601f79b1ab09405b3ebc36b1a596be76cb8b105b1524fcbafcb186ebf7e99 blender -b -t 2 --python-exit-code 1 --python tools/b2-waterwheel-support-post/build_v01.py -- render-output/b2-timber-post-v01 | tee /tmp/post.log
          grep -q B2_TIMBER_SUPPORT_POST_V01_RENDER_SUCCESS /tmp/post.log
      - name: Validate generated outputs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,struct
          p=Path('render-output/b2-timber-post-v01')
          m=json.loads((p/'manifest.json').read_text())
          assert m['approval']=='NOT_APPROVED' and m['pbr_embedded_images']>=2
          assert len(m['files'])==8, len(m['files'])
          assert len(list(p.glob('b2_single_support_post_v01_*.png')))==4
          for name,entry in m['files'].items():
              d=(p/name).read_bytes()
              assert len(d)==entry['bytes'] and hashlib.sha256(d).hexdigest()==entry['sha256']
              if name.endswith('.png'):assert d[:8]==bytes.fromhex('89504e470d0a1a0a')
              if name.endswith('.glb'):assert d[:4]==b'glTF' and len(d)==struct.unpack_from('<I',d,8)[0]
          print('B2_POST_MANIFEST_SHA_VERIFIED')
          PY
      - name: Shared GLB structural audit
        run: python3 tools/3d-performance/audit_glb.py 'render-output/b2-timber-post-v01/*.glb' --output render-output/b2-timber-post-v01/performance_audit.json
      - name: ClamAV output scan
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace --entrypoint sh ghcr.io/koda24-cell/kotama-blender53-clamav@sha256:5ce601f79b1ab09405b3ebc36b1a596be76cb8b105b1524fcbafcb186ebf7e99 -c 'clamscan --database=/workspace/security/clamdb -r --infected render-output/b2-timber-post-v01'
      - name: Upload review-only candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b2-waterwheel-single-timber-support-post-v01-review
          path: render-output/b2-timber-post-v01/
          retention-days: 14
          if-no-files-found: warn
