name: F3 industrial serial asset production
on:
  push:
    branches: [feature/f3-industrial-ruins-20261124]
    paths: [tools/f3-industrial/queue.json, tools/f3-industrial/build_one.py, tools/f3-industrial/parts.py, .github/workflows/f3-industrial-serial.yml, .github/workflows/f3-industrial-one.yml]
concurrency:
  group: f3-industrial-production
  cancel-in-progress: false
permissions:
  contents: write
  packages: read
jobs:
  queue:
    runs-on: ubuntu-24.04
    outputs:
      assets: ${{ steps.list.outputs.assets }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          python3 - <<'PYQUEUE'
          import json,os
          with open(os.environ['GITHUB_OUTPUT'],'a')as out:
              out.write('assets='+json.dumps(json.load(open('tools/f3-industrial/queue.json')))+'\n')
          PYQUEUE
  individual:
    needs: queue
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        asset: ${{ fromJSON(needs.queue.outputs.assets) }}
    uses: ./.github/workflows/f3-industrial-one.yml
    with:
      asset: ${{ matrix.asset }}
