name: Cloudflare probe update / rollback check
# Verifies that (a) a new dummy deployment becomes the fixed-URL deployment and
# (b) a rollback restores the previous one, with the Access gate passing before
# and after each change. Dummy probe files only.
on:
  push:
    branches: [feature/gpt-cloudflare-private-preview-preflight-20261127]
    paths: ['tools/cloudflare-preview/update-check.json']

permissions:
  contents: read
concurrency:
  group: cloudflare-probe-deploy
  cancel-in-progress: false
jobs:
  gate-before:
    if: github.repository == 'koda24-cell/kotama-no-bouken'
    uses: ./.github/workflows/cloudflare-access-gate.yml
    secrets: inherit

  change:
    needs: gate-before
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: tools/cloudflare-preview
      - name: Read requested action
        id: req
        run: |
          set -euo pipefail
          action="$(jq -er '.action' tools/cloudflare-preview/update-check.json)"
          rev="$(jq -er '.revision|tostring' tools/cloudflare-preview/update-check.json)"
          [[ "$action" == update || "$action" == rollback ]]
          [[ "$rev" =~ ^[0-9]{1,6}$ ]]
          echo "action=$action" >> "$GITHUB_OUTPUT"; echo "rev=$rev" >> "$GITHUB_OUTPUT"
      - name: Build stamped dummy probe
        if: steps.req.outputs.action == 'update'
        run: |
          set -euo pipefail
          root=tools/cloudflare-preview/probe
          site="$RUNNER_TEMP/site"; mkdir -p "$site"
          cp "$root"/{index.html,probe.css,probe.js,probe.svg} "$site/"
          stamp="Update check revision ${{ steps.req.outputs.rev }} / run ${GITHUB_RUN_ID}"
          python3 - "$site/index.html" "$stamp" <<'PY'
          import sys, html
          p, stamp = sys.argv[1], sys.argv[2]
          s = open(p).read()
          assert "</body>" in s
          s = s.replace("</body>", '<p id="update-stamp">' + html.escape(stamp) + "</p></body>", 1)
          open(p, "w").write(s)
          PY
          cd "$RUNNER_TEMP" && npm install --no-audit --no-fund --save-exact wrangler@4.168.0 >/dev/null
          echo "$stamp" >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy update or roll back, then verify the fixed URL target
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_SEND_METRICS: 'false'
          ACTION: ${{ steps.req.outputs.action }}
        run: |
          set -euo pipefail
          project=kotama-private-probe-20261127
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$project"
          r="$(mktemp)"; trap 'rm -f "$r"' EXIT
          req() { curl --silent --show-error --proto '=https' --max-time 30 --output "$r" --write-out '%{http_code}' --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$@"; }
          canonical() { [[ "$(req "$api")" == 200 ]] && jq -er '.result.canonical_deployment.id' "$r"; }
          before="$(canonical)"
          if [[ "$ACTION" == update ]]; then
            branch="$(req "$api" >/dev/null; jq -er '.result.production_branch' "$r")"
            "$RUNNER_TEMP/node_modules/.bin/wrangler" pages deploy "$RUNNER_TEMP/site" --project-name="$project" --branch="$branch" --commit-hash="$GITHUB_SHA" --commit-dirty=true
            sleep 10
            after="$(canonical)"
            [[ "$after" != "$before" ]] || { echo "::error::Fixed URL still points at the old deployment"; exit 1; }
          else
            [[ "$(req "$api/deployments?env=production&per_page=10")" == 200 ]]
            target="$(jq -er --arg c "$before" '[.result[] | select(.id != $c and .latest_stage.status == "success")][0].id' "$r")"
            code="$(req --request POST "$api/deployments/$target/rollback")"
            [[ "$code" == 200 ]] && jq -e '.success == true' "$r" >/dev/null || { echo "::error::Rollback failed HTTP $code"; exit 1; }
            sleep 10
            after="$(canonical)"
            [[ "$after" == "$target" ]] || { echo "::error::Fixed URL did not move to the rollback target"; exit 1; }
          fi
          echo "Fixed URL deployment: ${before:0:8} -> ${after:0:8} ($ACTION)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Content shown at the fixed URL must still be checked signed-in on a phone/PC." >> "$GITHUB_STEP_SUMMARY"

  gate-after:
    needs: change
    uses: ./.github/workflows/cloudflare-access-gate.yml
    secrets: inherit
