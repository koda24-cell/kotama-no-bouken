name: ClamAV external asset safety scan

on:
  workflow_dispatch:
  pull_request:
    branches: [development]
    paths:
      - 'assets/**'
      - 'tools/**'
      - 'vendor/**'
      - 'downloads/**'
      - '**/*.blend'
      - '**/*.blend1'
      - '**/*.glb'
      - '**/*.gltf'
      - '**/*.fbx'
      - '**/*.obj'
      - '**/*.zip'
      - '**/*.py'
      - '.github/workflows/asset-clamav-scan.yml'

permissions:
  contents: read

jobs:
  scan:
    name: Scan repository assets with ClamAV
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: true
      - name: Run isolated download safety unit tests
        run: python3 -m unittest discover -s tools/security -p 'test_*.py' -v
      - name: Install ClamAV
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav clamav-freshclam
      - name: Update virus signatures (fail closed)
        run: |
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam
          clamscan --version
      - name: Scan all tracked repository files (fail on infection or scan error)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/clamav"
          git ls-files -z | python3 -c 'import sys,os; paths=[os.fsdecode(p) for p in sys.stdin.buffer.read().split(b"\0") if p]; [print(p) for p in paths if os.path.isfile(p)]' > "$RUNNER_TEMP/clamav/tracked.txt"
          if [[ ! -s "$RUNNER_TEMP/clamav/tracked.txt" ]]; then
            echo "No tracked files found"; exit 1
          fi
          # Split into batches to avoid OS command-line length limits.
          split -l 100 "$RUNNER_TEMP/clamav/tracked.txt" "$RUNNER_TEMP/clamav/batch-"
          for batch in "$RUNNER_TEMP"/clamav/batch-*; do
            mapfile -t files < "$batch"
            clamscan --infected --no-summary --alert-exceeds-max=yes \
              --max-filesize=100M --max-scansize=500M \
              -- "${files[@]}"
          done
          echo "All scanned tracked files passed ClamAV."
