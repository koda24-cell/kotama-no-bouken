name: Shared party HUD checks
on:
  pull_request:
    paths:
      - 'formation-gallery.js'
      - 'field/field-render.js'
      - 'css/15-formation-gallery.css'
      - 'script.js'
      - 'index.html'
      - '.github/workflows/shared-party-hud-check.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and formation layout checks
        run: |
          node --check formation-gallery.js
          node --check field/field-render.js
          node --check script.js
          node <<'NODE'
          const fs=require('node:fs'), vm=require('node:vm'), assert=require('node:assert/strict');
          const source=fs.readFileSync('formation-gallery.js','utf8');
          const rows={a:{row:'front',slot:0},b:{row:'front',slot:1},c:{row:'front',slot:2},d:{row:'rear',slot:0},e:{row:'rear',slot:2}};
          const context=vm.createContext({window:{kotamaBattleExportRows:()=>rows}});
          vm.runInContext(source.slice(0,source.indexOf('(() => {')),context);
          const party=['a','b','c','d','e'].map(id=>({id}));
          const result=context.window.kotamaPartyHudLayout(party);
          assert.equal(JSON.stringify(result.map(x=>[x.c.id,x.gridRow,x.column])),JSON.stringify([['a',1,1],['b',1,3],['c',1,5],['d',2,2],['e',2,4]]));
          rows.b={row:'rear',slot:1};
          const changed=context.window.kotamaPartyHudLayout(party);
          assert.equal(JSON.stringify(changed.map(x=>[x.c.id,x.gridRow,x.column])),JSON.stringify([['a',1,2],['c',1,4],['b',2,3],['d',2,1],['e',2,5]]));
          assert.equal(context.window.kotamaPartyHudLayout([]).length,0);
          console.log('Shared HUD front/rear layout checks passed.');
          NODE
