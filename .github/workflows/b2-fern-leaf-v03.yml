name: B2 Fern Leaf V03 Comparison (Review Only)
on:
  push:
    branches: [feature/gpt-b2-modular-wet-fern-20261117]
    paths:
      - tools/b2-vegetation/generate_leaf_v03.py
      - tools/b2-vegetation/render_leaf_v03_blender.py
      - .github/workflows/b2-fern-leaf-v03.yml
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and glTF generation tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq blender libegl1 libgl1
          python3 -m pip install --user --break-system-packages numpy trimesh
      - name: Generate five leaf GLBs
        run: python3 tools/b2-vegetation/generate_leaf_v03.py
      - name: Blender render five leaves from 3 angles
        run: blender -b -t 2 --python-exit-code 1 --python tools/b2-vegetation/render_leaf_v03_blender.py
      - name: Verify GLB signatures and actual render image headers/hashes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('render-output/b2-fern-leaf-v03')
          m=json.loads((p/'manifest.json').read_text())
          assert m['status']=='NOT_APPROVED'
          assert m['blender_render_status']=='GENERATED_UNAPPROVED'
          assert len(m['variants'])==5
          for v in m['variants']:
              g=(p/v['glb']).read_bytes()
              assert g[:4]==b'glTF' and hashlib.sha256(g).hexdigest()==v['sha256']
              assert len(v['render_files'])==3
              for name in v['render_files']:
                  data=(p/name).read_bytes()
                  assert data[:8]==bytes.fromhex('89504e470d0a1a0a')
                  assert len(data)>4096
                  assert hashlib.sha256(data).hexdigest()==v['render_sha256'][name]
          print('B2_LEAF_V03_VALIDATED',15,'views')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b2-fern-leaf-v03-unapproved-review
          path: render-output/b2-fern-leaf-v03/
          retention-days: 14
