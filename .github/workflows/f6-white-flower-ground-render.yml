name: F6 White Flower Ground Render
on:
  push:
    branches: [feature/f6-white-flower-ground-20261112]
  pull_request:
    branches: [development]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Preflight Python syntax
        run: python3 -m py_compile tools/floor6/white_flower_ground.py
      - name: Install Blender and glTF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          blender -b --python-expr 'import numpy; print(numpy.__version__)'
      - name: Generate 5000 polygon GLB and four renders
        run: |
          set -euo pipefail
          mkdir -p render-output/floor6/white-flower-ground
          blender -b -t 2 --python tools/floor6/white_flower_ground.py 2>&1 | tee render-output/floor6/white-flower-ground/blender.log
      - name: Validate outputs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("render-output/floor6/white-flower-ground")
          files=["white_flower_ground_v4.glb"]+["white_flower_ground_v4_"+v+".png" for v in ("front","side","angle","top")]
          for name in files:
              f=p/name
              assert f.exists() and f.stat().st_size>1000,name
              assert f.read_bytes()[:4]==(b"glTF" if name.endswith(".glb") else bytes([137,80,78,71])),name
              print(name,f.stat().st_size)
          assert "SOURCE_POLYGON_COUNT: 5000" in (p/"blender.log").read_text()
          assert "FLOWER_COUNT: 100" in (p/"blender.log").read_text()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f6-white-flower-ground-v4
          path: render-output/floor6/white-flower-ground/
          retention-days: 14
      - name: Render single white lily (1000 control coordinates)
        if: always()
        run: |
          set -euo pipefail
          python3 -m py_compile tools/floor6/white_lily_single.py
          mkdir -p render-output/floor6/white-lily-study
          blender -b -t 2 --python tools/floor6/white_lily_single.py 2>&1 | tee render-output/floor6/white-lily-study/blender.log
          grep -q WHITE_LILY_DONE render-output/floor6/white-lily-study/blender.log
      - name: Validate single lily GLB PNG and 1000 coordinates
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import csv
          p=Path('render-output/floor6/white-lily-study')
          assert (p/'white_lily_single.glb').read_bytes()[:4]==b'glTF'
          for v in ('angle','front','side','top'):
              f=p/('white_lily_'+v+'.png')
              assert f.stat().st_size>1000 and f.read_bytes()[:4]==bytes([137,80,78,71]),str(f)
          with (p/'control_points_1000.csv').open() as f:
              assert len(list(csv.DictReader(f)))==1000
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f6-white-lily-single-study
          path: render-output/floor6/white-lily-study/
          retention-days: 14
