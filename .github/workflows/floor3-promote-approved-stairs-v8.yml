name: Promote user-approved Floor3 Stair V8
on:
  push:
    branches: [feature/floor3-ruined-stair-connector-20261115]
    paths:
      - '.github/workflows/floor3-promote-approved-stairs-v8.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: floor3-stairs-v8-approved-promotion
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout approval base
        uses: actions/checkout@v5
        with:
          ref: development
          path: base
          persist-credentials: true
      - name: Checkout exact reproducible generator source
        uses: actions/checkout@v5
        with:
          ref: 25ed01185aa0989d55510a362bfdffb8a1bf8845
          path: source
          persist-credentials: false
      - name: Download verified original run artifact
        uses: actions/download-artifact@v4
        with:
          name: floor3-stairs-v8-review
          run-id: 43858942490
          repository: koda24-cell/kotama-no-bouken
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: incoming
      - name: Check original evidence and prepare approved-only files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib,shutil,struct
          incoming=pathlib.Path('incoming')
          manifest=json.loads((incoming/'stairs-v8-manifest.json').read_text())
          assert manifest['version']=='v8' and manifest['asset']=='stairs' and manifest['stage']=='floor3'
          assert manifest['run_id']=='43858942490'
          assert manifest['source_commit']=='5142f6099f930ab5f01ea1d5ec6098d7307bb76c'
          assert manifest['approval']=='NOT_APPROVED'
          mapping={
            'floor3_ruined_connector_stairs_v8.glb':'assets/models/floor3/ruined_connector/stairs_v8.glb',
            'floor3_ruined_connector_stairs_v8.blend':'assets/models/floor3/ruined_connector/sources/stairs_v8.blend',
            'floor3_ruined_connector_stairs_v8-front.png':'assets/models/floor3/ruined_connector/reviews/stairs_v8/front.png',
            'floor3_ruined_connector_stairs_v8-side.png':'assets/models/floor3/ruined_connector/reviews/stairs_v8/side.png',
            'floor3_ruined_connector_stairs_v8-angle.png':'assets/models/floor3/ruined_connector/reviews/stairs_v8/angle.png'
          }
          assert set(manifest['files'])==set(mapping)
          for src,dest in mapping.items():
            data=(incoming/src).read_bytes()
            entry=manifest['files'][src]
            assert len(data)==entry['bytes'],src
            assert hashlib.sha256(data).hexdigest()==entry['sha256'],src
            if src.endswith('.glb'):
              assert data[:4]==b'glTF' and struct.unpack_from('<I',data,8)[0]==len(data)
              json_len,json_type=struct.unpack_from('<II',data,12)
              assert json_type==0x4e4f534a
              gltf=json.loads(data[20:20+json_len])
              assert gltf['meshes'] and any('normalTexture' in mat for mat in gltf['materials'])
            if src.endswith('.png'):
              assert data[:8]==b'\x89PNG\r\n\x1a\n'
            dst=pathlib.Path('base')/dest
            dst.parent.mkdir(parents=True,exist_ok=True)
            assert not dst.exists(),f'refusing to overwrite existing asset {dest}'
            shutil.copy2(incoming/src,dst)
          approved={
            'asset_id':'floor3_ruined_connector_stairs_v8',
            'stage':'floor3','asset':'stairs','version':'v8',
            'status':'APPROVED_BY_USER_PENDING_GAME_INTEGRATION',
            'approval':{'approved':True,'approved_by':'user','approved_on':'2026-11-16','scope':'stairs V8 only','source':'ChatGPT user acceptance'},
            'origin':{'action_run_id':'43858942490','action_artifact_id':'14221847568','source_commit':manifest['source_commit']},
            'coordinate_system':'GLB/glTF 2.0',
            'footprint_m':[2,2],
            'game_asset_path':mapping['floor3_ruined_connector_stairs_v8.glb'],
            'previews':{k:mapping[f'floor3_ruined_connector_stairs_v8-{k}.png'] for k in ['front','side','angle']},
            'blend_path':mapping['floor3_ruined_connector_stairs_v8.blend'],
            'source_scripts':['tools/floor3/ruined_connector/'+x for x in ['build.py','build_irregular_v2.py','build_irregular_v3.py','build_irregular_v4.py','build_irregular_v5.py','build_irregular_v6.py','build_stairs_v7.py','build_stairs_v8.py']],
            'assets':{mapping[k]:v for k,v in manifest['files'].items()},
            'notes':['Approved visual V8, not yet integrated in game','V6 ramp/landing are not approved and are excluded','Test GLTFLoader/scale/alignments/lighting in Three.js before enabling']
          }
          dst=pathlib.Path('base/assets/models/floor3/ruined_connector/stairs_v8.manifest.json')
          dst.write_text(json.dumps(approved,ensure_ascii=False,indent=2)+'\n')
          PY
          mkdir -p base/tools/floor3/ruined_connector
          for f in build.py build_irregular_v2.py build_irregular_v3.py build_irregular_v4.py build_irregular_v5.py build_irregular_v6.py build_stairs_v7.py build_stairs_v8.py; do
            if test -e "base/tools/floor3/ruined_connector/$f"; then
              cmp "source/tools/floor3/ruined_connector/$f" "base/tools/floor3/ruined_connector/$f" || { echo "Source file conflict: $f"; exit 1; }
            else
              cp "source/tools/floor3/ruined_connector/$f" "base/tools/floor3/ruined_connector/$f"
            fi
          done
          mkdir -p base/docs/3d
          cat > base/docs/3d/FLOOR3_STAIRS_V8_COMPLETED_20261116.md <<'DOC'
          # 第3層 遺跡都市：崩壊階段 V8 正式完成記録
          
          - 承認: 2026-11-16、ユーザーがV8の3方向レンダを確認して「完成」と明示。
          - 完成範囲: **階段（stairs）V8 1アセットのみ**。スロープ・踊り場のV6は引き続き未承認。
          - 原本生成run: https://github.com/koda24-cell/kotama-no-bouken/actions/runs/43858942490
          - Artifact: 14221847568 / floor3-stairs-v8-review。ZIPは一時保存、正式ソースはGitHubで恒久保存。
          - 正式GLB: assets/models/floor3/ruined_connector/stairs_v8.glb
          - Blender原本: assets/models/floor3/ruined_connector/sources/stairs_v8.blend
          - 正面/側面/斜め: assets/models/floor3/ruined_connector/reviews/stairs_v8/{front,side,angle}.png
          - アセットmanifest: assets/models/floor3/ruined_connector/stairs_v8.manifest.json (元ファイルのSHA-256/GLB/画像/検査/承認情報)
          - Blender再生成コード: tools/floor3/ruined_connector/build_stairs_v8.py と依存する build_stairs_v7.py, build_irregular_v6.py, build_irregular_v5.py, build_irregular_v4.py, build_irregular_v3.py, build_irregular_v2.py, build.py
          - 仕上げ: 崩壊した踏み板・両側支持梁・実欠損・露出鉄筋・屈曲した錆びた手すり・凹型亀裂・NormalMap。
          - 既知の注意: 第3層迷宮へのThree.jsでの実接続は未実施。既存の2mタイルと床レベル・方向・カリング・当たり判定をテストする。
          - Claudeへの作業: GLB/PNG/manifestのみを参照。Blendを開く必要はない。GLTFLoaderで確認し、接合・材質・画角・容量・ロード・セーブに影響がないことを確認する。最終的なゲーム配置は別作業。
          - 元のPR #376はスロープ/踊り場の未完成コードを含むため自動マージしない。承認階段だけのこのPRをdevelopmentへ統合する。
          - 次の制作: スロープ（ramp）を一つずつ改善し、同様に正面/側面/斜めの実レンダーと承認を経て保存。
          DOC
      - name: Commit and push approved asset-only branch
        shell: bash
        working-directory: base
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b feature/approved-f3-stairs-v8-20261116
          git add assets/models/floor3/ruined_connector tools/floor3/ruined_connector docs/3d/FLOOR3_STAIRS_V8_COMPLETED_20261116.md
          git diff --cached --check
          git commit -m "assets(floor3): promote user-approved V8 stairs GLB, 3 previews, Blender source and Claude manifest"
          git push origin HEAD:refs/heads/feature/approved-f3-stairs-v8-20261116
          echo "Approval artifacts committed: $(git rev-parse HEAD)"
