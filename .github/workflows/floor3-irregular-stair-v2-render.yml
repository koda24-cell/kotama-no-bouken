name: Floor3 Irregular Stair V2 Render
on:
  push:
    branches: [feature/floor3-ruined-stair-connector-20261115]
    paths:
      - 'tools/floor3/ruined_connector/build_irregular_v2.py'
      - '.github/workflows/floor3-irregular-stair-v2-render.yml'
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Render irregular stair
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          docker pull lscr.io/linuxserver/blender:latest
          docker run --rm -v "$GITHUB_WORKSPACE:/work" lscr.io/linuxserver/blender:latest blender -b -t 2 --python /work/tools/floor3/ruined_connector/build_irregular_v2.py 2>&1 | tee blender.log
          grep -q 'FLOOR3_IRREGULAR_V2_COMPLETE' blender.log
      - name: Verify output
        run: |
          for kind in stairs ramp landing; do
            test -s "out/floor3_ruined_connector_${kind}_v2.glb"
            for view in front side angle; do
              test -s "out/floor3_ruined_connector_${kind}_v2-${view}.png"
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: floor3-irregular-stair-v2
          path: out/
          retention-days: 14
