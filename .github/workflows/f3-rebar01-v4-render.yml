name: Floor3 Exposed Rebar01 V4 Rib Geometry Review
on:
  push:
    branches: [feature/gpt-f3-exposed-rebar01-20261119]
    paths:
      - 'tools/floor3/rebar01/build_v4.py'
      - '.github/workflows/f3-rebar01-v4-render.yml'
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Check source
        run: python3 -m py_compile tools/floor3/rebar01/build_v4.py
      - name: Blender render V4
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/f3_rebar01
          docker pull lscr.io/linuxserver/blender:latest
          docker run --rm --user "$(id -u):$(id -g)" --entrypoint /usr/bin/blender -v "$PWD:/work" -w /work lscr.io/linuxserver/blender:latest -b -t 2 --python /work/tools/floor3/rebar01/build_v4.py 2>&1 | tee out/f3_rebar01/blender.log
          grep -q F3_REBAR_V4_ALL_COMPLETE out/f3_rebar01/blender.log
      - name: Verify V4 GLB, Blender checkpoint, closeup, texture and manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, hashlib, struct, json, os
          p=pathlib.Path('out/f3_rebar01')
          names=['F3_REBAR_RUST_01.png','f3_rebar01_v4.glb','f3_rebar01_v4.blend']+['f3_rebar01_v4-'+v+'.png' for v in ['front','side','angle','detail']]
          files={}
          for name in names:
              data=(p/name).read_bytes()
              assert len(data)>300,name
              if name.endswith('.png'):assert data[:8]==bytes.fromhex('89504e470d0a1a0a'),name
              if name.endswith('.blend'):assert data.startswith(b'BLENDER') or data.startswith(bytes.fromhex('28b52ffd')),name
              if name.endswith('.glb'):assert data[:4]==b'glTF' and struct.unpack_from('<I',data,8)[0]==len(data),name
              files[name]={'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}
          (p/'manifest.json').write_text(json.dumps({'asset':'F3_EXPOSED_REBAR_01','version':'V4','approval':'NOT_APPROVED','run_id':os.environ['GITHUB_RUN_ID'],'source_sha':os.environ['GITHUB_SHA'],'files':files},indent=2))
          print('F3_REBAR_V4_QA_OK',len(files))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f3-rebar01-v4-ribbed-detail
          path: out/f3_rebar01/
          retention-days: 14
