name: Floor3 Crane Surrounding Props Render
on:
  push:
    branches: [feature/floor3-crane-surrounding-props-20261114]
    paths:
      - 'tools/floor3/crane_props/**'
      - '.github/workflows/floor3-crane-surrounding-props.yml'
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          docker pull lscr.io/linuxserver/blender:latest
          docker run --rm -v "$GITHUB_WORKSPACE:/work" lscr.io/linuxserver/blender:latest blender -b -t 2 --python /work/tools/floor3/crane_props/build.py
      - name: Verify six variants and eighteen renders
        run: |
          for asset in cable_reel counterweight fallen_truss cable_reel_v2 counterweight_v2 fallen_truss_v2; do
            test -s "out/floor3_crane_$asset.glb"
            for view in front side angle; do test -s "out/floor3_crane_$asset-$view.png"; done
          done
          ls -lh out/
      - uses: actions/upload-artifact@v4
        with:
          name: floor3-crane-surrounding-props
          path: out/
          retention-days: 14
