name: Blender QA bounded loop (prototype)
on:
  workflow_dispatch:
    inputs:
      source_blend:
        description: "Repository-relative .blend path; blank uses test fixture ONLY"
        required: false
        type: string
      resume_run_id:
        description: "Previous workflow run ID to resume checkpoint from (same repo)"
        required: false
        type: string
      max_iterations:
        description: "Total iterations including resumed iterations (1-20)"
        required: false
        default: "4"
        type: string
  push:
    branches:
      - feature/gpt-blender-qa-loop-20261116
    paths:
      - 'tools/blender-qa/**'
      - '.github/workflows/blender-qa-loop.yml'
permissions:
  contents: read
  actions: read
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
          blender --version
      - name: Download prior checkpoint when requested
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: blender-qa-checkpoint
          path: qa-output
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
      - name: Generate disposable demo scene for default test
        if: ${{ inputs.source_blend == '' }}
        run: blender -b -t 2 --python-exit-code 1 --python tools/blender-qa/make_demo.py
      - name: Run bounded QA (preserve files even on quality failure)
        shell: bash
        env:
          SOURCE_BLEND: ${{ inputs.source_blend }}
          MAX_ITERATIONS: ${{ inputs.max_iterations || '4' }}
        run: |
          set -euo pipefail
          if [[ -z "$SOURCE_BLEND" ]]; then SOURCE_BLEND="qa-fixture/sample.blend"; fi
          if [[ "$SOURCE_BLEND" = /* || "$SOURCE_BLEND" == *".."* || "$SOURCE_BLEND" != *.blend ]]; then
            echo "Unsafe or invalid scene path"; exit 2
          fi
          blender -b -t 2 --python-exit-code 1 --python tools/blender-qa/qa_loop.py -- \
            --source "$SOURCE_BLEND" --out qa-output \
            --max-iterations "$MAX_ITERATIONS" --max-seconds 2400
      - name: Upload checkpoints, GLB, renders and progress
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blender-qa-checkpoint
          path: qa-output/
          if-no-files-found: warn
          retention-days: 14
