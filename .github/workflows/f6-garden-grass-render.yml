name: F6 Flower Garden Grass Render
on:
  push:
    branches: [feature/f6-flower-garden-grass-20261113]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Check Python syntax
        run: python3 -m py_compile tools/floor6/garden_grass_clumps.py
      - name: Install Blender
        run: sudo apt-get update -qq && sudo apt-get install -y blender
      - name: Generate GLB and renders
        run: |
          set -euo pipefail
          mkdir -p render-output/floor6/garden-grass
          blender -b -t 2 --python tools/floor6/garden_grass_clumps.py 2>&1 | tee render-output/floor6/garden-grass/blender.log
          grep -q F6_GARDEN_GRASS_DONE render-output/floor6/garden-grass/blender.log
      - name: Validate output
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('render-output/floor6/garden-grass')
          for name in ['f6_garden_grass_clumps_v1.glb']+['f6_garden_grass_'+x+'.png' for x in ['angle','front','side','top']]:
              f=p/name
              assert f.exists() and f.stat().st_size>1000,name
              assert f.read_bytes()[:4]==(b'glTF' if name.endswith('.glb') else bytes([137,80,78,71])),name
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f6-garden-grass-v1
          path: render-output/floor6/garden-grass/
          retention-days: 14
