name: Advanced production cross-job resume
on:
  pull_request:
    branches: [development]
    paths:
      - 'tools/3d_checkpoint/advanced_*.py'
      - '.github/workflows/advanced-cross-job-resume.yml'
permissions:
  contents: read
  packages: read
jobs:
  checkpoint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create partial checkpoint
        run: |
          mkdir -p resume
          PYTHONPATH=tools/3d_checkpoint python3 - <<'PY'
          from pathlib import Path
          from advanced_session import run
          p=Path("resume")
          (p/"source").write_text("source")
          (p/"reference").write_text("reference")
          def worker(step,settings,deadline):
              if step=="second":return {"ok":False,"error":"deadline"}
              f=p/step;f.write_text("verified")
              return {"ok":True,"scan_pass":True,"files":[f]}
          assert run(p,p/"source",p/"reference",["first","second"],worker)=="REVIEW_REQUIRED"
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: advanced-checkpoint
          path: resume/
          retention-days: 14
  resume:
    needs: checkpoint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: advanced-checkpoint
          path: resume
      - name: Verify hashes and resume remaining candidate
        run: |
          PYTHONPATH=tools/3d_checkpoint python3 - <<'PY'
          from pathlib import Path
          from advanced_session import run
          p=Path("resume")
          def worker(step,settings,deadline):
              assert step=="second"
              f=p/step;f.write_text("completed")
              return {"ok":True,"scan_pass":True,"files":[f]}
          assert run(p,p/"source",p/"reference",["first","second"],worker)=="COMPLETE"
          PY
