name: Cloudflare preview password gate
# Read-only, fail-closed check of every hostname of the private Pages project:
# unauthenticated (no cookie / forged cookie) requests must get the worker's
# 401 login page, a wrong password must be refused, the correct password
# (PREVIEW_PASSWORD secret) must open the files. Callable from other workflows.
on:
  push:
    branches: [feature/gpt-cloudflare-private-preview-preflight-20261127]
    paths:
      - '.github/workflows/cloudflare-access-gate.yml'
      - 'tools/cloudflare-preview/pages_gate.py'
  workflow_dispatch:
  workflow_call:
    inputs:
      paths:
        description: Space-separated paths to request on every hostname
        type: string
        default: '/ /index.html /probe.css /probe.js /probe.svg'

permissions:
  contents: read
jobs:
  gate:
    if: github.repository == 'koda24-cell/kotama-no-bouken'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: tools/cloudflare-preview
      - name: Password gate on all hostnames
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIEW_PASSWORD: ${{ secrets.PREVIEW_PASSWORD }}
        run: python3 tools/cloudflare-preview/pages_gate.py gate --paths "${{ inputs.paths || '/ /index.html /probe.css /probe.js /probe.svg' }}"
