name: Cloudflare Access unauthenticated gate
on:
  push:
    branches: [feature/gpt-cloudflare-private-preview-preflight-20261127]
    paths: ['.github/workflows/cloudflare-access-gate.yml']
  pull_request:
    branches: [development]
    paths: ['.github/workflows/cloudflare-access-gate.yml']
  workflow_dispatch:

permissions:
  contents: read
jobs:
  gate:
    if: >-
      github.repository == 'koda24-cell/kotama-no-bouken' &&
      ((github.event_name != 'pull_request' && github.ref == 'refs/heads/feature/gpt-cloudflare-private-preview-preflight-20261127') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/gpt-cloudflare-private-preview-preflight-20261127' &&
      github.event.pull_request.base.ref == 'development'))
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Enumerate dedicated probe hosts from Pages API
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, urllib.request, urllib.parse
          account=os.environ["CF_ACCOUNT"]
          assert re.fullmatch(r"[a-fA-F0-9]{32}",account)
          project="kotama-private-probe-20261127"
          root=project+".pages.dev"
          def get(suffix):
              req=urllib.request.Request("https://api.cloudflare.com/client/v4/accounts/"+account+"/pages/projects/"+project+suffix, headers={"Authorization":"Bearer "+os.environ["CF_TOKEN"]})
              with urllib.request.urlopen(req,timeout=25) as response:
                  data=json.load(response)
              assert data["success"] is True
              return data
          p=get("")["result"]
          assert p["name"]==project and p["subdomain"]==root
          assert not set(p.get("domains") or [])-{root}, "Unexpected custom domains; manual review required"
          hosts={root,"6c71c3ab."+root}
          for page in range(1,21):
              data=get("/deployments?per_page=25&page="+str(page))
              rows=data["result"]
              for d in rows:
                  for url in [d["url"],*(d.get("aliases") or [])]:
                      h=urllib.parse.urlsplit(url if "://" in url else "https://"+url).hostname
                      assert h and (h==root or h.endswith("."+root)), "Unexpected hostname"
                      hosts.add(h)
              info=data.get("result_info") or {}
              if len(rows)<25 or (info.get("total_pages") and page>=info["total_pages"]):
                  break
          else:
              raise RuntimeError("Deployment pagination incomplete")
          assert len(hosts)<=50, "Unexpected number of hosts"
          with open(os.path.join(os.environ["RUNNER_TEMP"],"cf-probe-hosts"),"w") as f:
              f.write("\n".join(sorted(hosts))+"\n")
          print("Discovered",len(hosts),"probe hostnames. No configuration changed.")
          PY
      - name: Check all probe paths without login or cookies
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, urllib.request, urllib.error, urllib.parse, concurrent.futures
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):
                  return None
          hosts=open(os.path.join(os.environ["RUNNER_TEMP"],"cf-probe-hosts")).read().splitlines()
          paths=["/","/index.html","/probe.css","/probe.js","/probe.svg"]
          def check(pair):
              host,path=pair
              url="https://"+host+path
              opener=urllib.request.build_opener(NoRedirect())
              for attempt in range(2):
                  try:
                      req=urllib.request.Request(url,headers={"User-Agent":"Kotama-Access-Gate/1.0"})
                      try:
                          response=opener.open(req,timeout=12)
                      except urllib.error.HTTPError as e:
                          response=e
                      with response:
                          status=response.code
                          loc=urllib.parse.urlsplit(response.headers.get("Location",""))
                          auth=(loc.scheme=="https" and bool(loc.hostname) and loc.hostname.endswith(".cloudflareaccess.com") and loc.path.startswith("/cdn-cgi/access/"))
                          if status in (301,302,303,307,308) and auth:
                              return url,status,"ACCESS_LOGIN",True
                          # Same-host canonicalization is not authentication.
                          if status in (301,302,303,307,308) and path=="/index.html" and loc.path=="/" and loc.hostname in (None,host):
                              return url,status,"CANONICAL_ONLY_ROOT_CHECKED_SEPARATELY",True
                          return url,status,"UNVERIFIED_OR_PUBLIC",False
                  except (OSError,urllib.error.URLError):
                      if attempt==1:
                          return url,0,"NETWORK_OR_TLS_ERROR",False
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              results=list(pool.map(check,[(h,p) for h in hosts for p in paths]))
          for url,status,label,ok in results:
              print(url,status,label)
          passed=all(x[3] for x in results)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("Unauthenticated Access redirect gate: "+("PASS" if passed else "NOT PASSED")+"\n")
              f.write("Authorized and unauthorized email tests are separate; no game deployment authorized.\n")
          raise SystemExit(0 if passed else 1)
          PY
