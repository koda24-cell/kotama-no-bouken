name: Promote approved B5 vault GLB and PNG
on:
  push:
    branches:
      - feature/b5-approved-vault-assets-20261112
    paths:
      - '.github/workflows/b5-approved-vault-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: '43121184611'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify approved source run and download all five actual render artifacts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, urllib.request, zipfile, io
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def get(url):
              return urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=90).read()
          run=json.loads(get('https://api.github.com/repos/'+repo+'/actions/runs/'+os.environ['SOURCE_RUN']))
          assert run['conclusion']=='success', 'Source workflow run must be successful'
          assert run['head_branch']=='feature/b5-vault-crossrib-20261112', 'Unexpected source branch'
          artifacts=json.loads(get('https://api.github.com/repos/'+repo+'/actions/runs/'+os.environ['SOURCE_RUN']+'/artifacts?per_page=100'))['artifacts']
          kinds=['basic-vault','collapsed-vault','royal-vault','vault-support','fallen-vault-rubble']
          for kind in kinds:
              name='b5-vault-'+kind+'-glb-png'
              matching=[a for a in artifacts if a['name']==name and not a['expired']]
              assert len(matching)==1,'Missing source artifact: '+name
              a=matching[0]
              payload=get('https://api.github.com/repos/'+repo+'/actions/artifacts/'+str(a['id'])+'/zip')
              with zipfile.ZipFile(io.BytesIO(payload)) as archive:
                  files={pathlib.PurePosixPath(x.filename).name:x for x in archive.infolist() if not x.is_dir()}
                  expected=[kind+'.glb']+[kind+'-'+view+'.png' for view in ('front','back','top-oblique')]
                  assert all(f in files for f in expected),(kind,list(files))
                  target=pathlib.Path('assets/models/floor5');review=target/'reviews'/kind
                  review.mkdir(parents=True,exist_ok=True)
                  for filename in expected:
                      b=archive.read(files[filename])
                      assert len(b)>1024,filename
                      assert b[:4]==(b'glTF' if filename.endswith('.glb') else b'\\x89PNG'),filename
                      dest=target/filename if filename.endswith('.glb') else review/filename
                      dest.write_bytes(b)
                      print('SAVED',dest,len(b),'bytes')
          (pathlib.Path('assets/models/floor5')/'APPROVED_VAULT_SOURCE.md').write_text(
              '# Approved B5 Gothic vault assets\\n\\n'
              'User approved the five vaulted-ceiling models on 2026-11-12.\\n\\n'
              'Source GitHub Actions run: https://github.com/'+repo+'/actions/runs/'+os.environ['SOURCE_RUN']+'\\n'
              'GLB files are in this directory; FRONT/BACK/TOP-OBLIQUE PNGs are in reviews/<kind>/.\\n'
              'This branch is for permanent asset storage review; no game runtime integration.\\n')
          PY
      - name: Commit GLB and PNG to dedicated promotion branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/models/floor5/
          git diff --cached --stat
          git diff --cached --quiet && { echo 'Nothing to promote'; exit 1; }
          git commit -m "assets(b5): promote five approved Gothic vault GLBs and 15 real Blender renders"
          git push origin HEAD:feature/b5-approved-vault-assets-20261112
