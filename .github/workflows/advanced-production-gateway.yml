name: Advanced production shared gateway
on:
  pull_request:
    branches: [development]
    paths:
      - 'tools/3d_checkpoint/advanced_*.py'
      - '.github/workflows/advanced-production-gateway.yml'
permissions:
  contents: read
  packages: read
jobs:
  render:
    uses: ./.github/workflows/shared-blender53-render.yml
    with:
      script: tools/3d_checkpoint/advanced_gateway_fixture.py
      output_dir: render-output/advanced-production
      artifact_suffix: -advanced-production
