name: B2 Single Waterwheel Spoke V02 Blender Review
# Design reviewed against development wheel geometry; generate review-only artifacts.
on:
  push:
    branches: [feature/gpt-b2-waterwheel-single-spoke-v01-20261119]
    paths:
      - '.github/workflows/b2-waterwheel-single-spoke-v02.yml'
      - 'tools/b2-waterwheel-spoke/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Record actual workflow run for cross-chat verification
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p docs/3d/b2-waterwheel-spoke
          echo "{\"run_id\":${RUN_ID},\"status\":\"RUNNING_NOT_APPROVED\"}" > /tmp/b2-spoke-run.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feature/gpt-b2-waterwheel-single-spoke-v01-20261119
          git reset --hard origin/feature/gpt-b2-waterwheel-single-spoke-v01-20261119
          cp /tmp/b2-spoke-run.json docs/3d/b2-waterwheel-spoke/latest-v02.json
          git add docs/3d/b2-waterwheel-spoke/latest-v02.json
          git commit -m "chore(b2): record single spoke V02 run" || true
          git push origin HEAD:feature/gpt-b2-waterwheel-single-spoke-v01-20261119
      - name: Restore approved-look V11 rim Blend as a non-destructive PBR source
        uses: actions/download-artifact@v4
        with:
          name: b2-waterwheel-single-rim-v11
          run-id: 44436858908
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: checkpoint
      - name: Verify source reference provenance
        run: |
          echo "addae90dd199b9f6d0417c70f5152a32bd504e83e2deffa8e0965a0fdf5e2c67  checkpoint/b2_waterwheel_single_rim_segment_v11.blend" | sha256sum -c
      - name: Real Blender Cycles 4-view GLB and Blend
        shell: bash
        run: |
          set -o pipefail
          mkdir -p render-output/b2-single-spoke-v02
          docker run --rm -v "$PWD:/workspace" -w /workspace lscr.io/linuxserver/blender:latest /blender/blender -b -t 2 --python-exit-code 1 --python tools/b2-waterwheel-spoke/build_single_spoke_v02.py -- render-output/b2-single-spoke-v02 checkpoint/b2_waterwheel_single_rim_segment_v11.blend | tee /tmp/b2-spoke.log
          ! grep -E 'Traceback \(most recent call last\)|Python script failed|Error: Python' /tmp/b2-spoke.log
          grep -q 'B2_SINGLE_SPOKE_V02_RENDER_SUCCESS' /tmp/b2-spoke.log
      - name: Verify 4 actual PNG GLB BLEND and hashes
        run: |
          python3 - <<'PY'
          import pathlib,json,hashlib,struct
          p=pathlib.Path('render-output/b2-single-spoke-v02')
          m=json.loads((p/'b2_waterwheel_single_spoke_v02_manifest.json').read_text())
          assert m['approval']=='NOT_APPROVED' and m['single_spoke_only'] and len(m['files'])==6
          assert len([k for k in m['files'] if k.endswith('.png')])==4
          for fn,record in m['files'].items():
              data=(p/fn).read_bytes()
              assert len(data)==record['bytes'] and hashlib.sha256(data).hexdigest()==record['sha256']
              if fn.endswith('.png'):assert data[:8]==bytes.fromhex('89504e470d0a1a0a')
              if fn.endswith('.blend'):assert data[:7]==b'BLENDER' or data[:4]==bytes.fromhex('28b52ffd')
              if fn.endswith('.glb'):
                  assert data[:4]==b'glTF'
                  n=struct.unpack_from('<I',data,12)[0]
                  obj=json.loads(data[20:20+n])
                  assert len(obj.get('meshes',[]))>=1
          print('SPOKE_V02_ARTIFACT_HASHES_OK')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b2-waterwheel-single-spoke-v02
          path: render-output/b2-single-spoke-v02
          retention-days: 14
          if-no-files-found: warn
