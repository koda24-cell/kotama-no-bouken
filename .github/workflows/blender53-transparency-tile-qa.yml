name: Blender 5.3 glass alpha emission tiled seam validation
on:
  push:
    branches:
      - feature/blender53-transparency-tile-qa-20261122
    paths:
      - '.github/workflows/blender53-transparency-tile-qa.yml'
      - 'tools/3d_checkpoint/prepare_transparency_qa.py'
permissions:
  contents: read
  actions: read
  packages: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    container:
      image: ghcr.io/koda24-cell/kotama-blender53-clamav@sha256:5ce601f79b1ab09405b3ebc36b1a596be76cb8b105b1524fcbafcb186ebf7e99
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate Blender version and scan source GLB and scripts
        run: |
          blender --version | head -1 | grep -Fx 'Blender 5.3.0'
          bash tools/security/clamav_scan_gate.sh update qa/security
          bash tools/security/clamav_scan_gate.sh scan tools/3d_checkpoint/prepare_transparency_qa.py qa/security/prepare-script.log
          bash tools/security/clamav_scan_gate.sh scan tools/3d_checkpoint/render_one_view.py qa/security/view-script.log
      - name: Prepare separate transparent scene retaining original GLB
        run: blender -b --disable-autoexec --python-exit-code 1 -t 2 --python tools/3d_checkpoint/prepare_transparency_qa.py
      - name: Render single-pass reference front camera
        env:
          RESUME_BLEND: render-output/qa-transparent-tiles/transparent_material_probe.blend
          RENDER_OUTPUT: render-output/qa-transparent-tiles
          RENDER_VIEW: front
        run: blender -b --disable-autoexec --python-exit-code 1 -t 2 --python tools/3d_checkpoint/render_one_view.py
      - name: Verify baseline PNG and pack + scan immutable checkpoint
        env:
          COMMIT: ${{ github.sha }}
        run: |
          python3 tools/3d_checkpoint/verify_one_view.py --file render-output/qa-transparent-tiles/front.png --view front
          python3 tools/3d_checkpoint/checkpoint.py pack --directory render-output/qa-transparent-tiles --asset-id transparent-material-tile-qa --iteration 1 --source-script tools/3d_checkpoint/prepare_transparency_qa.py --source-commit "$COMMIT"
          python3 tools/3d_checkpoint/checkpoint.py verify --directory render-output/qa-transparent-tiles --asset-id transparent-material-tile-qa --source-script tools/3d_checkpoint/prepare_transparency_qa.py --source-commit "$COMMIT"
          bash tools/security/clamav_scan_gate.sh scan render-output/qa-transparent-tiles qa/security/baseline.log
      - uses: actions/upload-artifact@v4
        with:
          name: transparent-reference-NOT-APPROVED-${{ github.run_id }}
          path: render-output/qa-transparent-tiles/
          retention-days: 14
          if-no-files-found: error

  left:
    needs: baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    container:
      image: ghcr.io/koda24-cell/kotama-blender53-clamav@sha256:5ce601f79b1ab09405b3ebc36b1a596be76cb8b105b1524fcbafcb186ebf7e99
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: transparent-reference-NOT-APPROVED-${{ github.run_id }}
          path: baseline
      - name: Verify, scan source and Blender scripts before import
        env:
          COMMIT: ${{ github.sha }}
        run: |
          python3 tools/3d_checkpoint/checkpoint.py verify --directory baseline --asset-id transparent-material-tile-qa --source-script tools/3d_checkpoint/prepare_transparency_qa.py --source-commit "$COMMIT"
          bash tools/security/clamav_scan_gate.sh update qa/security
          bash tools/security/clamav_scan_gate.sh scan baseline qa/security/baseline.log
          bash tools/security/clamav_scan_gate.sh scan tools/3d_checkpoint/render_half_frame.py qa/security/half-script.log
      - name: Render left half of transparent image
        env:
          RESUME_BLEND: baseline/transparent_material_probe.blend
          RENDER_OUTPUT: render-output/transparent-left
          RENDER_VIEW: front
          RENDER_TILE: left
        run: blender -b --disable-autoexec --python-exit-code 1 -t 2 --python tools/3d_checkpoint/render_half_frame.py
      - name: Validate left PNG and pack immutable checkpoint
        env:
          COMMIT: ${{ github.sha }}
        run: |
          cp baseline/transparent_material_probe.blend baseline/transparent_material_probe.glb render-output/transparent-left/
          python3 -c "import importlib.util; s=importlib.util.spec_from_file_location('tiles','tools/3d_checkpoint/stitch_half_frame.py');m=importlib.util.module_from_spec(s);s.loader.exec_module(m);assert m.read_rgba('render-output/transparent-left/left.png')[:2]==(500,760)"
          python3 tools/3d_checkpoint/checkpoint.py pack --directory render-output/transparent-left --asset-id b4-transparent-left --iteration 2 --parent-checkpoint "transparent-reference-${{ github.run_id }}" --source-script tools/3d_checkpoint/render_half_frame.py --source-commit "$COMMIT"
          python3 tools/3d_checkpoint/checkpoint.py verify --directory render-output/transparent-left --asset-id b4-transparent-left --source-script tools/3d_checkpoint/render_half_frame.py --source-commit "$COMMIT"
          bash tools/security/clamav_scan_gate.sh scan render-output/transparent-left qa/security/left.log
      - uses: actions/upload-artifact@v4
        with:
          name: transparent-left-NOT-APPROVED-${{ github.run_id }}
          path: render-output/transparent-left/
          retention-days: 14
          if-no-files-found: error

  right-and-qa:
    needs: left
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    container:
      image: ghcr.io/koda24-cell/kotama-blender53-clamav@sha256:5ce601f79b1ab09405b3ebc36b1a596be76cb8b105b1524fcbafcb186ebf7e99
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: transparent-left-NOT-APPROVED-${{ github.run_id }}
          path: saved-left
      - uses: actions/download-artifact@v4
        with:
          name: transparent-reference-NOT-APPROVED-${{ github.run_id }}
          path: reference
      - name: Verify both prior checkpoints and scan
        env:
          COMMIT: ${{ github.sha }}
        run: |
          python3 tools/3d_checkpoint/checkpoint.py verify --directory saved-left --asset-id b4-transparent-left --source-script tools/3d_checkpoint/render_half_frame.py --source-commit "$COMMIT"
          python3 tools/3d_checkpoint/checkpoint.py verify --directory reference --asset-id transparent-material-tile-qa --source-script tools/3d_checkpoint/prepare_transparency_qa.py --source-commit "$COMMIT"
          bash tools/security/clamav_scan_gate.sh update qa/security
          bash tools/security/clamav_scan_gate.sh scan saved-left qa/security/left.log
          bash tools/security/clamav_scan_gate.sh scan reference qa/security/reference.log
          bash tools/security/clamav_scan_gate.sh scan tools/3d_checkpoint/seam_qa.py qa/security/seam-script.log
      - name: Reuse durable left half unchanged
        run: |
          mkdir -p render-output/transparent-combined
          cp saved-left/left.png saved-left/transparent_material_probe.blend saved-left/transparent_material_probe.glb render-output/transparent-combined/
          test "$(sha256sum saved-left/left.png | cut -d' ' -f1)" = "$(sha256sum render-output/transparent-combined/left.png | cut -d' ' -f1)"
          echo "TRANSPARENT_LEFT_REUSED=true"
      - name: Render right half with existing Blender tiling pipeline
        env:
          RESUME_BLEND: saved-left/transparent_material_probe.blend
          RENDER_OUTPUT: render-output/transparent-combined
          RENDER_VIEW: front
          RENDER_TILE: right
        run: blender -b --disable-autoexec --python-exit-code 1 -t 2 --python tools/3d_checkpoint/render_half_frame.py
      - name: Stitch both actual transparent renders
        run: python3 tools/3d_checkpoint/stitch_half_frame.py --left render-output/transparent-combined/left.png --right render-output/transparent-combined/right.png --output render-output/transparent-combined/front.png
      - name: Run seam QA against real single-pass transparent render
        run: |
          python3 tools/3d_checkpoint/seam_qa.py --stitched render-output/transparent-combined/front.png --reference reference/front.png --report render-output/transparent-combined/seam_qa.json
      - name: Verify, pack and scan completed result
        env:
          COMMIT: ${{ github.sha }}
        run: |
          python3 tools/3d_checkpoint/verify_one_view.py --file render-output/transparent-combined/front.png --view front
          python3 tools/3d_checkpoint/checkpoint.py pack --directory render-output/transparent-combined --asset-id transparent-material-stitched-qa --iteration 3 --parent-checkpoint "transparent-left-${{ github.run_id }}" --source-script tools/3d_checkpoint/render_half_frame.py --source-commit "$COMMIT"
          python3 tools/3d_checkpoint/checkpoint.py verify --directory render-output/transparent-combined --asset-id transparent-material-stitched-qa --source-script tools/3d_checkpoint/render_half_frame.py --source-commit "$COMMIT"
          bash tools/security/clamav_scan_gate.sh scan render-output/transparent-combined qa/security/out.log
      - uses: actions/upload-artifact@v4
        with:
          name: transparent-tiled-PASS-NOT-APPROVED-${{ github.run_id }}
          path: render-output/transparent-combined/
          retention-days: 14
          if-no-files-found: error
