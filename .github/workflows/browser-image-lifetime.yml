name: Browser image lifetime smoke
on:
  push:
    branches:
      - feature/gpt-field-status-large-20261126
    paths:
      - tools/test-image-lifetime-browser.mjs
      - .github/workflows/browser-image-lifetime.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8000 > /tmp/kotama-http.log 2>&1 &
          node tools/test-image-lifetime-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-image-lifetime
          path: |
            browser-image-lifetime-report.json
            image-lifetime-*.png
          retention-days: 14
