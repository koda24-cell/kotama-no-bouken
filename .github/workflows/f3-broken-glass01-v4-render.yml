name: Floor3 Broken Glass01 V4 Visibility Review
on:
  push:
    branches: [feature/gpt-f3-broken-window-glass01-20261119]
    paths: ['tools/floor3/broken_glass01/build_v4.py','.github/workflows/f3-broken-glass01-v4-render.yml']
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile tools/floor3/broken_glass01/build_v4.py
      - name: Render glass with contrast backing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/f3_broken_glass01
          docker pull lscr.io/linuxserver/blender:latest
          docker run --rm --user "$(id -u):$(id -g)" --entrypoint /usr/bin/blender -v "$PWD:/work" -w /work lscr.io/linuxserver/blender:latest -b -t 2 --python /work/tools/floor3/broken_glass01/build_v4.py 2>&1 | tee out/f3_broken_glass01/blender_v4.log
          grep -q F3_GLASS_V4_ALL_COMPLETE out/f3_broken_glass01/blender_v4.log
      - name: Validate V4 render outputs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,struct,hashlib,os
          p=Path('out/f3_broken_glass01')
          names=['F3_WINDOW_DIRT_MASK_01.png','f3_broken_glass01_v4.glb','f3_broken_glass01_v4.blend']+[f'f3_broken_glass01_v4-{v}.png' for v in ('front','side','angle','fracture_detail')]
          data={}
          for n in names:
              b=(p/n).read_bytes()
              assert len(b)>350,n
              if n.endswith('.png'):assert b[:8]==bytes.fromhex('89504e470d0a1a0a'),n
              if n.endswith('.glb'):assert b[:4]==b'glTF' and struct.unpack_from('<I',b,8)[0]==len(b),n
              if n.endswith('.blend'):assert b[:7]==b'BLENDER' or b[:4]==bytes.fromhex('28b52ffd'),n
              data[n]={'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()}
          (p/'manifest_v4.json').write_text(json.dumps({'asset':'F3_BROKEN_GLASS01','version':4,'approval':'NOT_APPROVED','run_id':os.environ['GITHUB_RUN_ID'],'source_sha':os.environ['GITHUB_SHA'],'files':data},indent=2))
          print('GLASS_V4_QA_OK',len(data))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f3-broken-glass01-v4
          path: out/f3_broken_glass01/
          retention-days: 14
