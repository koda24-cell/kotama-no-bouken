name: Display image optimization
on:
  push:
    branches: [feature/gpt-image-optimization-20261126]
    paths: ['.github/workflows/display-image-optimization.yml', 'tools/optimize-display-images.py']
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow==11.3.0
      - run: python tools/optimize-display-images.py
      - run: |
          git diff --check
          git add assets/optimized docs/image-optimization-report.json
          git add -u
          git diff --cached --stat
          git config user.name github-actions
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Generate optimized display images and update runtime references"
          git push origin HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: image-optimization-report
          path: docs/image-optimization-report.json
