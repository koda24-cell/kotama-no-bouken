name: B4 Cart Rail Baseline Blender Render
on:
  push:
    branches:
      - feature/gpt-b4-cart-rail-baseline-20261116
    paths:
      - '.github/workflows/b4-cart-rail-baseline-20261116.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Three.js and Blender
        run: |
          npm install --no-save --ignore-scripts --no-package-lock three@0.160.1
          sudo apt-get update
          sudo apt-get install -y blender
          blender --version
      - name: Export existing untouched V11 geometry
        run: node tools/b4-render/export-batch.mjs
      - name: Blender 3-view baseline renders
        run: |
          for glb in render-output/b4-cart-after.glb render-output/b4-rails-v11-straight.glb render-output/b4-rails-v11-curved.glb render-output/b4-rails-v11-broken.glb; do
            echo "Rendering $glb"
            blender -b -t 2 --python tools/b4-render/render-batch.py -- "$glb" render-output
          done
      - name: Validate and list outputs
        if: always()
        run: |
          find render-output -maxdepth 1 -type f -printf '%f %s bytes\n' | sort || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b4-cart-rail-v11-baseline
          path: render-output/
          retention-days: 14
