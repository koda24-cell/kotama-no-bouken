name: Blender 5.3 checkpoint recovery selector tests
on:
  push:
    branches:
      - feature/blender53-recovery-selector-20261120
    paths:
      - 'tools/3d_checkpoint/**'
      - '.github/workflows/blender53-recovery-selector-tests.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tools/3d_checkpoint -p 'test_*.py' -v
