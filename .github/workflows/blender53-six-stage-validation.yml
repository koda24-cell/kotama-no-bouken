name: Blender 5.3 six-stage checkpoint endurance validation
on:
  push:
    branches:
      - feature/blender53-six-stage-validation-20261122
    paths:
      - '.github/workflows/blender53-six-stage-validation.yml'
  workflow_dispatch:
    inputs:
      max_stages:
        description: 'Number of stages to validate (5 or 6)'
        required: true
        type: choice
        default: '6'
        options: ['5', '6']
permissions:
  contents: read
  actions: read
  packages: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          python3 tools/3d_checkpoint/test_stage_budget.py
          python3 tools/3d_checkpoint/test_stage_plan.py
          python3 tools/3d_checkpoint/test_stage_route.py
  stage-1:
    needs: [preflight]
    uses: ./.github/workflows/blender53-reusable-stage-worker.yml
    with:
      stage: 1
      max_stages: ${{ fromJSON(inputs.max_stages || '6') }}
      simulated_minutes: 71
  stage-2:
    needs: [stage-1]
    if: ${{ needs.stage-1.result == 'success' && needs.stage-1.outputs.handoff_required == 'true' }}
    uses: ./.github/workflows/blender53-reusable-stage-worker.yml
    with:
      stage: 2
      max_stages: ${{ fromJSON(inputs.max_stages || '6') }}
      simulated_minutes: 71
  stage-3:
    needs: [stage-2]
    if: ${{ needs.stage-2.result == 'success' && needs.stage-2.outputs.handoff_required == 'true' }}
    uses: ./.github/workflows/blender53-reusable-stage-worker.yml
    with:
      stage: 3
      max_stages: ${{ fromJSON(inputs.max_stages || '6') }}
      simulated_minutes: 71
  stage-4:
    needs: [stage-3]
    if: ${{ needs.stage-3.result == 'success' && needs.stage-3.outputs.handoff_required == 'true' }}
    uses: ./.github/workflows/blender53-reusable-stage-worker.yml
    with:
      stage: 4
      max_stages: ${{ fromJSON(inputs.max_stages || '6') }}
      simulated_minutes: 71
  stage-5:
    needs: [stage-4]
    if: ${{ needs.stage-4.result == 'success' && needs.stage-4.outputs.handoff_required == 'true' }}
    uses: ./.github/workflows/blender53-reusable-stage-worker.yml
    with:
      stage: 5
      max_stages: ${{ fromJSON(inputs.max_stages || '6') }}
      simulated_minutes: 71
  stage-6:
    needs: [stage-5]
    if: ${{ needs.stage-5.result == 'success' && needs.stage-5.outputs.handoff_required == 'true' }}
    uses: ./.github/workflows/blender53-reusable-stage-worker.yml
    with:
      stage: 6
      max_stages: ${{ fromJSON(inputs.max_stages || '6') }}
      simulated_minutes: 71
