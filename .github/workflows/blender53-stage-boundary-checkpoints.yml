name: Blender 5.3 durable stage-boundary checkpoint test
on:
  workflow_dispatch:
    inputs:
      recovery_drill:
        description: 'After durable stage-one upload, intentionally fail stage-two for external recovery test'
        required: true
        type: boolean
        default: false
  push:
    branches:
      - feature/blender53-stage-boundary-checkpoints-20261120
    paths:
      - '.github/workflows/blender53-stage-boundary-checkpoints.yml'
permissions:
  contents: read
  actions: read
  packages: read
jobs:
  stage-one:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: ghcr.io/koda24-cell/kotama-blender53-clamav@sha256:5ce601f79b1ab09405b3ebc36b1a596be76cb8b105b1524fcbafcb186ebf7e99
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify Blender
        run: blender --version | head -1 | grep -Fx 'Blender 5.3.0'
      - name: Update definitions and scan source
        run: |
          bash tools/security/clamav_scan_gate.sh update qa/security
          bash tools/security/clamav_scan_gate.sh scan tools/b2-render/build-watergate.py qa/security/stage1-source.log
      - name: Generate first checkpoint with actual Blender
        run: blender -b --disable-autoexec -t 2 --python tools/b2-render/build-watergate.py
      - name: QA and pack stage one
        env:
          COMMIT: ${{ github.sha }}
        run: |
          python3 tools/3d_checkpoint/render_qa.py --directory render-output/b2-watergate
          python3 tools/3d_checkpoint/checkpoint.py pack --directory render-output/b2-watergate --asset-id b2-watergate --iteration 1 --source-script tools/b2-render/build-watergate.py --source-commit "$COMMIT"
          python3 tools/3d_checkpoint/checkpoint.py verify --directory render-output/b2-watergate --asset-id b2-watergate --source-script tools/b2-render/build-watergate.py --source-commit "$COMMIT"
          bash tools/security/clamav_scan_gate.sh scan render-output/b2-watergate qa/security/stage1-output.log
      - name: DURABLE stage-one upload
        uses: actions/upload-artifact@v4
        with:
          name: stage-one-b2-watergate-NOT-APPROVED-${{ github.run_id }}
          path: render-output/b2-watergate/
          retention-days: 14
          if-no-files-found: error
  stage-two:
    needs: stage-one
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: ghcr.io/koda24-cell/kotama-blender53-clamav@sha256:5ce601f79b1ab09405b3ebc36b1a596be76cb8b105b1524fcbafcb186ebf7e99
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Intentional failure for external recovery drill
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.recovery_drill == true }}
        run: |
          echo 'RECOVERY_DRILL_EXPECTED_FAILURE: stage-one artifact is already uploaded'
          exit 1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: stage-one-b2-watergate-NOT-APPROVED-${{ github.run_id }}
          path: recovered
      - name: Verify and scan durable checkpoint
        env:
          COMMIT: ${{ github.sha }}
        run: |
          python3 tools/3d_checkpoint/checkpoint.py verify --directory recovered --asset-id b2-watergate --source-script tools/b2-render/build-watergate.py --source-commit "$COMMIT"
          bash tools/security/clamav_scan_gate.sh update qa/security
          bash tools/security/clamav_scan_gate.sh scan recovered qa/security/recovered.log
          bash tools/security/clamav_scan_gate.sh scan tools/3d_checkpoint/resume_watergate.py qa/security/script.log
      - name: Resume from durable stage boundary and rerender
        env:
          RESUME_BLEND: recovered/frozen_watergate_v09.blend
          RESUME_OUTPUT: render-output/b2-watergate-resumed
        run: blender -b --disable-autoexec -t 2 --python tools/3d_checkpoint/resume_watergate.py
      - name: QA, checkpoint, scan stage two
        env:
          COMMIT: ${{ github.sha }}
        run: |
          python3 tools/3d_checkpoint/render_qa.py --directory render-output/b2-watergate-resumed
          python3 tools/3d_checkpoint/checkpoint.py pack --directory render-output/b2-watergate-resumed --asset-id b2-watergate-resumed --iteration 2 --parent-checkpoint "stage-one-${{ github.run_id }}" --source-script tools/3d_checkpoint/resume_watergate.py --source-commit "$COMMIT"
          python3 tools/3d_checkpoint/checkpoint.py verify --directory render-output/b2-watergate-resumed --asset-id b2-watergate-resumed --source-script tools/3d_checkpoint/resume_watergate.py --source-commit "$COMMIT"
          bash tools/security/clamav_scan_gate.sh scan render-output/b2-watergate-resumed qa/security/stage2-output.log
      - name: DURABLE stage-two upload
        uses: actions/upload-artifact@v4
        with:
          name: stage-two-b2-watergate-NOT-APPROVED-${{ github.run_id }}
          path: render-output/b2-watergate-resumed/
          retention-days: 14
          if-no-files-found: error
