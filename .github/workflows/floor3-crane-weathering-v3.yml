name: Floor3 Crane V3 Weathering Compare
on:
  push:
    branches: [feature/floor3-crane-weathering-v3-20261114]
    paths:
      - 'tools/floor3/crane_props/**'
      - '.github/workflows/floor3-crane-weathering-v3.yml'
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          docker pull lscr.io/linuxserver/blender:latest
          docker run --rm -v "$GITHUB_WORKSPACE:/work" lscr.io/linuxserver/blender:latest blender -b -t 2 --python /work/tools/floor3/crane_props/build_v3.py
      - name: Verify original V1 V2 and V3 renders
        run: |
          for asset in cable_reel counterweight fallen_truss; do
            for version in "" _v2 _v3; do
              test -s "out/floor3_crane_${asset}${version}.glb"
              for view in front side angle; do
                test -s "out/floor3_crane_${asset}${version}-$view.png"
              done
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: floor3-crane-v1-v2-v3-weathering-compare
          path: out/
          retention-days: 14
