name: Gallery real Blender smoke
on:
  pull_request:
    paths: ['tools/3d-progress/**', '.github/workflows/gallery-blender-smoke.yml', '.github/workflows/shared-blender53-render.yml']
permissions:
  contents: read
  packages: read
jobs:
  smoke:
    uses: ./.github/workflows/shared-blender53-render.yml
    with:
      script: tools/3d-progress/gallery_blender_fixture.py
      output_dir: render-output/gallery-fixture
      artifact_suffix: '-fixture'
      gallery_spec: '{"id":"gallery-test-fixture","name":"Gallery test fixture","floor":"Test","version":"V01","kind":"render","publication_cleared":true,"images":[{"view":"front","file":"front.png"}]}'
