name: B5 Sallet V17 Walters Six-View Blender QA
on:
  push:
    branches: [feature/gpt-b5-knight-statues-v1-20261116]
    paths:
      - 'tools/b5-knights/build_sallet_v17.py'
      - '.github/workflows/b5-knight-sallet-v17-render.yml'
      - 'tools/b5-knights/textures/grime_imagegen_v15_256.webp.b64'
      - 'tools/b5-knights/textures/cracks_imagegen_v17_192.webp.b64'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender dependencies
        run: |
          if ! command -v blender >/dev/null 2>&1; then
            timeout 180 sudo apt-get update || echo "apt index update timeout; trying cached index"
            timeout 1200 sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -o Acquire::Retries=3 blender python3-numpy python3-pil
          else
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y python3-numpy python3-pil
          fi
          blender --version
      - name: Decode image-generated grime and inspect pixel dimensions / digest
        run: |
          /usr/bin/python3 - <<'PY'
          import base64,hashlib,io
          from pathlib import Path
          from PIL import Image
          src=Path('tools/b5-knights/textures/grime_imagegen_v15_256.webp.b64')
          raw=base64.b64decode(src.read_text().strip(),validate=True)
          actual=hashlib.sha256(raw).hexdigest()
          expected='7287744136ebb3c4e43854306131fd215bdc396fd9aaa57ae7c32099190d8a23'
          assert actual==expected, (actual,expected)
          out=Path('render-output/b5-knights')
          out.mkdir(parents=True,exist_ok=True)
          with Image.open(io.BytesIO(raw)) as image:
              image.load()
              assert image.size==(256,256),image.size
              image.convert('RGBA').save(out/'grime_source_v17.png')
          print('PASS: actual generated grime image decoded and staged',actual)
          PY
      - name: Decode selected source crack image and build localized detail mask
        run: |
          /usr/bin/python3 - <<'PY'
          import base64, hashlib, io
          from pathlib import Path
          from PIL import Image, ImageFilter, ImageChops
          src=Path('tools/b5-knights/textures/cracks_imagegen_v17_192.webp.b64')
          raw=base64.b64decode(src.read_text().strip(),validate=True)
          digest=hashlib.sha256(raw).hexdigest()
          assert digest=='b9560e690caebf216df9ccadd434dbe6e6dbbca5e8f5c085c8b4d4129ac2955c',digest
          im=Image.open(io.BytesIO(raw)).convert('RGB')
          assert im.size==(192,192),im.size
          out=Path('render-output/b5-knights')
          out.mkdir(parents=True,exist_ok=True)
          im.resize((256,256),Image.Resampling.LANCZOS).save(out/'cracks_source_v17.png')
          gray=im.convert('L').resize((256,256),Image.Resampling.LANCZOS)
          blurred=gray.filter(ImageFilter.GaussianBlur(4))
          # Extract fine dark fracture valleys, not entire metal plates or widespread rust.
          valleys=ImageChops.subtract(blurred,gray)
          detail=valleys.point(lambda v: max(0,min(255,(v-5)*12)))
          detail.convert('RGBA').save(out/'crack_detail_mask_v17.png')
          assert detail.getbbox() is not None
          print('PASS: source ImageGen crack pixels decoded / locally extracted; digest',digest)
          PY
      - name: Render 6 views and checkpoint original V17 Blender/GLB
        run: blender -b -t 2 --python-exit-code 1 --python tools/b5-knights/build_sallet_v17.py
      - name: Validate six real PNG and GLB meshes and hashes
        run: |
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageStat
          import json,hashlib,struct
          p=Path('render-output/b5-knights/sallet_v17')
          m=json.loads((p/'manifest.json').read_text())
          assert m['approval']=='NOT_APPROVED' and not m['game_integrated']
          assert m['source_sha'] and m['run_id']
          raw=(p/'sallet_v17.glb').read_bytes()
          assert raw[:4]==b'glTF' and struct.unpack_from('<I',raw,8)[0]==len(raw)
          n=struct.unpack_from('<I',raw,12)[0]
          doc=json.loads(raw[20:20+n])
          names=[q.get('name','') for q in doc['nodes'] if 'mesh' in q]
          for term in ('bowl','visor','rear forged lip','pivot'):
              assert any(term in x for x in names), (term,names)
          for filename,digest in m['files_sha256'].items():
              assert hashlib.sha256((p/filename).read_bytes()).hexdigest()==digest, filename
          assert len(m['views'])==6
          assert m['generated_grime_source_sha256']=='7287744136ebb3c4e43854306131fd215bdc396fd9aaa57ae7c32099190d8a23'
          assert (p/'grime_baked_albedo_v17.png').exists()
          assert (p/'grime_baked_roughness_v17.png').exists()
          assert m['crack_source_sha256']=='b9560e690caebf216df9ccadd434dbe6e6dbbca5e8f5c085c8b4d4129ac2955c'
          assert 140<m['crack_active_texels']<8000, m['crack_active_texels']
          for image_name in ('localized_cracks_albedo_v17.png','localized_cracks_roughness_v17.png','localized_cracks_mask_v17.png'):
              assert (p/image_name).exists(), image_name
          # Confirm unchanged V16 visor material remains a separate texture.
          assert any('visor untouched by cracks' in q.get('name','') for q in doc.get('materials',[]))

          # Ensure GLB truly has texture references, not just Blender-only nodes.
          assert doc.get('textures') and doc.get('images')
          metal=[q for q in doc.get('materials',[]) if 'steel crown' in q.get('name','')]
          assert metal and metal[0].get('pbrMetallicRoughness',{}).get('baseColorTexture')
          for view in ('front','left','right','back','angle','top'):
              with Image.open(p/(view+'.png')) as im:
                  im.load()
                  assert im.size==(800,800)
                  assert max(ImageStat.Stat(im.convert('RGB')).stddev)>5
          assert (p/'progress.json').exists()
          print('PASS actual V17 Blender 6-view PNG, GLB, Blend, SHA-256. NOT APPROVED')
          PY
      - name: Save temporary unapproved 3D checkpoint, even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b5-sallet-v17-walters-NOT-APPROVED
          path: render-output/b5-knights/sallet_v17/
          retention-days: 14
          if-no-files-found: warn
