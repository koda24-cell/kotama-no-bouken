name: Ore CC0 Download Verification
on:
  push:
    branches:
      - feature/gpt-ore-free-assets-intake-20261118
    paths:
      - 'tools/ore/intake_cc0_assets.py'
      - 'tools/ore/render_imported_boulder.py'
      - 'tools/ore/render_dense_crystal_boulder.py'
      - '.github/workflows/ore-cc0-download.yml'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Compile intake script
        run: python3 -m py_compile tools/ore/intake_cc0_assets.py
      - name: Download five CC0 assets
        run: |
          mkdir -p ore-cc0-review
          python3 tools/ore/intake_cc0_assets.py --out ore-cc0-review
      - name: Verify SHA256 and file signatures
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib, hashlib
          root=pathlib.Path("ore-cc0-review")
          p=root/"intake_manifest.json"
          assert p.is_file(), "missing manifest"
          data=json.loads(p.read_text())
          for a in data["assets"]:
              if a["state"]!="downloaded_unreviewed":continue
              assert a["downloads"], a["id"]
              for item in a["downloads"]:
                  f=root/item["file"]
                  assert f.is_file() and f.stat().st_size>1000, item["file"]
                  assert hashlib.sha256(f.read_bytes()).hexdigest()==item["sha256"], item["file"]
          print("downloaded",sum(a["state"]=="downloaded_unreviewed" for a in data["assets"]),"/",len(data["assets"]))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ore-cc0-download-review
          path: ore-cc0-review/
          retention-days: 14

  render-boulder:
    needs: download
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ore-cc0-download-review
          path: ore-cc0-review
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
          blender --version
      - name: Render original downloaded boulder mesh
        run: |
          mkdir -p ore-boulder-render
          blender -b -t 2 --python tools/ore/render_imported_boulder.py -- "$PWD/ore-cc0-review/boulder_01_mesh.blend" "$PWD/ore-boulder-render"
      - name: Validate actual three-view PNGs
        run: |
          python3 - <<'PY'
          import json,pathlib,hashlib
          root=pathlib.Path("ore-boulder-render")
          d=json.loads((root/"render_manifest.json").read_text())
          assert d["status"]=="NOT_APPROVED" and d["mesh_count"]>0
          assert set(d["files"])=={"front.png","side.png","angle.png"}
          for name,info in d["files"].items():
              b=(root/name).read_bytes()
              assert b.startswith(bytes([137,80,78,71,13,10,26,10]))
              assert hashlib.sha256(b).hexdigest()==info["sha256"]
          print("Verified actual Blender renders:",list(d["files"]))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ore-boulder-real-render-not-approved
          path: ore-boulder-render/
          retention-days: 14

  render-dense-ore:
    needs: download
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ore-cc0-download-review
          path: ore-cc0-review
      - name: Install Blender and NumPy
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          blender -b --python-expr 'import numpy; print(numpy.__version__)'
      - name: Render dense crystals on actual downloaded CC0 boulder
        run: |
          mkdir -p ore-dense-render
          blender -b -t 2 --python tools/ore/render_dense_crystal_boulder.py -- "$PWD/ore-cc0-review/boulder_01_mesh.blend" "$PWD/ore-dense-render"
      - name: Verify four PNGs, GLB, and unchanged source mesh count
        run: |
          python3 - <<'PY'
          import pathlib,json,hashlib
          p=pathlib.Path("ore-dense-render")
          m=json.loads((p/"manifest.json").read_text())
          assert m["status"]=="NOT_APPROVED"
          assert m["original_mesh_count"]>=1
          assert m["added_crystals"]==110
          assert {"front.png","side.png","angle.png","top.png","dense_crystal_on_original_boulder.glb"}==set(m["files"])
          for name,sha in m["files"].items():
              f=p/name
              assert f.is_file() and f.stat().st_size>1000
              assert hashlib.sha256(f.read_bytes()).hexdigest()==sha
          print("VERIFIED_DENSE_ORE",m)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ore-dense-crystal-original-boulder-not-approved
          path: ore-dense-render/
          retention-days: 14
      - name: Write run summary
        if: always()
        run: |
          echo "### Dense ore on original CC0 boulder" >> "$GITHUB_STEP_SUMMARY"
          echo "Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact: ore-dense-crystal-original-boulder-not-approved" >> "$GITHUB_STEP_SUMMARY"
          echo "Unapproved: do not integrate into game." >> "$GITHUB_STEP_SUMMARY"

  report-review:
    if: always()
    needs: [download, render-boulder, render-dense-ore]
    runs-on: ubuntu-latest
    steps:
      - name: Summarize job outcomes
        env:
          DOWNLOAD: ${{ needs.download.result }}
          BOULDER: ${{ needs.render-boulder.result }}
          DENSE: ${{ needs.render-dense-ore.result }}
        run: |
          {
            echo "## Ore CC0 and dense-crystal render status"
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| CC0 download | $DOWNLOAD |"
            echo "| Original boulder render | $BOULDER |"
            echo "| 110-crystal boulder render | $DENSE |"
            echo ""
            echo "Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "Unapproved artifacts only; review actual PNG/GLB."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Post or update run index on PR
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          DOWNLOAD: ${{ needs.download.result }}
          BOULDER: ${{ needs.render-boulder.result }}
          DENSE: ${{ needs.render-dense-ore.result }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const head = context.ref.replace('refs/heads/', '');
            const prs = await github.rest.pulls.list({owner, repo, state:'open', head: owner + ':' + head});
            if (!prs.data.length) { core.warning('No open PR for ' + head); return; }
            const marker = '<!-- ore-render-run-index -->';
            const status = [process.env.DOWNLOAD,process.env.BOULDER,process.env.DENSE];
            const body = [
              marker,
              '### Latest ore rendering run (automatically updated)',
              '**Run ID:** ' + context.runId,
              '**Commit:** ' + context.sha,
              '| Job | Result |', '|---|---|',
              '| CC0 download | ' + process.env.DOWNLOAD + ' |',
              '| Original boulder | ' + process.env.BOULDER + ' |',
              '| 110-crystal boulder | ' + process.env.DENSE + ' |',
              '',
              '[Open this run and its artifacts](https://github.com/' + owner + '/' + repo + '/actions/runs/' + context.runId + ')',
              'Artifact: `ore-dense-crystal-original-boulder-not-approved`',
              'This run is ' + (status.every(x => x === 'success') ? '**SUCCESS**' : '**NOT FULLY SUCCESSFUL**') + '.',
              'Generated assets remain **NOT_APPROVED**.'
            ].join('\\n');
            const issue_number = prs.data[0].number;
            const comments = await github.paginate(github.rest.issues.listComments, {owner,repo,issue_number,per_page:100});
            const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({owner,repo,comment_id:existing.id,body});
            } else {
              await github.rest.issues.createComment({owner,repo,issue_number,body});
            }
