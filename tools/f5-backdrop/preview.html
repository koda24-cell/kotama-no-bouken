<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>5層 360° 背景検証</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090516;color:#f0e9fa;font-family:system-ui,sans-serif}
canvas{display:block}#ui{position:fixed;top:12px;left:12px;background:#100c1bd9;border:1px solid #69547d;padding:14px;border-radius:10px;max-width:310px;z-index:2}
button{background:#49365f;color:white;border:1px solid #8c78a5;border-radius:5px;padding:7px;margin:2px;cursor:pointer}
small{display:block;color:#c2b3d5;margin-top:8px}#status{font-variant-numeric:tabular-nums}
</style></head><body>
<div id="ui"><strong>5層・360°背景 実験ビュー</strong><div id="status">準備中</div>
<div><button data-angle="0">北 0°</button><button data-angle="90">東 90°</button><button data-angle="180">南 180°</button><button data-angle="270">西 270°</button></div>
<div><button id="left">↶ 左回転</button><button id="right">右回転 ↷</button><button id="forward">前進 ↑</button><button id="reset">初期位置</button></div>
<small>ドラッグ: 見回す / WASD: 移動 / ←→: 回転。<br>背景は画面に固定されず、遠景と中景に視差が出ます。</small></div>
<script type="importmap">{"imports":{"three":"/three.module.js"}}</script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
import {createFloor5Backdrop} from './worldlocked-360-backdrop.mjs';
import {createOriginalB5FogRing} from './original-fog-ring.mjs';
import {createB5PathEdgeMist,createB5ArcaneSparks} from '../../field/b5-vfx-presets.js';
import {createAbyssBackdrop} from '../../field/assets/b5-abyss-backdrop.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x090516);
scene.fog=new THREE.FogExp2(0x2b1c3b,0.0015);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,0.1,1200);
camera.position.set(0,2,0);
scene.add(new THREE.HemisphereLight(0x8775ab,0x32243d,3.2));
const backdrop=createFloor5Backdrop(THREE,{seed:51119,radius:150,groundY:-14});
scene.add(backdrop.root);
// B5 art direction: no solid building facades, only distant irregular lights.
backdrop.buildings.visible=false;
const originalFog=await createOriginalB5FogRing(THREE,scene,{radius:145,height:88});
// V7: world-fixed emissive window clusters, independent of the faint fog atlas.
const windowGroup=new THREE.Group();windowGroup.name='B5_VISIBLE_DISTANT_WINDOWS';scene.add(windowGroup);
let ws=77519;const wr=()=>((ws=(Math.imul(ws,1664525)+1013904223)>>>0)/4294967296);
const windowGeo=new THREE.PlaneGeometry(1,1);
// V12: two-layer soft emission halo around windows, preserving their silhouettes.
const glowCanvas=document.createElement('canvas');glowCanvas.width=64;glowCanvas.height=64;
const gc=glowCanvas.getContext('2d'),gg=gc.createRadialGradient(32,32,1,32,32,32);
gg.addColorStop(0,'rgba(255,205,155,.72)');gg.addColorStop(.28,'rgba(238,143,192,.30)');gg.addColorStop(1,'rgba(150,65,155,0)');
gc.fillStyle=gg;gc.fillRect(0,0,64,64);
const glowTexture=new THREE.CanvasTexture(glowCanvas);
const glowMaterial=new THREE.MeshBasicMaterial({map:glowTexture,transparent:true,opacity:.18,depthWrite:false,side:THREE.DoubleSide,fog:false,blending:THREE.AdditiveBlending});
const frameMaterial=new THREE.MeshBasicMaterial({color:0x120f1c,transparent:true,opacity:.82,depthWrite:false,side:THREE.DoubleSide,fog:false});
const mullionMaterial=new THREE.MeshBasicMaterial({color:0x241a30,transparent:true,opacity:.8,depthWrite:false,side:THREE.DoubleSide,fog:false});
const windowMats=[new THREE.MeshBasicMaterial({color:0xb8795e,transparent:true,opacity:.72,depthWrite:false,side:THREE.DoubleSide,fog:false}),new THREE.MeshBasicMaterial({color:0x92547f,transparent:true,opacity:.64,depthWrite:false,side:THREE.DoubleSide,fog:false})];
const windows=[];
for(let face=0;face<4;face++)for(let patch=0;patch<28;patch++){
 const center=(wr()-.5)*265,base=-5+wr()*33,cols=4+Math.floor(wr()*11),rows=3+Math.floor(wr()*9),dx=1.65+wr()*2.1,dy=1.7+wr()*2.0;
 for(let row=0;row<rows;row++)for(let col=0;col<cols;col++){
  if(wr()<.56 || (col>cols*.5 && wr()<.35))continue;
  const offset=center+(col-cols/2)*dx, h=base+row*dy;
  const mesh=new THREE.Mesh(windowGeo,windowMats[wr()<.65?0:1]);
  mesh.position.set(face===1?143:face===3?-143:offset,h,face===0?-143:face===2?143:offset);
  mesh.rotation.y=face*Math.PI/2;
  mesh.scale.set(1.05+wr()*.9,1.25+wr()*1.2,1);
  const frame=new THREE.Mesh(windowGeo,frameMaterial);
  frame.position.copy(mesh.position);frame.rotation.copy(mesh.rotation);
  frame.scale.set(mesh.scale.x*1.2,mesh.scale.y*1.16,1);
  frame.position.x+=(face===1?.035:face===3?-.035:0);
  frame.position.z+=(face===0?-.035:face===2?.035:0);
  windowGroup.add(frame);
  const mullion=new THREE.Mesh(windowGeo,mullionMaterial);
  mullion.position.copy(mesh.position);mullion.rotation.copy(mesh.rotation);
  mullion.scale.set(mesh.scale.x*.09,mesh.scale.y,1);
  mullion.position.x+=(face===1?-.04:face===3?.04:0);
  mullion.position.z+=(face===0?.04:face===2?-.04:0);
  windowGroup.add(mullion);
  mesh.userData.frame=frame;mesh.userData.mullion=mullion;
  const glow=new THREE.Mesh(windowGeo,glowMaterial);
  glow.position.copy(mesh.position);glow.rotation.copy(mesh.rotation);
  glow.position.x+=(face===1?-.09:face===3?.09:0);
  glow.position.z+=(face===0?.09:face===2?-.09:0);
  glow.scale.set(mesh.scale.x*2.3,mesh.scale.y*2.2,1);
  windowGroup.add(glow);mesh.userData.glow=glow;
  mesh.userData.phase=wr()*6.28;mesh.userData.speed=.25+wr()*1.2;
  windowGroup.add(mesh);windows.push(mesh);
 }
}
const abyss=createAbyssBackdrop(THREE,scene,{starCount:340,rockCount:14});
const pathMist=createB5PathEdgeMist();scene.add(pathMist.mesh);
const sparks=createB5ArcaneSparks({count:72,seed:505});scene.add(sparks.points);
// Broad, softly feathered ground mist: irregular overlapping pools rather than a flat purple disc.
const mistCanvas=document.createElement('canvas');mistCanvas.width=128;mistCanvas.height=128;
const mc=mistCanvas.getContext('2d');const grad=mc.createRadialGradient(64,64,5,64,64,64);
grad.addColorStop(0,'rgba(155,78,178,.32)');grad.addColorStop(.45,'rgba(104,51,140,.19)');grad.addColorStop(1,'rgba(70,30,100,0)');
mc.fillStyle=grad;mc.fillRect(0,0,128,128);
const mistTexture=new THREE.CanvasTexture(mistCanvas);mistTexture.colorSpace=THREE.SRGBColorSpace;
const groundMist=new THREE.Group();scene.add(groundMist);
const mistMat=new THREE.MeshBasicMaterial({map:mistTexture,transparent:true,depthWrite:false,side:THREE.DoubleSide,fog:false});
for(let i=0;i<52;i++){const a=wr()*Math.PI*2,dist=6+wr()*145;
 const p=new THREE.Mesh(new THREE.PlaneGeometry(1,1),mistMat);p.rotation.x=-Math.PI/2;
 p.position.set(Math.cos(a)*dist,-.08+wr()*.12,Math.sin(a)*dist);
 p.scale.set(22+wr()*55,18+wr()*45,1);groundMist.add(p);
}
const floor=new THREE.Mesh(new THREE.CircleGeometry(280,128),new THREE.MeshStandardMaterial({color:0x3b2b4b,roughness:1}));
floor.rotation.x=-Math.PI/2;floor.position.y=-0.2;scene.add(floor);
// V6 diagnostic lighting only: retain original B5 fog and window shaders unchanged.
// Grid hidden in beauty renders: it is a debug-only aid, not part of B5 scenery.
let yaw=0,pitch=0,dragging=false,px=0,keys=new Set();
function renderView(){camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;backdrop.update(camera);originalFog.update(performance.now()/1000);pathMist.update(performance.now()/1000,camera);sparks.update(performance.now()/1000,camera.position);
document.querySelector('#status').textContent='方位 '+((yaw*180/Math.PI%360+360)%360).toFixed(0)+'° / 位置 X '+camera.position.x.toFixed(1)+' Z '+camera.position.z.toFixed(1);
for(const w of windows){w.visible=Math.sin(performance.now()*.001*w.userData.speed+w.userData.phase) > -.75;if(w.userData.glow)w.userData.glow.visible=w.visible;if(w.userData.frame)w.userData.frame.visible=w.visible;if(w.userData.mullion)w.userData.mullion.visible=w.visible;}
renderer.render(scene,camera)}
document.querySelectorAll('[data-angle]').forEach(b=>b.onclick=()=>{yaw=Number(b.dataset.angle)*Math.PI/180;renderView()});
document.querySelector('#left').onclick=()=>{yaw-=Math.PI/12;renderView()};
document.querySelector('#right').onclick=()=>{yaw+=Math.PI/12;renderView()};
document.querySelector('#forward').onclick=()=>{camera.position.x-=Math.sin(yaw)*3;camera.position.z-=Math.cos(yaw)*3;renderView()};
document.querySelector('#reset').onclick=()=>{camera.position.set(0,2,0);yaw=0;pitch=0;renderView()};
renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;px=e.clientX;renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener('pointerup',()=>dragging=false);
renderer.domElement.addEventListener('pointermove',e=>{if(!dragging)return;yaw-=(e.clientX-px)*.005;px=e.clientX;renderView()});
addEventListener('keydown',e=>{keys.add(e.key.toLowerCase());if(['arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault()});
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
let prev=performance.now();
function frame(now){const dt=Math.min((now-prev)/1000,.05);prev=now;
if(keys.has('arrowleft'))yaw+=dt*1.5;if(keys.has('arrowright'))yaw-=dt*1.5;
const dx=Number(keys.has('d'))-Number(keys.has('a')),dz=Number(keys.has('s'))-Number(keys.has('w'));
camera.position.x+=(Math.cos(yaw)*dx-Math.sin(yaw)*dz)*dt*9;
camera.position.z+=(-Math.sin(yaw)*dx-Math.cos(yaw)*dz)*dt*9;
renderView();requestAnimationFrame(frame)}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
requestAnimationFrame(frame);
</script></body></html>
