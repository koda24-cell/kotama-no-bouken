<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>F6 草原 V7 実GLB風の比較</title>
<style>html,body{margin:0;overflow:hidden;background:#c6daaf;color:#f7ffec;font:14px system-ui}canvas{display:block}#panel{position:absolute;left:12px;top:12px;z-index:2;background:#18301eda;padding:13px;border-radius:9px;max-width:300px}label,small{display:block;margin:7px 0}small{line-height:1.45}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script></head><body>
<div id="panel"><b>花園 V7 元GLB＋波状風試験</b>
<label><input id="wind" type="checkbox" checked> 風アニメON</label>
<label>風の強さ <input id="strength" type="range" min="0" max="2.2" step=".1" value="1"></label>
<small>元の草3200本＋下草440枚のGLBを読み込みます。形状・マテリアルは保持し、風の頂点変位だけ追加。既存ゲームには未統合です。</small>
<small id="status">V7 GLBを読み込み中...</small><small id="stats"></small></div>
<script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {enableV7MeadowWind} from './f6-v7-wind-adapter.mjs';
const scene=new THREE.Scene();scene.background=new THREE.Color(0xc6daaf);
scene.add(new THREE.HemisphereLight(0xcdfcd3,0x426343,0.7));
const sun=new THREE.DirectionalLight(0xffebbb,0.8);sun.position.set(-2,5,3);scene.add(sun);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.02,80);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=0.8;document.body.append(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
const status=document.getElementById('status');let controller=null;
new GLTFLoader().load('../../render-input/f6_meadow_floor_v1.glb',gltf=>{
 const root=gltf.scene;scene.add(root);
 try{controller=enableV7MeadowWind(root)}catch(e){status.textContent='GLB属性エラー: '+e.message;return;}
 const box=new THREE.Box3().setFromObject(root),center=box.getCenter(new THREE.Vector3());
 controls.target.copy(center);camera.position.copy(center).add(new THREE.Vector3(1.3,.75,1.65));controls.update();
 status.textContent='V7実GLB読込成功。草/下草メッシュ: '+controller.matched.length;
},undefined,e=>{status.textContent='GLB読込失敗: '+e.message;});
window.__kotamaRealF6={renderer,scene,camera};
const clock=new THREE.Clock();function frame(){requestAnimationFrame(frame);if(controller)controller.update(clock.getElapsedTime(),document.getElementById('wind').checked?Number(document.getElementById('strength').value):0);controls.update();renderer.render(scene,camera);document.getElementById('stats').textContent='Draw calls '+renderer.info.render.calls+', triangles '+renderer.info.render.triangles;}frame();
onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)};
</script></body></html>
