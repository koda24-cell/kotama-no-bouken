<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>コタマ / 水と草・研究技術プレビュー</title>
<style>html,body{margin:0;background:#102835;color:#ecfbff;font:14px system-ui;overflow:hidden}canvas{display:block}#ui{position:absolute;left:12px;top:12px;background:#0c2335dd;padding:14px;border-radius:9px;max-width:310px;z-index:2}select,input{margin:5px;color:#112636}label{display:block}small{display:block;line-height:1.5}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
</head><body><div id="ui"><b>水・草 表現技術の独立プレビュー</b><label>水の種類<select id="kind"><option value="lake">湖・静水</option><option value="stream">水路</option><option value="waterfall">滝（動水の材質試作）</option></select></label><label>品質<select id="quality"><option value="high">高</option><option value="medium">中</option><option value="low">低</option></select></label><label><input id="wind" type="checkbox" checked>草の波状風を動かす</label><small>ドラッグで回転、ホイールで拡大。<br>水底深度・岸との交差泡・反射・現行GLBは未接続。滝は材質挙動のみの検証です。</small><small id="status">WebGL起動中...</small></div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {createKotamaWaterMaterial,updateKotamaWater} from './water-surface.mjs';
import {MEADOW_WIND_GLSL} from '../floor6/meadow-wind-field.mjs';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x183746);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,100);camera.position.set(5,5,8);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.append(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xa8dfea,0x293d36,2));
const sun=new THREE.DirectionalLight(0xffedc8,2.5);sun.position.set(-3,8,2);scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(10,10),new THREE.MeshStandardMaterial({color:0x55765c,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.2;scene.add(ground);
let waterMat=createKotamaWaterMaterial('lake');const water=new THREE.Mesh(new THREE.PlaneGeometry(5,5),waterMat);water.rotation.x=-Math.PI/2;water.position.y=.015;scene.add(water);
const grassGeo=new THREE.BufferGeometry(),vertices=[],uvs=[],height=[],phase=[],indices=[];
for(let k=0;k<850;k++){const cx=(Math.random()-.5)*9,cz=(Math.random()-.5)*9;if(Math.abs(cx)<2.7&&Math.abs(cz)<2.7)continue;const h=.20+Math.random()*.35,ang=Math.random()*6.283,w=.018;const i=vertices.length/3;const dirX=Math.cos(ang),dirZ=Math.sin(ang);
for(let j=0;j<4;j++){const t=j/3;for(const s of [-1,1]){vertices.push(cx+dirX*t*t*.13+s*(-dirZ)*w*(1-t),-.2+h*t,cz+dirZ*t*t*.13+s*dirX*w*(1-t));uvs.push((s+1)/2,t);height.push(t);phase.push(k*.618);}}for(let j=0;j<3;j++){indices.push(i+j*2,i+j*2+1,i+j*2+2,i+j*2+1,i+j*2+3,i+j*2+2);}}
grassGeo.setAttribute('position',new THREE.Float32BufferAttribute(vertices,3));grassGeo.setAttribute('uv',new THREE.Float32BufferAttribute(uvs,2));grassGeo.setAttribute('aHeight',new THREE.Float32BufferAttribute(height,1));grassGeo.setAttribute('aPhase',new THREE.Float32BufferAttribute(phase,1));grassGeo.setIndex(indices);grassGeo.computeVertexNormals();
const grassMat=new THREE.ShaderMaterial({side:THREE.DoubleSide,uniforms:{uTime:{value:0},uWind:{value:1},uDir:{value:new THREE.Vector2(Math.cos(32*Math.PI/180),Math.sin(32*Math.PI/180))}},
vertexShader:`uniform float uTime,uWind;uniform vec2 uDir;attribute float aHeight,aPhase;varying float vH;${MEADOW_WIND_GLSL}void main(){vH=aHeight;vec4 wp=modelMatrix*vec4(position,1.);vec2 offset=kotamaMeadowWind(wp.xz,aHeight,uTime,aPhase,1.0,uDir);wp.xz+=offset*uWind;gl_Position=projectionMatrix*viewMatrix*wp;}`,
fragmentShader:`precision highp float;varying float vH;void main(){vec3 green=mix(vec3(.17,.31,.10),vec3(.65,.80,.32),smoothstep(0.,1.,vH));gl_FragColor=vec4(green,1.);#include <tonemapping_fragment>
#include <colorspace_fragment>` } );
const grass=new THREE.Mesh(grassGeo,grassMat);grass.frustumCulled=false;scene.add(grass);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,0,0);
document.getElementById('kind').onchange=e=>{const old=waterMat;waterMat=createKotamaWaterMaterial(e.target.value);water.material=waterMat;old.dispose();};
document.getElementById('status').textContent='起動済み（独立した生成草と水面）';
const clock=new THREE.Clock();function frame(){requestAnimationFrame(frame);let t=clock.getElapsedTime();updateKotamaWater(waterMat,t,document.getElementById('quality').value);grassMat.uniforms.uTime.value=t;grassMat.uniforms.uWind.value=document.getElementById('wind').checked?1:0;controls.update();renderer.render(scene,camera);}frame();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></body></html>
