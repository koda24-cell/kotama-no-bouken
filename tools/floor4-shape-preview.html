<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第4階層 造形プレビュー</title>
<style>body{margin:0;background:#101114;color:#eee;font:14px system-ui}header{padding:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}select,button{background:#292c32;color:white;border:1px solid #555;padding:8px}#view{width:100vw;height:calc(100vh - 112px);display:block}#status{padding:8px}label{display:flex;gap:5px;align-items:center}</style></head>
<body><header><strong>第4階層｜既存GLB形状確認</strong><select id="model">
<option value="floor4_dragonfire_environment_v1.glb">環境モデル</option>
<option value="floor4_gothic_fortress_addon_v1.glb">要塞追加モデル</option>
<option value="floor4_corrupted_barrier_v1.glb">障害物</option>
<option value="floor4_lavafall_ember_fx_seed_v1.glb">溶岩滝</option>
</select><select id="part"><option value="">モデル全体</option></select><button id="front">正面</button><button id="side">側面</button><button id="angle">斜め</button><button id="shot">PNGスクショ</button><label><input id="wire" type="checkbox">ワイヤー表示</label></header><canvas id="view"></canvas><div id="status">読み込み中…</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const canvas=document.querySelector('#view'),renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0x202126);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x202126);
scene.add(new THREE.HemisphereLight(0xffffff,0x555566,2));
const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(4,8,6);scene.add(light);
const camera=new THREE.PerspectiveCamera(40,1,.01,2000),controls=new OrbitControls(camera,canvas);controls.enableDamping=true;
let root=null,selected=null;const material=new THREE.MeshStandardMaterial({color:0xb7b7b7,roughness:0.88,side:THREE.DoubleSide});
const base='../assets/3d/dungeons/b4_dragonfire/models/';
const part=document.querySelector('#part'),status=document.querySelector('#status');
function focus(obj,view='angle'){const box=new THREE.Box3().setFromObject(obj);if(box.isEmpty())return;const c=box.getCenter(new THREE.Vector3()),s=box.getSize(new THREE.Vector3());const r=Math.max(s.length(),.1)*1.3;const d=view==='front'?new THREE.Vector3(0,.25,1):view==='side'?new THREE.Vector3(1,.25,0):new THREE.Vector3(1,.7,1);camera.position.copy(c).add(d.normalize().multiplyScalar(r));controls.target.copy(c);camera.near=Math.max(.001,r/10000);camera.far=r*100;camera.updateProjectionMatrix();controls.update();}
function showPart(){if(!root)return;root.traverse(o=>{if(o.isMesh)o.visible=true});selected=part.value?root.getObjectByProperty('uuid',part.value):root;if(part.value){root.traverse(o=>{if(o.isMesh)o.visible=o===selected||!!selected.getObjectByProperty('uuid',o.uuid)});}focus(selected);}
function load(){status.textContent='GLBを読み込み中…';if(root)scene.remove(root);part.innerHTML='<option value="">モデル全体</option>';new GLTFLoader().load(base+document.querySelector('#model').value,g=>{root=g.scene;root.traverse(o=>{if(o.isMesh){o.material=material.clone();const opt=document.createElement('option');opt.value=o.uuid;opt.textContent=o.name||'mesh '+part.options.length;part.append(opt);}});scene.add(root);selected=root;focus(root);status.textContent='読み込み完了：'+(part.options.length-1)+' メッシュ。マウスで回転・拡大できます。';},undefined,e=>{status.textContent='読み込み失敗：'+e.message+'。GitHub PagesまたはローカルHTTPサーバーから開いてください。';});}
document.querySelector('#model').onchange=load;part.onchange=showPart;
for(const v of ['front','side','angle'])document.getElementById(v).onclick=()=>focus(selected||root,v);
document.querySelector('#wire').onchange=e=>root?.traverse(o=>{if(o.isMesh)o.material.wireframe=e.target.checked;});
document.querySelector('#shot').onclick=()=>{renderer.render(scene,camera);const a=document.createElement('a');a.download='floor4-'+document.querySelector('#model').value.replace('.glb','')+'-'+(part.selectedOptions[0]?.textContent||'all').replace(/[^\w\-]/g,'_')+'.png';a.href=canvas.toDataURL('image/png');a.click();};
function frame(){requestAnimationFrame(frame);const w=canvas.clientWidth,h=canvas.clientHeight;if(canvas.width!==Math.round(w*renderer.getPixelRatio())||canvas.height!==Math.round(h*renderer.getPixelRatio())){renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}controls.update();renderer.render(scene,camera);}load();frame();
</script></body></html>
