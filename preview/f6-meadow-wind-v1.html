<!doctype html><html lang="ja"><meta charset="utf-8"><title>F6 Meadow Wind Preview</title><style>body{margin:0;background:#162719;color:white;font:14px sans-serif}aside{position:absolute;top:16px;left:16px;background:#10231bdc;padding:12px;border-radius:8px}</style><aside>第6層・風の草原 V1<br>風の強さ <input id="power" type="range" min="0" max="2" step=".1" value="1"><br>風の速さ <input id="speed" type="range" min="0" max="3" step=".1" value="1"></aside><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0xacc5a5);const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.01,50);camera.position.set(2.5,2,3);camera.lookAt(0,0,0);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(3,3),new THREE.MeshBasicMaterial({color:0x526b30}));floor.rotation.x=-Math.PI/2;scene.add(floor);
let seed=6142;const rnd=()=>((seed=(1664525*seed+1013904223)>>>0)/4294967296);const v=[],c=[],h=[],idx=[];const colors=[0x2b6828,0x49862d,0x77a442,0x9bab4b];
for(let i=0;i<9000;i++){const x=(rnd()-.5)*3,z=(rnd()-.5)*3,ht=.06+rnd()*.21,theta=rnd()*Math.PI*2,bend=.015+rnd()*.09,width=.005+rnd()*.01,col=new THREE.Color(colors[Math.floor(rnd()*4)]),base=v.length/3;for(let j=0;j<6;j++){const t=j/5;for(const q of [-1,1]){v.push(x+Math.cos(theta)*bend*t*t-q*Math.sin(theta)*width*(1-t),ht*(t-.13*t*t),z+Math.sin(theta)*bend*t*t+q*Math.cos(theta)*width*(1-t));c.push(col.r,col.g,col.b);h.push(t)}}for(let j=0;j<5;j++){const a=base+j*2;idx.push(a,a+1,a+2,a+1,a+3,a+2)}}
const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(v,3));g.setAttribute('color',new THREE.Float32BufferAttribute(c,3));g.setAttribute('heightRatio',new THREE.Float32BufferAttribute(h,1));g.setIndex(idx);
const uniforms={time:{value:0},power:{value:1},speed:{value:1}};const m=new THREE.ShaderMaterial({uniforms,side:THREE.DoubleSide,vertexColors:true,vertexShader:'attribute float heightRatio;varying vec3 shade;uniform float time,power,speed;void main(){shade=color;vec3 p=position;float phase=p.x*3.2+p.z*1.3-time*speed*1.8;float wave=0.5+0.5*sin(phase)+0.2*sin(phase*2.4+p.z*2.);float offset=wave*power*0.13*pow(heightRatio,1.8);p.x+=offset;p.z+=offset*.25;gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.);}',fragmentShader:'varying vec3 shade;void main(){gl_FragColor=vec4(shade,1.);}'});
scene.add(new THREE.Mesh(g,m));const clock=new THREE.Clock();function tick(){requestAnimationFrame(tick);uniforms.time.value=clock.getElapsedTime();uniforms.power.value=+document.getElementById('power').value;uniforms.speed.value=+document.getElementById('speed').value;renderer.render(scene,camera)}tick();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></html>
