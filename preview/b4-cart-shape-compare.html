<!doctype html><html lang="ja"><meta charset="utf-8"><title>B4 小物 造形比較</title><style>body{background:#17181b;color:white;font:14px sans-serif;margin:0}header{padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button{padding:8px}canvas{display:block;width:100%;height:calc(100vh - 75px)}</style><header><strong>第4階層 小物・造形比較</strong><button id="before">既存モデル</button><button id="after">追加造形</button><button id="front">正面</button><button id="side">側面</button><button id="png">スクショPNG</button><span id="state"></span></header><canvas id="canvas"></canvas><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script><script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {createB4MineRigProps} from '../field/b4-mine-rig-props.js';import {enhanceB4MineCart} from '../field/b4-cart-detail-additions.js';
const canvas=document.querySelector('canvas'),renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));const scene=new THREE.Scene();scene.background=new THREE.Color('#27282c');scene.add(new THREE.HemisphereLight(0xffffff,0x555555,2));const l=new THREE.DirectionalLight(0xffffff,3);l.position.set(3,6,5);scene.add(l);const camera=new THREE.PerspectiveCamera(42,1,.01,500);const orbit=new OrbitControls(camera,canvas);orbit.enableDamping=true;
const root=createB4MineRigProps();enhanceB4MineCart(root);const cart=root.getObjectByName('b4:buried-ore-cart');scene.add(cart);const addition=cart.getObjectByName('b4:cart-detail-additions');const clay=new THREE.MeshStandardMaterial({color:0xb7b8b9,roughness:.86,side:THREE.DoubleSide});cart.traverse(o=>{if(o.isMesh)o.material=clay.clone()});function aim(v){const bounds=new THREE.Box3().setFromObject(cart),center=bounds.getCenter(new THREE.Vector3()),size=bounds.getSize(new THREE.Vector3()).length();orbit.target.copy(center);camera.position.copy(center).add(new THREE.Vector3(...v).normalize().multiplyScalar(size*1.25));orbit.update()}aim([1,.65,1]);document.querySelector('#before').onclick=()=>{addition.visible=false;document.querySelector('#state').textContent='既存形状'};document.querySelector('#after').onclick=()=>{addition.visible=true;document.querySelector('#state').textContent='追加造形あり'};document.querySelector('#front').onclick=()=>aim([0,.15,1]);document.querySelector('#side').onclick=()=>aim([1,.15,0]);document.querySelector('#png').onclick=()=>{renderer.render(scene,camera);const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='b4-cart-'+(addition.visible?'after':'before')+'.png';a.click()};function frame(){requestAnimationFrame(frame);const w=canvas.clientWidth,h=canvas.clientHeight;if(canvas.width!==Math.round(w*renderer.getPixelRatio())||canvas.height!==Math.round(h*renderer.getPixelRatio())){renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}orbit.update();renderer.render(scene,camera)}frame();</script></html>
