<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第4階層 城塞3Dプレビュー</title><style>html,body{margin:0;height:100%;background:#13090b;color:#fff;font:14px sans-serif}canvas{display:block}#ui{position:absolute;left:16px;top:12px;background:#13090bcc;padding:12px;border:1px solid #79412a;border-radius:8px}button{padding:8px;background:#642b20;color:white;border:1px solid #b85c3b;border-radius:5px;cursor:pointer}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script></head><body><div id="ui"><b>第4階層・城塞の試作</b><p>ドラッグ：回転 / ホイール：ズーム</p><button id="reset">視点を戻す</button><p>※探索マップとは別の造形確認用です</p></div><script type="module">import * as THREE from 'three';import{addB4FortressSkyline}from '../field/b4-fortress-skyline.js';import{addB4CitadelBackdrop}from '../field/b4-citadel-backdrop.js';const scene=new THREE.Scene();scene.background=new THREE.Color(0x190907);scene.fog=new THREE.FogExp2(0x32130f,.012);const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,400);camera.position.set(28,26,45);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffa276,0x211526,2));const sun=new THREE.DirectionalLight(0xff7034,2);sun.position.set(5,20,4);scene.add(sun);const root=new THREE.Group();scene.add(root);const stone=new THREE.MeshStandardMaterial({color:0x2d262a,roughness:1}),lava=new THREE.MeshStandardMaterial({color:0xff4212,emissive:0xd52700,emissiveIntensity:1.5});const ground=new THREE.Mesh(new THREE.BoxGeometry(52,.7,52),stone);ground.position.y=-.5;root.add(ground);for(let i=0;i<4;i++){const river=new THREE.Mesh(new THREE.BoxGeometry(2,.05,50),lava);river.position.set(-21+i*13,-.09,0);root.add(river);}const map={w:13,h:13,objects:[]};const hash=(x,y,n)=>((Math.sin(x*127.1+y*311.7+n*74.7)*43758.5453)%1+1)%1;const wallCell=(x,y)=>x<0||y<0||x>=13||y>=13||x===0||y===0||x===12||y===12||((x+y)%5===0);addB4FortressSkyline({root,area:4,map,wallCell,hash,cellSize:4,objects:[]});addB4CitadelBackdrop({root,area:4,map,cellSize:4});let yaw=.6,pitch=.42,dist=65,drag=false,px=0,py=0;const reset=()=>{yaw=.6;pitch=.42;dist=65};document.getElementById('reset').onclick=reset;renderer.domElement.onpointerdown=e=>{drag=true;px=e.clientX;py=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)};renderer.domElement.onpointerup=()=>drag=false;renderer.domElement.onpointermove=e=>{if(!drag)return;yaw+=(e.clientX-px)*.006;pitch=Math.max(.12,Math.min(1.4,pitch+(e.clientY-py)*.006));px=e.clientX;py=e.clientY};renderer.domElement.onwheel=e=>{dist=Math.max(15,Math.min(120,dist+e.deltaY*.03))};window.onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)};function frame(){requestAnimationFrame(frame);camera.position.set(24+Math.sin(yaw)*dist*Math.cos(pitch),Math.sin(pitch)*dist,24+Math.cos(yaw)*dist*Math.cos(pitch));camera.lookAt(24,2,24);renderer.render(scene,camera)}frame();</script></body></html>
