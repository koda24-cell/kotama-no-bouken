<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>苔むす封祠｜実ゲーム試験</title><style>
*{box-sizing:border-box}body{margin:0;background:#111b16;color:#e1e9da;font:14px/1.5 system-ui,sans-serif}header{padding:12px 18px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #46563e}h1{font-size:17px;margin:0}p{margin:2px 0;color:#b7c7af;font-size:12px}a{color:#d7e4bd}button{background:#344c30;color:#edf0e5;border:1px solid #758265;padding:8px 14px;cursor:pointer}iframe{border:0;width:100%;height:calc(100dvh - 100px);min-height:550px;display:block}#status{font-size:12px;color:#d5ca95}header>div:first-child{flex:1}</style></head><body>
<header><div><h1>第一層「苔むす封祠」V5 改修試験版</h1><p>1Fから3Fへ、苔・石組み・祭祀遺構が深くなる改修を確認できます。通常セーブは読み書きしません。再読み込みで試験中の進行はリセットされます。</p><p>前進・後退：↑↓ / W・S　向き：←→ / A・D　横移動：Q・E　調べる：Z / Enter</p></div><nav><a href="?floor=0">1F</a> ／ <a href="?floor=1">2F</a> ／ <a href="?floor=2">3F</a></nav><span id="status">ゲームを準備中…</span><button id="restart">試験をやり直す</button></header><iframe id="game" title="通常セーブから独立した実ゲーム試験" allow="autoplay"></iframe>
<script type="module">
const frame=document.getElementById('game'),status=document.getElementById('status');
async function start(){
 status.textContent='ゲームを準備中…';
 try{
  const root=new URL('../',location.href),response=await fetch(new URL('index.html',root),{cache:'no-store'});if(!response.ok)throw new Error('ゲームの取得に失敗しました');
  const requested=Number(new URLSearchParams(location.search).get('floor')??2),floor=Number.isInteger(requested)&&requested>=0&&requested<=2?requested:2;
  const html=await response.text();const injected='<base href="'+root.href+'"><scr'+'ipt>window.KotamaSacredPlaytestStartFloor='+floor+';</scr'+'ipt><scr'+'ipt src="'+new URL('field/f1-sacred-playtest-entry.js',root).href+'"></scr'+'ipt>';
  frame.srcdoc=html.replace(/<head(?:\s[^>]*)?>/i,head=>head+injected);
 }catch(error){status.textContent=error.message;}
}
document.getElementById('restart').onclick=start;
setInterval(()=>{try{const w=frame.contentWindow;if(w.KotamaSacredPlaytestError){status.textContent=w.KotamaSacredPlaytestError;return;}const info=w.KotamaField3D?.sacredTrialInfo()??w.KotamaField3D?.gameReviewState()?.firstLayerProgressionInfo;if(info?.sourceHashesVerified){status.textContent='試験表示中・通常セーブへの保存なし';}else if(info?.fallbackReason){status.textContent='試験表示を読めず従来表示に戻りました';}}catch(_){}},500);
start();
</script></body></html>
