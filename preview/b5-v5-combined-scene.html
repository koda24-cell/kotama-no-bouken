<!doctype html><html lang="ja"><meta charset="utf-8"><title>B5 combined VFX scene verification</title><style>body{margin:0;background:#050514}canvas{display:block}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js"}}</script><script type="module">
import * as THREE from 'three';
import {createB5DistantFogBackground} from '../field/b5-distant-fog-background.js';
import {createB5ArcaneSparks} from '../field/b5-vfx-presets.js';
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(1100,620);renderer.setPixelRatio(1);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.35;document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x050514);scene.fog=new THREE.FogExp2(0x10102a,.022);
const camera=new THREE.PerspectiveCamera(68,1100/620,.05,180);camera.position.set(0,2.0,0);camera.lookAt(0,2.2,-12);
scene.add(new THREE.HemisphereLight(0x7779d7,0x14132e,1.35));
const light=new THREE.PointLight(0x9955ee,12,30);light.position.set(0,5,-9);scene.add(light);
const stone=new THREE.MeshStandardMaterial({color:0x302a42,roughness:.92});
const trim=new THREE.MeshStandardMaterial({color:0x4a3b60,roughness:.75});
function box(w,h,d,x,y,z,m=stone){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);scene.add(o);return o;}
box(13,.35,32,0,-.2,-13);
for(const side of [-1,1]){for(let k=0;k<4;k++){const z=-5-k*7;box(1.4,6.5,1.5,side*5.2,3.25,z);box(2.2,.5,2.3,side*5.2,6.45,z,trim);box(.45,1.6,.6,side*4.7,4.2,z+.2,trim);}}
for(let k=0;k<6;k++){const z=-4-k*4.5;box(.15,.08,12,0,.04,z,trim);}
let texture=null;try{texture=await new THREE.TextureLoader().loadAsync('../field/assets/b5-distant/facade020c-windows.png');texture.colorSpace=THREE.SRGBColorSpace;document.body.dataset.windowSource='cc0';}catch(e){document.body.dataset.windowSource='procedural';}
const fog=createB5DistantFogBackground({width:230,height:135,windowTexture:texture});
fog.mesh.position.set(0,2,-90);scene.add(fog.mesh);
const sparks=createB5ArcaneSparks({count:42});scene.add(sparks.points);
let start=performance.now();function frame(t){fog.update((t-start)/1000);sparks.update((t-start)/1000,camera.position);renderer.render(scene,camera);requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
