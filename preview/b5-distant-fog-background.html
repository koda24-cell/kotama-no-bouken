<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第5階層・紫の瘴気遠景</title><style>body{margin:0;background:#090711;color:#e9ddea;font:16px system-ui}main{max-width:1100px;margin:auto;padding:20px}canvas{display:block;width:100%;height:60vh;min-height:300px;border:1px solid #4d294c;border-radius:12px}p{line-height:1.7}button{background:#3e244e;color:white;border:1px solid #9b658e;border-radius:6px;padding:8px 16px;cursor:pointer}</style></head><body><main><h1>第5階層・遠景の紫の瘴気</h1><p>ビルの輪郭は描かず、窓の光だけを残した遠景。3層相当の時間変化するノイズ霧。ゲーム未統合の独立プレビューです。</p><div id="scene"></div><p><button id="toggle">アニメーション停止</button>　窓の明かり＋紫の霧＋暗赤色の亀裂</p></main><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js"}}</script><script type="module">
import * as THREE from 'three';import {createB5DistantFogBackground} from '../field/b5-distant-fog-background.js';
const host=document.querySelector('#scene');const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(host.clientWidth,Math.max(300,innerHeight*.6));host.appendChild(renderer.domElement);const scene=new THREE.Scene();const camera=new THREE.OrthographicCamera(-12,12,6,-6,.1,100);camera.position.z=10;let windowTexture=null;try{windowTexture=await new THREE.TextureLoader().loadAsync('../field/assets/b5-distant/facade020c-windows.png');windowTexture.colorSpace=THREE.SRGBColorSpace;windowTexture.wrapS=windowTexture.wrapT=THREE.RepeatWrapping;document.body.dataset.windowSource='ambientcg-facade020c';}catch(e){console.warn('Real windows unavailable, procedural fallback',e.message);document.body.dataset.windowSource='procedural-fallback';}const backdrop=createB5DistantFogBackground({windowTexture});scene.add(backdrop.mesh);let running=true,t=0,prev=performance.now();document.querySelector('#toggle').onclick=()=>{running=!running;document.querySelector('#toggle').textContent=running?'アニメーション停止':'アニメーション再開';};function frame(now){const dt=Math.min((now-prev)/1000,.1);prev=now;if(running)t+=dt;backdrop.update(t);renderer.render(scene,camera);requestAnimationFrame(frame);}requestAnimationFrame(frame);addEventListener('resize',()=>{const w=host.clientWidth,h=Math.max(300,innerHeight*.6);renderer.setSize(w,h);camera.left=-12;camera.right=12;camera.top=12*h/w;camera.bottom=-12*h/w;camera.updateProjectionMatrix();});
</script></body></html>
