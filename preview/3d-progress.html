<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>コタマ | 3D制作進捗</title><style>
*{box-sizing:border-box}body{margin:0;background:#10151c;color:#e9eef5;font:16px system-ui,sans-serif}main{max-width:1400px;margin:auto;padding:28px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}h1{margin:0;font-size:28px}p{color:#a8b6c7}button,select{background:#243346;color:white;border:1px solid #50647c;border-radius:8px;padding:12px;font:inherit;cursor:pointer}button:disabled{opacity:.5}#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px;margin-top:24px}article{background:#1a222e;border:1px solid #344154;border-radius:12px;overflow:hidden;padding:14px}img{width:100%;aspect-ratio:16/10;object-fit:contain;background:#293442;border-radius:6px}a{color:#9ccaff}h2{font-size:19px}small{color:#a8b6c7}nav{display:flex;gap:12px;flex-wrap:wrap}dialog{background:#17202b;color:white;border:1px solid #50647c;max-width:95vw}dialog img{max-height:75vh;width:auto;max-width:85vw;aspect-ratio:auto}
</style><main><header><div><small>KOTAMA / 3D ASSET STUDIO</small><h1>3D制作進捗</h1></div><button id="refresh">↻ 最新情報に更新</button></header><p id="status" role="status" aria-live="polite">取得準備中</p><nav><select id="floor"><option value="">すべての階層</option><option>第1層</option><option>第2層</option><option>第3層</option><option>第4層</option><option>第5層</option><option>第6層</option><option>キャラクター</option><option>その他</option></select><select id="kind"><option value="">全画像</option><option value="render">レンダリング</option><option value="design">設計図</option></select></nav><section id="grid"></section></main><dialog id="zoom"><button id="close">閉じる</button><div id="large"></div></dialog><script>
const $=id=>document.getElementById(id), repo='koda24-cell/kotama-no-bouken', base='https://raw.githubusercontent.com/'+repo+'/3d-progress-data/';let records=[];const mergeCache=new Map();
async function mergeStatus(x,node){try{if(!/^[0-9a-f]{40}$/.test(x.source_sha))return;let state=mergeCache.get(x.source_sha);if(!state){const res=await fetch('https://api.github.com/repos/'+repo+'/compare/'+x.source_sha+'...development',{cache:'no-store'});if(!res.ok)throw Error('compare');const d=await res.json();state=['ahead','identical'].includes(d.status)?'development反映済み':['behind','diverged'].includes(d.status)?'未マージ（元コミット）':'確認不能';mergeCache.set(x.source_sha,state)}node.textContent=state}catch(e){node.textContent='マージ状況：確認不能'}}
function el(tag,value){const n=document.createElement(tag);if(value!==undefined)n.textContent=value;return n}
function draw(){const grid=$('grid');grid.replaceChildren();const rows=records.filter(x=>!$('floor').value||x.floor===$('floor').value);for(const x of rows){const card=el('article');card.append(el('h2',x.name),el('p',x.floor+' / '+x.version+' / '+x.status),el('small',x.updated_at));const merge=el('p','マージ状況：確認中');merge.style.fontWeight='bold';card.append(merge);mergeStatus(x,merge);for(const [kind,items] of [["render",x.images],["design",x.designs||[]]]){if($("kind").value&&$("kind").value!==kind)continue;card.append(el("h3",(kind==="design"?"設計図":"レンダリング")+" "+(x[kind+"_version"]||"")));if(!items.length)card.append(el("p","未取得"));for(const v of items){const url=base+v.path.split('/').map(encodeURIComponent).join('/')+'?v='+encodeURIComponent(x.updated_at);const a=el('button',v.view+'・拡大');const img=el('img');img.src=url;img.alt=x.name+' '+v.view;img.loading='lazy';img.onerror=()=>{img.alt='画像取得失敗: '+v.view};a.onclick=()=>{const full=el('img');full.src=url;full.alt=img.alt;$('large').replaceChildren(full);$('zoom').showModal()};card.append(img,a)}}if(Number.isSafeInteger(x.run_id)){const link=el('a',' Actions実行記録');link.href='https://github.com/'+repo+'/actions/runs/'+x.run_id;card.append(link)}grid.append(card)}if(!rows.length)grid.append(el('p','表示できる登録済みモデルはありません。'))}
function valid(x){return x&&typeof x.id==='string'&&typeof x.name==='string'&&typeof x.floor==='string'&&typeof x.version==='string'&&typeof x.status==='string'&&typeof x.updated_at==='string'&&Array.isArray(x.images)&&(x.images.length||(x.designs||[]).length)&&[...x.images,...(x.designs||[])].every(v=>typeof v.view==='string'&&typeof v.path==='string'&&/^renders\/[a-zA-Z0-9_./-]+\.png$/.test(v.path)&&!v.path.split('/').includes('..'))}
async function refresh(){mergeCache.clear();$('refresh').disabled=true;$('status').textContent='最新情報を取得中…';try{const res=await fetch(base+'index.json?t='+Date.now(),{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);const data=await res.json();if(!Array.isArray(data.models)||!data.models.every(valid))throw Error('台帳形式エラー');records=data.models.sort((a,b)=>b.updated_at.localeCompare(a.updated_at));draw();$('status').textContent=records.length+' モデル / 確認 '+new Date().toLocaleString('ja-JP')}catch(e){$('status').textContent='更新できませんでした。前回の表示を保持します。 '+e.message}finally{$('refresh').disabled=false}}
$('refresh').onclick=refresh;$('floor').onchange=draw;$('kind').onchange=draw;$('close').onclick=()=>$('zoom').close();refresh();
</script></html>
