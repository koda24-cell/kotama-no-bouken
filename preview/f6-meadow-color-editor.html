<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D草原 カラー調整</title><style>body{margin:0;background:#141d17;color:#edf5e8;font:15px system-ui,sans-serif}main{max-width:850px;margin:auto;padding:24px}h1{font-size:24px}p{color:#b9c9b8}section{background:#243328;padding:20px;border-radius:14px;margin:14px 0}label{display:flex;justify-content:space-between;align-items:center;gap:20px;margin:12px 0}input[type=color]{width:90px;height:38px}input[type=range]{width:50%}button{padding:10px 16px;border:0;border-radius:8px;margin:6px 6px 6px 0;cursor:pointer}textarea{width:100%;box-sizing:border-box;height:220px;background:#0d160f;color:#dcf3d5;padding:12px;border:1px solid #637d64}#swatch{height:130px;border-radius:12px}small{color:#b9c9b8}</style><main><h1>🌿 3D草原 カラー設定エディタ</h1><p>根元・中間・葉先・影の強さを調整。色見本は簡易プレビューです。Blenderの実際の陰影とは異なります。</p><section id="controls"></section><section><h2>葉の色プレビュー</h2><div id="swatch"></div><p id="readout"></p><small>左が根元、右が葉先。黒い影を抑える設定は実際のBlenderマテリアルで確認してください。</small></section><section><h2>設定JSON</h2><textarea id="json" spellcheck="false"></textarea><div><button id="apply">JSONを画面に反映</button><button id="copy">JSONをコピー</button><button id="download">JSONを保存</button><button id="reset">推奨値に戻す</button></div><small>保存したJSONを tools/floor6/meadow_color_preset.json に反映すると次のレンダリングで使用されます。</small></section></main><script>
const defaults={"version":1,"name":"F6 Meadow Anime V5","root":"#729A39","middle":"#648F32","tip":"#A4C94A","ground":"#607F31","shadowFloor":0.38,"emission":0.25,"roughness":0.88,"notes":"Colors are sRGB hex. shadowFloor mixes material with unlit vertex color to keep dark areas green; emission is an additional subtle lift."};
let data={...defaults};const defs=[['root','根元の色','color'],['middle','中間の色','color'],['tip','葉先の色','color'],['ground','地面の色','color'],['shadowFloor','暗部の色保持（0〜1）','range'],['emission','自己発光（0〜1）','range'],['roughness','マット感（0〜1）','range']];
const controls=document.getElementById('controls');function render(){controls.innerHTML='<h2>カラーと影</h2>';for(const [key,label,type] of defs){const row=document.createElement('label');const name=document.createElement('span');name.textContent=label;const input=document.createElement('input');input.type=type;input.value=data[key];if(type==='range'){input.min=0;input.max=1;input.step=.01}input.oninput=()=>{data[key]=type==='range'?Number(input.value):input.value;update()};row.append(name,input);controls.append(row)}update()}function update(){document.getElementById('swatch').style.background='linear-gradient(90deg,'+data.root+','+data.middle+','+data.tip+')';document.getElementById('readout').textContent='暗部の色保持 '+data.shadowFloor+' / 自己発光 '+data.emission+' / マット感 '+data.roughness;document.getElementById('json').value=JSON.stringify(data,null,2)}
document.getElementById('apply').onclick=()=>{try{data={...defaults,...JSON.parse(document.getElementById('json').value)};render()}catch(e){alert('JSONを確認してください: '+e.message)}};
document.getElementById('copy').onclick=()=>navigator.clipboard.writeText(JSON.stringify(data,null,2));
document.getElementById('download').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='meadow_color_preset.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
document.getElementById('reset').onclick=()=>{data={...defaults};render()};render();
</script></html>
