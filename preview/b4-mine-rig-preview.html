<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B4 廃坑小物プレビュー</title><style>body{margin:0;background:#161015;color:#fff;font:14px sans-serif}#help{position:absolute;top:12px;left:12px;background:#1b1519dd;padding:12px;border-radius:6px}canvas{display:block}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script></head><body><div id="help"><b>第4階層：廃坑小物の造形確認</b><p>ドラッグ：回転 / ホイール：ズーム</p><p>ゲーム本編とは別の試作表示</p></div><script type="module">import * as THREE from 'three';import{createB4MineRigProps}from '../field/b4-mine-rig-props.js';const s=new THREE.Scene();s.background=new THREE.Color(0x25131a);const c=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,100);const r=new THREE.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);document.body.append(r.domElement);s.add(new THREE.HemisphereLight(0xffc2a0,0x292438,2.5));const l=new THREE.DirectionalLight(0xff7438,2);l.position.set(4,8,5);s.add(l);const p=new THREE.Mesh(new THREE.CylinderGeometry(5.5,6,0.3,12),new THREE.MeshStandardMaterial({color:0x403036,roughness:1}));p.position.y=-.25;s.add(p);s.add(createB4MineRigProps());let yaw=.7,pitch=.35,dist=12,drag=false,x=0,y=0;r.domElement.onpointerdown=e=>{drag=true;x=e.clientX;y=e.clientY;r.domElement.setPointerCapture(e.pointerId)};r.domElement.onpointerup=()=>drag=false;r.domElement.onpointermove=e=>{if(!drag)return;yaw+=(e.clientX-x)*.007;pitch=Math.max(-.1,Math.min(1.3,pitch+(e.clientY-y)*.007));x=e.clientX;y=e.clientY};r.domElement.onwheel=e=>dist=Math.max(6,Math.min(25,dist+e.deltaY*.01));onresize=()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)};function frame(){requestAnimationFrame(frame);c.position.set(Math.sin(yaw)*dist*Math.cos(pitch),2+Math.sin(pitch)*dist,Math.cos(yaw)*dist*Math.cos(pitch));c.lookAt(0,1.6,0);r.render(s,c)}frame();</script></body></html>
